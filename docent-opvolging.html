<!--
  docent-opvolging.html
  Opvolgingsladder van het docentscherm.
  Inhoud: drempel, stappen (leerling / ouders / avondstudie / leerling aan zet),
  afronden, berichten, iconen en het actiepaneel.
-->
<script>
    /** Alle taken die nu 'Niet in orde' zijn en meetellen (ongeacht pauze). */
    function openstaandeTakenIds(lln, klas) {
      const doelKlas = klas || (staat && staat.gekozenKlas);
      if (!lln || !doelKlas) return [];
      const taken = [];
      takenVoorKlas(doelKlas).forEach(function (taak) {
        if (!taakTeltMeeVoorOpvolging(taak)) return;
        const reg = laatsteRegistratieVoorKlas(lln, taak, doelKlas);
        if (reg && reg.status === 'Niet in orde' && !registratieTeltNietMee(lln, reg)) {
          taken.push(taak.id);
        }
      });
      return taken;
    }

    function aantalOpenstaandeTaken(lln, klas) {
      return openstaandeTakenIds(lln, klas).length;
    }

    function aantalNietInOrde(lln) {
      if (!lln || !staat.gekozenKlas) return 0;
      // Geen nieuwe tekorten tellen tijdens pauze (drempel / opvolgstappen).
      if (opvolgingVan(lln).gepauzeerd) return 0;
      return aantalOpenstaandeTaken(lln);
    }

    function opvolgingVan(lln) {
      return {
        leerling:      String(lln && lln.opvolgingLeerlingOp  ? lln.opvolgingLeerlingOp  : '').trim(),
        ouders:        String(lln && lln.opvolgingOudersOp    ? lln.opvolgingOudersOp    : '').trim(),
        nablijf:       String(lln && lln.opvolgingNablijfOp   ? lln.opvolgingNablijfOp   : '').trim(),
        gepauzeerd:    String(lln && lln.opvolgingGepauzeerd  ? lln.opvolgingGepauzeerd  : '').trim(),
        blokkeerTaken: Array.isArray(lln && lln.opvolgingBlokkeerTaken) ? lln.opvolgingBlokkeerTaken : []
      };
    }

    function heeftLopendeOpvolging(lln) {
      if (!lln) return false;
      const o = opvolgingVan(lln);
      return !!(o.leerling || o.ouders || o.nablijf || o.gepauzeerd);
    }

    /** Rond de cyclus af als er niets meer openstaat, of als een pauze volledig is afgevinkt. */
    function wisOpvolgingBijGeenTekorten(lln) {
      if (!lln || !opvolgingAan()) return;
      if (opvolgingVan(lln).gepauzeerd) {
        if (isPauzeKlaar(lln)) slaOpvolgingOp(lln.id, 'pauze-opheffen');
        return;
      }
      if (aantalOpenstaandeTaken(lln) > 0) return;
      if (!heeftLopendeOpvolging(lln)) return;
      slaOpvolgingOp(lln.id, 'afronden', { stil: true });
    }

    function taakAfgehandeldVoorPauze(lln, reg) {
      if (!reg) return false;
      if (reg.status === 'In orde' || reg.status === 'Al opgevolgd') return true;
      return registratieTeltNietMee(lln, reg);
    }

    /** True als oude én nieuwe openstaande taken in orde of al opgevolgd zijn. */
    function isPauzeKlaar(lln) {
      const o = opvolgingVan(lln);
      if (!o.gepauzeerd || !staat.gekozenKlas) return false;
      if (aantalOpenstaandeTaken(lln) > 0) return false;
      if (!o.blokkeerTaken.length) return false;
      return o.blokkeerTaken.every(function (taakId) {
        const taak = taakOpId(taakId);
        if (!taak) return true;
        return taakAfgehandeldVoorPauze(lln, laatsteRegistratieVoorKlas(lln, taak, staat.gekozenKlas));
      });
    }

    /**
     * Bepaalt de volgende actie voor een leerling.
     * Mogelijke waarden: '' | 'leerling' | 'ouders' | 'nablijf' | 'evaluatie'
     *                  | 'gepauzeerd' | 'pauze-klaar' | 'afronden'
     */
    /** Volgende ladderstap, zonder drempelcheck (voor "Toch doorgaan"). */
    function opvolgLadderStap(lln) {
      const o = opvolgingVan(lln);
      if (!o.leerling) return 'leerling';
      if (!o.ouders)   return 'ouders';
      if (!o.nablijf)  return 'nablijf';
      return 'evaluatie';
    }

    function opvolgActieNodig(lln) {
      if (!opvolgingAan()) return '';
      const o = opvolgingVan(lln);
      const openstaand = aantalOpenstaandeTaken(lln);

      if (o.gepauzeerd) {
        if (openstaand > 0) return 'gepauzeerd';
        return isPauzeKlaar(lln) ? 'pauze-klaar' : '';
      }

      // Geen openstaande tekorten → geen actie (ook niet 'afronden' of verder in de ladder).
      if (openstaand === 0) {
        if (staat.opvolgingDoorgaan && staat.opvolgingDoorgaan[lln.id]) {
          delete staat.opvolgingDoorgaan[lln.id];
        }
        return '';
      }

      const drempel = drempelNietInOrde();
      const heeftStap = !!(o.leerling || o.ouders || o.nablijf);

      // Boven drempel: normale ladder; wis eventuele "toch doorgaan"-vlag.
      if (openstaand >= drempel) {
        if (staat.opvolgingDoorgaan && staat.opvolgingDoorgaan[lln.id]) {
          delete staat.opvolgingDoorgaan[lln.id];
        }
      } else if (heeftStap) {
        // Onder drempel met lopende opvolging → afrondingsmodus, tenzij docent doorgaat.
        if (staat.opvolgingDoorgaan && staat.opvolgingDoorgaan[lln.id]) {
          return opvolgLadderStap(lln);
        }
        return 'afronden';
      } else {
        return '';
      }

      if (!o.leerling) return 'leerling';
      if (!o.ouders)   return 'ouders';
      if (!o.nablijf)  return 'nablijf';
      return 'evaluatie';
    }

    /** Verzamelt de IDs van taken die nu 'Niet in orde' zijn (voor de pauze-modus). */
    function verzamelBlokkeerTaken(lln) {
      return openstaandeTakenIds(lln);
    }

    const AL_OPGEVOLGD = 'Al opgevolgd';

    function opvolgIcoonSvg(stap, px) {
      const s = px || 14;
      const kop = '<svg xmlns="http://www.w3.org/2000/svg" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
      if (stap === 'ouders') {
        return kop + '<rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>';
      }
      if (stap === 'nablijf') {
        return kop + '<circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>';
      }
      if (stap === 'afronden' || stap === 'reset' || stap === 'pauze-opheffen') {
        return kop + '<polyline points="20 6 9 17 4 12" /></svg>';
      }
      if (stap === 'evaluatie') {
        return kop + '<circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" /></svg>';
      }
      if (stap === 'gepauzeerd' || stap === 'pauze-klaar') {
        return kop + '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>';
      }
      return kop + '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg>';
    }

    function opvolgSeinHtml(lln) {
      const stap = opvolgActieNodig(lln);
      if (!stap) return '';
      const titel = {
        leerling:     'Leerling laten weten: taken inhalen tegen de volgende les',
        ouders:       'Bericht naar de ouders',
        nablijf:      'Avondstudie',
        evaluatie:    'Evalueer het resultaat van de avondstudie',
        gepauzeerd:   'Leerling aan zet — oude én nieuwe taken moeten in orde of opgevolgd zijn',
        'pauze-klaar':'Alle taken afgevinkt — opvolging kan worden afgerond',
        afronden:     'Opvolging kan worden afgesloten'
      }[stap];
      return '<span class="opvolg-sein" title="' + escapeAttr(titel || '') + '">' + opvolgIcoonSvg(stap, 14) + '</span>';
    }

    function opvolgStapLabel(stap) {
      if (stap === 'ouders')    return 'Ouders';
      if (stap === 'nablijf')   return 'Avondstudie';
      if (stap === 'evaluatie') return 'Evaluatie';
      return 'Leerling';
    }

    function htmlOpvolgActies() {
      // Gepauzeerd: geen nieuwe cyclus. Pas als oude én nieuwe taken afgevinkt zijn, afronden.
      const items = leerlingenVanKlas().filter(function (lln) {
        const stap = opvolgActieNodig(lln);
        return !!stap && stap !== 'gepauzeerd';
      });
      if (!items.length) return '';
      const namen = items.map(function (lln) {
        return '<button type="button" class="font-semibold underline decoration-amber-400/80 hover:text-amber-700" data-actie="leerling-fiche" data-id="' +
          escapeAttr(lln.id) + '">' + escapeHtml(lln.naam) + '</button>';
      }).join(', ');
      return 'Actie nodig: ' + namen;
    }

    function tekenOpvolgActies() {
      const balk = document.getElementById('opvolg-acties');
      if (!balk) return;
      const html = htmlOpvolgActies();
      balk.innerHTML = html;
      balk.classList.toggle('hidden', !html);
    }

    function verversOpvolgSein(llnId) {
      const lln = leerlingOpId(llnId);
      let knop = null;
      document.querySelectorAll('.naam-tekst[data-actie="leerling-fiche"]').forEach(function (el) {
        if (el.getAttribute('data-id') === String(llnId || '')) knop = el;
      });
      if (knop && lln) {
        const bestaand = knop.querySelector('.opvolg-sein');
        if (bestaand) bestaand.remove();
        knop.insertAdjacentHTML('beforeend', opvolgSeinHtml(lln));
      }
      tekenOpvolgActies();
      const wrapper = document.getElementById('kruistabel-wrapper');
      if (wrapper) lijnKoppenOpTabel(wrapper);
    }

    /**
     * Vernieuwt alleen de opvolgings-UI voor één leerling — zonder de volledige
     * kruistabel of leerlingenview te herbouwen. Voorkomt het verspringen van
     * knoppen terwijl de GAS-call op de achtergrond loopt.
     *
     * Raakt aan:
     *  - het sein-icoontje in de kruistabel-naamknop
     *  - de opvolgingsbalk in de leerling-detailview
     *  - de opvolgingssectie in de fiche (als die open staat)
     */
    /** Hertekendt de kruistabel-cellen van één leerling zonder de hele tabel opnieuw te bouwen. */
    function verversCellenVoorLeerling(lln) {
      if (!lln) return;
      document.querySelectorAll('.cel-status[data-lln="' + lln.id + '"]').forEach(function (knop) {
        const taakId = knop.getAttribute('data-taak');
        const taak = taakOpId(taakId);
        if (!taak) return;
        const reg = laatsteRegistratieVoorKlas(lln, taak, staat.gekozenKlas);
        const status = reg ? reg.status : '';
        const teltNietMee = registratieTeltNietMee(lln, reg);
        const statusLabel = celStatusLabel(status, teltNietMee);
        const actief = celInSelectie(lln.id, taakId) ? ' cel-actief' : '';
        knop.className = 'cel-status' + actief + ' ' + celKlassen(status, teltNietMee);
        knop.textContent = celTekst(status);
        const titelDelen = [taakTitel(taak), statusLabel];
        if (reg && reg.opmerking) titelDelen.push(reg.opmerking);
        knop.title = titelDelen.join(' — ');
        knop.setAttribute('aria-label', lln.naam + ': ' + taakTitel(taak) + ', ' + statusLabel);
      });
    }

    function verversOpvolgingUI(lln) {
      if (!lln) return;
      // 1. Kruistabel-cellen voor deze leerling (bijv. kleur verandert na reset/pauze).
      verversCellenVoorLeerling(lln);
      // 2. Sein-icoontje + opvolgacties-balk bovenaan de kruistabel.
      verversOpvolgSein(lln.id);
      // 3. Opvolgingsbalk in de leerling-detailview.
      const balk = document.querySelector('[data-opvolg-balk][data-lln="' + lln.id + '"]');
      if (balk) balk.innerHTML = htmlOpvolgingBalk(lln);
      // 4. Opvolgingssectie in de fiche (alleen als de fiche van deze leerling open staat).
      if (staat.modal === 'fiche') {
        const ficheKnop = document.getElementById('knop-leerling-verwijderen');
        if (ficheKnop && ficheKnop.getAttribute('data-id') === lln.id) {
          tekenFicheOpvolging(lln);
        }
      }
    }

    function laatsteOpvolgStap(lln) {
      const o = opvolgingVan(lln);
      if (o.gepauzeerd) return 'pauze-wissen'; // Terug = pauze ongedaan maken (nablijf blijft)
      if (o.nablijf)    return 'nablijf';
      if (o.ouders)     return 'ouders';
      if (o.leerling)   return 'leerling';
      return '';
    }

    function htmlOpvolgingStappen(leerling) {
      const volgende = opvolgActieNodig(leerling);
      const ov = opvolgingVan(leerling);
      const stappen = [
        { id: 'leerling',  uitleg: 'Laten weten: taken inhalen tegen de volgende les' },
        { id: 'ouders',    uitleg: 'Bericht naar de ouders' },
        { id: 'nablijf',   uitleg: 'Avondstudie — opnieuw bericht naar de ouders' },
        { id: 'evaluatie', uitleg: 'Evalueer het resultaat van de avondstudie' }
      ];
      return stappen.map(function (stap) {
        let klaar = !!ov[stap.id];
        if (stap.id === 'evaluatie') klaar = !!ov.gepauzeerd; // gepauzeerd = evaluatie gezet
        const aan = volgende === stap.id ||
          (stap.id === 'evaluatie' && (volgende === 'gepauzeerd' || volgende === 'pauze-klaar'));
        let klasse = 'flex flex-col items-center gap-1 rounded-lg px-1 py-2 text-center text-[10px] font-semibold border w-full ';
        if (klaar) klasse += 'bg-white border-emerald-200 text-emerald-700';
        else if (aan) klasse += 'bg-amber-400 border-amber-500 text-amber-950 ring-2 ring-amber-300/60';
        else klasse += 'bg-white/50 border-transparent text-amber-900/35';
        const titel = klaar ? 'Klaar: ' + stap.uitleg : (aan ? 'Nu: ' + stap.uitleg : stap.uitleg);
        return '<div class="min-w-0">' +
          '<div class="' + klasse + '" title="' + escapeAttr(titel) + '" aria-current="' + (aan ? 'step' : 'false') + '">' +
          opvolgIcoonSvg(stap.id, 16) + '<span>' + escapeHtml(opvolgStapLabel(stap.id)) + '</span></div>' +
          '</div>';
      }).join('');
    }

    function htmlOpvolgKopieerKnop(leerling, stap) {
      stap = stap || opvolgActieNodig(leerling);
      const berichtStap = opvolgBerichtStap(stap);
      if (!berichtStap) return '';
      const mag = kopieerBerichtMag(berichtStap);
      const label = !mag ? 'Kies eerst de datum van de avondstudie'
        : (berichtStap === 'leerling' ? 'Bericht naar leerling kopiëren'
          : (berichtStap === 'aan-zet' ? 'Bericht leerling aan zet kopiëren'
            : 'Bericht naar ouders kopiëren'));
      return '<button type="button" class="inline-flex items-center justify-center gap-1 rounded-lg px-3 h-8 text-[11px] font-semibold text-amber-950 bg-white border border-amber-200 hover:bg-amber-100 disabled:opacity-30 disabled:hover:bg-white disabled:cursor-not-allowed" ' +
        'data-actie="opvolging-bericht" data-stap="' + berichtStap + '" data-id="' + escapeAttr(leerling.id) + '" ' +
        (mag ? '' : 'disabled ') +
        'title="' + escapeAttr(label) + '" aria-label="' + escapeAttr(label) + '">' +
        'E-mail' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /></svg>' +
        '</button>';
    }

    function htmlOpvolgVolgendeKnop(leerling, stap) {
      stap = stap || opvolgActieNodig(leerling);
      if (stap !== 'leerling' && stap !== 'ouders' && stap !== 'nablijf') return '';
      const mag = kopieerBerichtMag(stap);
      const label = !mag ? 'Kies eerst de datum van de avondstudie' : 'Volgende stap';
      return '<button type="button" class="inline-flex items-center justify-center gap-1 rounded-lg px-2.5 h-8 text-[11px] font-semibold text-white bg-amber-600 hover:bg-amber-700 disabled:opacity-30 disabled:hover:bg-amber-600 disabled:cursor-not-allowed" ' +
        'data-actie="opvolging-zet" data-stap="' + stap + '" data-id="' + escapeAttr(leerling.id) + '" ' +
        (mag ? '' : 'disabled ') +
        'title="' + escapeAttr(label) + '" aria-label="' + escapeAttr(label) + '">' +
        'Volgende' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>' +
        '</button>';
    }

    function htmlOpvolgActieRij(links, rechts) {
      return '<div class="flex items-center justify-between gap-1.5">' +
        '<div class="flex items-center gap-1.5 shrink-0">' + (links || '') + '</div>' +
        '<div class="flex items-center gap-1.5 shrink-0">' + (rechts || '') + '</div>' +
      '</div>';
    }

    function htmlOpvolgUitleg(volgende) {
      if (volgende === 'leerling')    return 'Spreek de leerling aan. Volgende zet de stap, Opgevolgd rondt de cyclus af.';
      if (volgende === 'ouders')      return 'Kopieer het bericht naar de ouders. Volgende zet de stap, Opgevolgd rondt de cyclus af.';
      if (volgende === 'nablijf')     return 'Kies de datum en kopieer het bericht. Volgende zet de stap, Opgevolgd rondt de cyclus af.';
      if (volgende === 'evaluatie')   return 'Kopieer de e-mail, Aan zet legt de verantwoordelijkheid bij de leerling, Opgevolgd rondt de cyclus af.';
      if (volgende === 'gepauzeerd')  return 'De leerling is aan zet. Nieuwe tekorten starten geen nieuwe cyclus. Oude én nieuwe taken moeten in orde of opgevolgd zijn.';
      if (volgende === 'pauze-klaar') return 'Alle openstaande taken zijn afgevinkt. Rond de cyclus af.';
      return 'Nog geen actie nodig.';
    }

    function htmlOpvolgAfrondingsBlok(leerling) {
      const afrondenKnop =
        '<button type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-4 h-9 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700" ' +
        'data-actie="opvolging-zet" data-stap="afronden" data-id="' + escapeAttr(leerling.id) + '" ' +
        'title="Opvolging afronden" aria-label="Opvolging afronden">' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>' +
        'Opvolging afronden</button>';
      const doorgaanKnop =
        '<button type="button" class="inline-flex items-center justify-center gap-1 rounded-lg px-3 h-9 text-xs font-semibold text-amber-950 bg-white border border-amber-200 hover:bg-amber-50" ' +
        'data-actie="opvolging-doorgaan" data-id="' + escapeAttr(leerling.id) + '" ' +
        'title="Doorgaan met de lopende opvolging" aria-label="Toch doorgaan">Toch doorgaan</button>';
      return '<div class="flex items-center justify-between gap-2">' +
        '<div>' + doorgaanKnop + '</div>' +
        '<div>' + afrondenKnop + '</div>' +
      '</div>';
    }

    function htmlOpvolgAfrondenKnop(leerling) {
      return '<button type="button" class="inline-flex items-center justify-center gap-1 rounded-lg px-3 h-8 text-[11px] font-semibold text-white bg-emerald-600 hover:bg-emerald-700" ' +
        'data-actie="opvolging-zet" data-stap="reset" data-id="' + escapeAttr(leerling.id) + '" ' +
        'title="Opgevolgd: cyclus afronden — de leerling heeft de taken in orde gebracht" aria-label="Opgevolgd — cyclus afronden">' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>' +
        'Opgevolgd</button>';
    }

    function htmlOpvolgTerugKnop(leerling) {
      const stap = laatsteOpvolgStap(leerling);
      const zichtbaar = !!stap;
      const label = stap === 'pauze-wissen' ? 'Aan zet ongedaan maken' : 'Laatste stap ongedaan maken';
      return '<button type="button" class="inline-flex items-center justify-center gap-1 rounded-lg px-2.5 h-8 text-[11px] font-semibold text-amber-900/80 hover:bg-amber-100 hover:text-amber-950' +
        (zichtbaar ? '' : ' invisible pointer-events-none') + '" ' +
        (zichtbaar
          ? 'data-actie="opvolging-terug" data-stap="' + stap + '" data-id="' + escapeAttr(leerling.id) + '" title="' + escapeAttr(label) + '" aria-label="' + escapeAttr(label) + '"'
          : 'disabled tabindex="-1" aria-hidden="true"') +
        '>' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6" /><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 2.8L3 13" /></svg>' +
        'Terug</button>';
    }

    function htmlOpvolgEvaluatieKnoppen(leerling) {
      const pauzeerKnop =
        '<button type="button" class="inline-flex items-center justify-center gap-1 rounded-lg px-3 h-8 text-[11px] font-semibold text-amber-950 bg-white border border-amber-200 hover:bg-amber-50" ' +
        'data-actie="opvolging-zet" data-stap="pauzeer" data-id="' + escapeAttr(leerling.id) + '" ' +
        'title="Leerling aan zet: de verantwoordelijkheid ligt bij de leerling tot de openstaande taken in orde of opgevolgd zijn" aria-label="Leerling aan zet">' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>' +
        'Aan zet</button>';
      const geslaagdKnop =
        '<button type="button" class="inline-flex items-center justify-center gap-1 rounded-lg px-3 h-8 text-[11px] font-semibold text-white bg-emerald-600 hover:bg-emerald-700" ' +
        'data-actie="opvolging-zet" data-stap="pauze-opheffen" data-id="' + escapeAttr(leerling.id) + '" ' +
        'title="Opgevolgd: cyclus afronden" aria-label="Opgevolgd — cyclus afronden">' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>' +
        'Opgevolgd</button>';
      return htmlOpvolgActieRij(htmlOpvolgTerugKnop(leerling), htmlOpvolgKopieerKnop(leerling, 'aan-zet') + pauzeerKnop + geslaagdKnop);
    }

    function htmlOpvolgPauzeBlok(leerling, volgende) {
      const klaar = volgende === 'pauze-klaar';
      const opheffenLabel = klaar ? 'Cyclus afronden' : 'Toch afronden';
      const opheffenTitle = klaar
        ? 'Alle taken in orde — cyclus afronden'
        : 'Aan zet handmatig stoppen en cyclus afronden';
      const opheffenKlasse = klaar
        ? 'text-white bg-emerald-600 hover:bg-emerald-700'
        : 'text-amber-950 bg-white border border-amber-200 hover:bg-amber-50';
      const opheffenKnop =
        '<button type="button" class="inline-flex items-center justify-center gap-1 rounded-lg px-3 h-8 text-[11px] font-semibold ' + opheffenKlasse + '" ' +
        'data-actie="opvolging-zet" data-stap="pauze-opheffen" data-id="' + escapeAttr(leerling.id) + '" ' +
        'title="' + escapeAttr(opheffenTitle) + '" aria-label="' + escapeAttr(opheffenTitle) + '">' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>' +
        opheffenLabel + '</button>';

      return htmlOpvolgActieRij(htmlOpvolgTerugKnop(leerling), htmlOpvolgKopieerKnop(leerling, 'aan-zet') + opheffenKnop);
    }

    function htmlAvondstudieDatumVeld(zichtbaar) {
      if (!zichtbaar) return '<div class="h-8" aria-hidden="true"></div>';
      const iso = leesAvondstudieDatum();
      return '<label class="flex items-center gap-2 h-8">' +
        '<span class="text-[11px] font-semibold text-amber-950 shrink-0">Datum avondstudie</span>' +
        '<input type="date" class="veld-avondstudie-datum h-8 min-w-0 flex-1 rounded-lg border border-amber-200 bg-white px-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-400" value="' + escapeAttr(iso) + '" />' +
        '</label>';
    }

    function htmlOpvolgingActiePaneel(leerling) {
      const volgende = opvolgActieNodig(leerling);
      const delen = [];

      if (volgende === 'evaluatie') {
        delen.push(htmlAvondstudieDatumVeld(false));
        delen.push(htmlOpvolgEvaluatieKnoppen(leerling));

      } else if (volgende === 'gepauzeerd' || volgende === 'pauze-klaar') {
        delen.push(htmlAvondstudieDatumVeld(false));
        delen.push(htmlOpvolgPauzeBlok(leerling, volgende));

      } else if (volgende === 'afronden') {
        delen.push(htmlOpvolgAfrondingsBlok(leerling));

      } else {
        const heeftActie = volgende === 'leerling' || volgende === 'ouders' || volgende === 'nablijf';
        if (heeftActie) {
          delen.push(htmlAvondstudieDatumVeld(berichtVraagtDatum(volgende)));
          delen.push(htmlOpvolgActieRij(
            htmlOpvolgTerugKnop(leerling) + htmlOpvolgVolgendeKnop(leerling, volgende),
            htmlOpvolgKopieerKnop(leerling, volgende) + htmlOpvolgAfrondenKnop(leerling)
          ));
        }
      }

      if (!delen.length) return '';
      return '<div class="space-y-2" data-opvolg-acties data-id="' + escapeAttr(leerling.id) + '">' + delen.join('') + '</div>';
    }

    function openstaandeTakenTekst(lln) {
      const namen = [];
      if (!lln || !staat.gekozenKlas) return '• (geen openstaande taken)';
      takenVoorKlas(staat.gekozenKlas).forEach(function (taak) {
        if (!taakTeltMeeVoorOpvolging(taak)) return;
        const reg = laatsteRegistratieVoorKlas(lln, taak, staat.gekozenKlas);
        if (!reg || reg.status !== 'Niet in orde') return;
        if (registratieTeltNietMee(lln, reg)) return;
        namen.push('• ' + taakTitel(taak));
      });
      return namen.length ? namen.join('\n') : '• (geen openstaande taken)';
    }

    function nietInOrdeTaakIds(lln) {
      const ids = [];
      if (!lln || !staat.gekozenKlas) return ids;
      takenVoorKlas(staat.gekozenKlas).forEach(function (taak) {
        const reg = laatsteRegistratieVoorKlas(lln, taak, staat.gekozenKlas);
        if (reg && reg.status === 'Niet in orde') ids.push(taak.id);
      });
      return ids;
    }

    /** Zet openstaande rode kruisjes om naar Al opgevolgd, zodat de leerlingview het ook ziet. */
    function schrijfNietInOrdeAlsAlOpgevolgd(lln, taakIds) {
      const klas = staat.gekozenKlas || '';
      (taakIds || []).forEach(function (taakId) {
        const taak = taakOpId(taakId);
        const vorige = laatsteRegistratieVoorKlas(lln, taak, klas);
        slaRegistratieOp({
          llnId: lln.id,
          taakId: taakId,
          status: AL_OPGEVOLGD,
          opmerking: (vorige && vorige.opmerking) || '',
          klas: klas
        });
      });
    }

    function opvolgBerichtStap(stap) {
      if (stap === 'leerling' || stap === 'ouders' || stap === 'nablijf' || stap === 'aan-zet') return stap;
      if (stap === 'evaluatie' || stap === 'gepauzeerd' || stap === 'pauze-klaar') return 'aan-zet';
      return '';
    }

    function opvolgBerichtSjabloon(stap) {
      const inst = staat.instellingen || {};
      const berichtStap = opvolgBerichtStap(stap) || stap;
      if (berichtStap === 'ouders') return inst.berichtOuders || DEFAULT_OPVOLGING.berichtOuders;
      if (berichtStap === 'nablijf') return inst.berichtNablijf || DEFAULT_OPVOLGING.berichtNablijf;
      if (berichtStap === 'aan-zet') return inst.berichtAanZet || DEFAULT_OPVOLGING.berichtAanZet;
      return inst.berichtLeerling || DEFAULT_OPVOLGING.berichtLeerling;
    }

    function berichtVraagtDatum(stap) {
      return stap === 'nablijf' && /\{datum(\/dag)?\}/.test(opvolgBerichtSjabloon('nablijf'));
    }

    function isIsoDatum(waarde) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(waarde || '').trim());
    }

    function leesAvondstudieDatum() {
      if (isIsoDatum(staat.avondstudieDatum)) return staat.avondstudieDatum;
      try {
        const ruw = sessionStorage.getItem('opvolgtool-avondstudie-datum') || '';
        if (isIsoDatum(ruw)) {
          staat.avondstudieDatum = ruw;
          return ruw;
        }
      } catch (e) { /* negeren */ }
      return '';
    }

    function zetAvondstudieDatum(waarde) {
      const iso = isIsoDatum(waarde) ? String(waarde).trim() : '';
      staat.avondstudieDatum = iso;
      try {
        if (iso) sessionStorage.setItem('opvolgtool-avondstudie-datum', iso);
        else sessionStorage.removeItem('opvolgtool-avondstudie-datum');
      } catch (e) { /* negeren */ }
      document.querySelectorAll('.veld-avondstudie-datum').forEach(function (veld) {
        if (veld.value !== iso) veld.value = iso;
      });
      document.querySelectorAll('[data-actie="opvolging-bericht"], [data-actie="opvolging-zet"]').forEach(function (knop) {
        const stap = knop.getAttribute('data-stap');
        if (!berichtVraagtDatum(stap)) return;
        if (knop.getAttribute('data-actie') === 'opvolging-zet' && stapOpvolgingGezet(leerlingOpId(knop.getAttribute('data-id')), stap)) return;
        const mag = kopieerBerichtMag(stap);
        knop.disabled = !mag;
        const label = mag
          ? (knop.getAttribute('data-actie') === 'opvolging-bericht' ? 'Bericht naar ouders kopiëren' : 'Volgende stap')
          : 'Kies eerst de datum van de avondstudie';
        knop.setAttribute('title', label);
        knop.setAttribute('aria-label', label);
      });
    }

    function kopieerBerichtMag(stap) {
      if (!berichtVraagtDatum(stap)) return true;
      return !!leesAvondstudieDatum();
    }

    function vulOpvolgBericht(sjabloon, lln, extra) {
      extra = extra || {};
      const naam = String(lln && lln.naam ? lln.naam : '').trim();
      const voornaam = naam.split(/\s+/)[0] || naam;
      const klas = klasLabel(staat.gekozenKlas || (lln && lln.klas) || '');
      const drempel = String(drempelNietInOrde());
      const datum = String(extra.datum || '').trim();
      return String(sjabloon || '')
        .replace(/\{voornaam\}/g, voornaam)
        .replace(/\{naam\}/g, naam)
        .replace(/\{klas\}/g, klas)
        .replace(/\{drempel\}/g, drempel)
        .replace(/\{taken\}/g, extra.taken || openstaandeTakenTekst(lln))
        .replace(/\{stappen\}/g, extra.stappen || opvolgStappenTekst(lln))
        .replace(/\{datum\/dag\}/g, datum)
        .replace(/\{datum\}/g, datum);
    }

    function formatteerOpvolgDatum(waarde) {
      const s = String(waarde || '').trim();
      const iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
      if (!iso) return s;
      return formatteerAvondstudieDatum(iso[1] + '-' + iso[2] + '-' + iso[3]);
    }

    function opvolgStappenTekst(lln) {
      const naam = String(lln && lln.naam ? lln.naam : '').trim();
      const voornaam = naam.split(/\s+/)[0] || naam || 'de leerling';
      const o = opvolgingVan(lln);
      const regels = [];
      if (o.leerling) regels.push('• ' + voornaam + ' is persoonlijk aangesproken (' + formatteerOpvolgDatum(o.leerling) + ')');
      if (o.ouders) regels.push('• De ouders zijn verwittigd (' + formatteerOpvolgDatum(o.ouders) + ')');
      if (o.nablijf) regels.push('• Avondstudie is ingepland (' + formatteerOpvolgDatum(o.nablijf) + ')');
      return regels.length ? regels.join('\n') : '• De eerdere opvolgstappen zijn doorlopen';
    }

    function formatteerAvondstudieDatum(waarde) {
      const s = String(waarde || '').trim();
      const iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
      if (!iso) return s;
      const d = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
      if (isNaN(d.getTime())) return s;
      const dagen = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
      const maanden = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
      return dagen[d.getDay()] + ' ' + d.getDate() + ' ' + maanden[d.getMonth()] + ' ' + d.getFullYear();
    }

    function kopieerOpvolgBericht(id, stap) {
      const leerling = leerlingOpId(id);
      if (!leerling || !opvolgBerichtStap(stap)) return;
      const sjabloon = opvolgBerichtSjabloon(stap);
      const extra = {};
      if (berichtVraagtDatum(stap)) {
        const iso = leesAvondstudieDatum();
        if (!iso) {
          toonMelding('Kies eerst de datum van de avondstudie.', 'fout');
          return;
        }
        extra.datum = formatteerAvondstudieDatum(iso);
      }
      const tekst = vulOpvolgBericht(sjabloon, leerling, extra).trim();
      if (!tekst) {
        toonMelding('Er is geen bericht ingesteld voor deze stap.', 'fout');
        return;
      }
      kopieerTekst(tekst, function () {
        toonMelding('Bericht gekopieerd.', 'ok');
      });
    }

    function tekstAfrondingsModus(openstaand, drempel) {
      const en = openstaand === 1 ? '' : 'en';
      return 'De leerling heeft nu ' + openstaand + ' openstaande tekort' + en +
        ' (drempel: ' + drempel + '). De lopende opvolging is niet meer nodig.';
    }

    function tekenFicheOpvolging(leerling) {
      const wrap = document.getElementById('fiche-opvolging');
      if (!wrap) return;
      const actieEl = document.getElementById('fiche-opvolging-actie');
      if (!opvolgingAan()) {
        wrap.classList.add('hidden');
        if (actieEl) actieEl.innerHTML = '';
        return;
      }
      const openstaand = aantalOpenstaandeTaken(leerling);
      const o = opvolgingVan(leerling);
      const drempel = drempelNietInOrde();
      const volgende = opvolgActieNodig(leerling);
      const tonen = !!volgende || openstaand >= drempel;
      wrap.classList.toggle('hidden', !tonen);
      if (!tonen) {
        if (actieEl) actieEl.innerHTML = '';
        return;
      }
      const n = aantalNietInOrde(leerling);
      const stappenEl = document.getElementById('fiche-opvolging-stappen');
      const reset = document.getElementById('knop-opvolging-reset');

      if (volgende === 'afronden') {
        document.getElementById('fiche-opvolging-titel').textContent = 'Opvolging kan worden afgesloten';
        document.getElementById('fiche-opvolging-uitleg').textContent = tekstAfrondingsModus(openstaand, drempel);
        stappenEl.innerHTML = '';
        stappenEl.className = 'hidden';
        if (actieEl) actieEl.innerHTML = htmlOpvolgAfrondingsBlok(leerling);
        reset.classList.add('hidden');
        reset.removeAttribute('data-id');
        return;
      }

      document.getElementById('fiche-opvolging-titel').textContent =
        (o.gepauzeerd ? 'Leerling aan zet — ' : '') +
        (o.gepauzeerd ? openstaand : n) + '× niet in orde (drempel ' + drempel + ')';
      document.getElementById('fiche-opvolging-uitleg').textContent = htmlOpvolgUitleg(volgende);
      stappenEl.className = 'mt-2 grid grid-cols-4 gap-1.5';
      stappenEl.innerHTML = htmlOpvolgingStappen(leerling);
      if (actieEl) actieEl.innerHTML = htmlOpvolgingActiePaneel(leerling);
      reset.classList.add('hidden');
      reset.removeAttribute('data-id');
    }

    function htmlOpvolgingBalk(leerling) {
      if (!opvolgingAan()) return '';
      const openstaand = aantalOpenstaandeTaken(leerling);
      const o = opvolgingVan(leerling);
      const volgende = opvolgActieNodig(leerling);
      if (!volgende && openstaand < drempelNietInOrde()) return '';
      const n = aantalNietInOrde(leerling);
      const drempel = drempelNietInOrde();

      if (volgende === 'afronden') {
        return '<div class="mx-2 mb-2 rounded-xl border border-amber-200 bg-amber-50 p-2.5">' +
          '<p class="text-[11px] font-semibold text-amber-950">Opvolging kan worden afgesloten</p>' +
          '<p class="text-[11px] text-amber-900/80 mt-0.5">' + escapeHtml(tekstAfrondingsModus(openstaand, drempel)) + '</p>' +
          '<div class="mt-2">' + htmlOpvolgAfrondingsBlok(leerling) + '</div>' +
          '</div>';
      }

      const titelTekst = (o.gepauzeerd ? 'Leerling aan zet — ' : '') + (o.gepauzeerd ? openstaand : n) + '× niet in orde';
      return '<div class="mx-2 mb-2 rounded-xl border border-amber-200 bg-amber-50 p-2.5">' +
        '<div class="flex items-start justify-between gap-2">' +
          '<div class="min-w-0 w-full">' +
            '<p class="text-[11px] font-semibold text-amber-950">' + escapeHtml(titelTekst) + '</p>' +
            '<p class="text-[11px] text-amber-900/80 mt-0.5 leading-snug h-8 overflow-hidden">' + escapeHtml(htmlOpvolgUitleg(volgende)) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="mt-2 grid grid-cols-4 gap-1.5">' + htmlOpvolgingStappen(leerling) + '</div>' +
        '<div class="mt-2">' + htmlOpvolgingActiePaneel(leerling) + '</div>' +
        '</div>';
    }

    function stapOpvolgingGezet(leerling, stap) {
      const o = opvolgingVan(leerling);
      return !!(o && o[stap]);
    }

    function wisOpvolgingVanaf(leerling, stap) {
      if (stap === 'leerling') {
        leerling.opvolgingLeerlingOp = '';
        leerling.opvolgingOudersOp = '';
        leerling.opvolgingNablijfOp = '';
      } else if (stap === 'ouders') {
        leerling.opvolgingOudersOp = '';
        leerling.opvolgingNablijfOp = '';
      } else if (stap === 'nablijf') {
        leerling.opvolgingNablijfOp = '';
      }
    }

    function zetOpvolgingDoorgaan(id) {
      if (!id) return;
      if (!staat.opvolgingDoorgaan) staat.opvolgingDoorgaan = {};
      staat.opvolgingDoorgaan[id] = true;
      const lln = leerlingOpId(id);
      if (lln) verversOpvolgingUI(lln);
    }

    function isLadderStap(stap) {
      return stap === 'leerling' || stap === 'ouders' || stap === 'nablijf';
    }

    function vroegsteResetOp(a, b) {
      const links = String(a || '').trim();
      const rechts = String(b || '').trim();
      if (!links) return rechts;
      if (!rechts) return links;
      return links <= rechts ? links : rechts;
    }

    function volgendeOpvolgingVersie(id) {
      if (!staat.opvolgingVersie) staat.opvolgingVersie = {};
      staat.opvolgingVersie[id] = (staat.opvolgingVersie[id] || 0) + 1;
      return staat.opvolgingVersie[id];
    }

    function isHuidigeOpvolgingVersie(id, versie) {
      return !!(staat.opvolgingVersie && staat.opvolgingVersie[id] === versie);
    }

    function opvolgKlikGeblokkeerd(id) {
      const tot = staat.opvolgingKlikTot && staat.opvolgingKlikTot[id];
      return !!(tot && Date.now() < tot);
    }

    function blokkeerOpvolgKlik(id) {
      if (!staat.opvolgingKlikTot) staat.opvolgingKlikTot = {};
      staat.opvolgingKlikTot[id] = Date.now() + 450;
    }

    function zetOpvolgKnoppenBezet(id) {
      const zet = function (aan) {
        document.querySelectorAll('[data-opvolg-acties][data-id="' + id + '"]').forEach(function (el) {
          el.classList.toggle('pointer-events-none', aan);
          el.classList.toggle('opacity-50', aan);
        });
        const fiche = document.getElementById('fiche-opvolging-actie');
        const ficheKnop = document.getElementById('knop-leerling-verwijderen');
        if (fiche && ficheKnop && ficheKnop.getAttribute('data-id') === id) {
          fiche.classList.toggle('pointer-events-none', aan);
          fiche.classList.toggle('opacity-50', aan);
        }
      };
      zet(true);
      setTimeout(function () { zet(false); }, 450);
    }

    function slaOpvolgingNaarServer(payload, onSuccess, onFailure) {
      if (!staat.opvolgingWachtrij) staat.opvolgingWachtrij = [];
      staat.opvolgingWachtrij.push({ payload: payload, onSuccess: onSuccess, onFailure: onFailure });
      startOpvolgingVerzending();
    }

    function startOpvolgingVerzending() {
      if (staat.opvolgingBezig) return;
      if (!staat.opvolgingWachtrij || !staat.opvolgingWachtrij.length) return;
      const run = gasRun();
      if (!run) {
        setTimeout(startOpvolgingVerzending, 80);
        return;
      }
      const next = staat.opvolgingWachtrij.shift();
      staat.opvolgingBezig = true;
      run
        .withSuccessHandler(function (antwoord) {
          staat.opvolgingBezig = false;
          if (next.onSuccess) next.onSuccess(antwoord);
          startOpvolgingVerzending();
        })
        .withFailureHandler(function (fout) {
          const id = next.payload && next.payload.id;
          if (id && staat.opvolgingWachtrij) {
            staat.opvolgingWachtrij = staat.opvolgingWachtrij.filter(function (item) {
              return !(item.payload && item.payload.id === id);
            });
          }
          staat.opvolgingBezig = false;
          if (next.onFailure) next.onFailure(fout);
          startOpvolgingVerzending();
        })
        .zetLeerlingOpvolging(next.payload);
    }

    function vraagOpvolgingTerug(id, stap) {
      if (!opvolgingAan() || !id || opvolgKlikGeblokkeerd(id)) return;
      const leerling = leerlingOpId(id);
      if (!leerling) return;
      if (stap !== laatsteOpvolgStap(leerling)) return;
      blokkeerOpvolgKlik(id);
      if (stap === 'pauze-wissen') slaOpvolgingOp(id, stap);
      else slaOpvolgingOp(id, stap, { wissen: true });
    }

    function vraagOpvolging(id, stap) {
      if (!opvolgingAan()) return;
      if (id && opvolgKlikGeblokkeerd(id)) return;
      if (stap === 'afronden') {
        openBevestig(
          'Opvolging afronden?',
          'De lopende opvolging wordt stopgezet. Bestaande kruisjes blijven gewoon rood en tellen mee tot de drempel opnieuw bereikt is.',
          function () { slaOpvolgingOp(id, 'afronden'); },
          'Afronden',
          'bg-emerald-600 text-white hover:bg-emerald-700'
        );
        return;
      }
      if (stap === 'reset') {
        openBevestig(
          'Opvolging afronden?',
          'De cyclus stopt hier. Bestaande kruisjes blijven staan, maar tellen niet meer mee voor een volgende cyclus.',
          function () { slaOpvolgingOp(id, 'reset'); },
          'Opgevolgd — afronden',
          'bg-emerald-600 text-white hover:bg-emerald-700'
        );
        return;
      }
      if (stap === 'pauzeer') {
        openBevestig(
          'Leerling aan zet?',
          'De verantwoordelijkheid ligt bij de leerling. Nieuwe tekorten starten geen nieuwe cyclus. Dit eindigt pas als oude én nieuwe openstaande taken in orde of opgevolgd zijn.',
          function () { slaOpvolgingOp(id, 'pauzeer'); },
          'Aan zet',
          'bg-amber-600 text-white hover:bg-amber-700'
        );
        return;
      }
      if (stap === 'pauze-opheffen') {
        openBevestig(
          'Opvolging afronden?',
          'De cyclus wordt afgerond. Nieuwe tekorten tellen vanaf nu weer mee voor een volgende cyclus.',
          function () { slaOpvolgingOp(id, 'pauze-opheffen'); },
          'Opgevolgd — afronden',
          'bg-emerald-600 text-white hover:bg-emerald-700'
        );
        return;
      }
      const leerling = leerlingOpId(id);
      if (!leerling) return;
      if (isLadderStap(stap)) {
        if (opvolgKlikGeblokkeerd(id)) return;
        if (opvolgActieNodig(leerling) !== stap) return;
        if (berichtVraagtDatum(stap) && !leesAvondstudieDatum()) {
          toonMelding('Kies eerst de datum van de avondstudie.', 'fout');
          return;
        }
        blokkeerOpvolgKlik(id);
      }
      slaOpvolgingOp(id, stap);
    }

    function slaOpvolgingOp(id, stap, opties) {
      opties = opties || {};
      const leerling = leerlingOpId(id);
      if (!leerling) return;
      const isLadder = isLadderStap(stap);
      const wissen = !!(opties.wissen && isLadder);
      if (isLadder && !wissen && stapOpvolgingGezet(leerling, stap)) return;
      if (isLadder && wissen && !stapOpvolgingGezet(leerling, stap)) return;
      blokkeerOpvolgKlik(id);
      const versie = volgendeOpvolgingVersie(id);

      // Sla de huidige opvolgingstoestand op voor rollback bij fout.
      const oud = {
        opvolgingLeerlingOp:    leerling.opvolgingLeerlingOp,
        opvolgingOudersOp:      leerling.opvolgingOudersOp,
        opvolgingNablijfOp:     leerling.opvolgingNablijfOp,
        opvolgingResetOp:       leerling.opvolgingResetOp,
        opvolgingGepauzeerd:    leerling.opvolgingGepauzeerd,
        opvolgingBlokkeerTaken: leerling.opvolgingBlokkeerTaken
      };

      // Optimistisch: pas de lokale staat meteen aan en herteken.
      const nu = nieuweTijdstempel();
      let teSluiten = [];
      if (stap === 'reset') {
        teSluiten = nietInOrdeTaakIds(leerling);
        leerling.opvolgingLeerlingOp    = '';
        leerling.opvolgingOudersOp      = '';
        leerling.opvolgingNablijfOp     = '';
        leerling.opvolgingResetOp       = nu;
        leerling.opvolgingGepauzeerd    = '';
        leerling.opvolgingBlokkeerTaken = [];
        if (staat.opvolgingDoorgaan) delete staat.opvolgingDoorgaan[id];
      } else if (stap === 'afronden') {
        leerling.opvolgingLeerlingOp    = '';
        leerling.opvolgingOudersOp      = '';
        leerling.opvolgingNablijfOp     = '';
        leerling.opvolgingGepauzeerd    = '';
        leerling.opvolgingBlokkeerTaken = [];
        if (staat.opvolgingDoorgaan) delete staat.opvolgingDoorgaan[id];
      } else if (stap === 'pauzeer') {
        leerling.opvolgingGepauzeerd    = nu;
        leerling.opvolgingBlokkeerTaken = verzamelBlokkeerTaken(leerling);
      } else if (stap === 'pauze-wissen') {
        leerling.opvolgingGepauzeerd    = '';
        leerling.opvolgingBlokkeerTaken = [];
      } else if (stap === 'pauze-opheffen') {
        teSluiten = nietInOrdeTaakIds(leerling);
        leerling.opvolgingLeerlingOp    = '';
        leerling.opvolgingOudersOp      = '';
        leerling.opvolgingNablijfOp     = '';
        leerling.opvolgingResetOp       = nu;
        leerling.opvolgingGepauzeerd    = '';
        leerling.opvolgingBlokkeerTaken = [];
      } else if (wissen) {
        wisOpvolgingVanaf(leerling, stap);
      } else if (stap === 'leerling') leerling.opvolgingLeerlingOp = nu;
      else if (stap === 'ouders')     leerling.opvolgingOudersOp   = nu;
      else if (stap === 'nablijf')    leerling.opvolgingNablijfOp  = nu;

      if (teSluiten.length) schrijfNietInOrdeAlsAlOpgevolgd(leerling, teSluiten);
      verversOpvolgingUI(leerling);
      zetOpvolgKnoppenBezet(id);
      const berichten = {
        reset:          'Opvolging afgerond.',
        afronden:       'Opvolging afgesloten.',
        pauzeer:        'Leerling is aan zet — nieuwe tekorten starten geen nieuwe cyclus.',
        'pauze-wissen': 'Aan zet ongedaan gemaakt.',
        'pauze-opheffen': 'Opvolging afgerond.'
      };
      if (!opties.stil) {
        toonMelding(berichten[stap] || (wissen ? 'Stap ongedaan gemaakt.' : 'Stap genoteerd.'), 'ok');
      }

      if (!isGasOmgeving()) {
        console.log('[LOKAAL] zetLeerlingOpvolging', leerling);
        return;
      }

      const payload = { id: id, stap: stap };
      if (stap === 'pauzeer') payload.blokkeerTaken = leerling.opvolgingBlokkeerTaken;
      if (isLadder) payload.resetOp = String(oud.opvolgingResetOp || '');
      if (stap === 'reset' || stap === 'pauze-opheffen') {
        payload.nieuwResetOp = String(leerling.opvolgingResetOp || '');
      }

      slaOpvolgingNaarServer(payload, function (antwoord) {
          if (!isHuidigeOpvolgingVersie(id, versie)) return;
          // Merge ENKEL de velden die DEZE stap heeft gewijzigd.
          const bevestigd = antwoord && antwoord.leerling;
          const huidig = leerlingOpId(id);
          if (huidig && bevestigd) {
            if (stap === 'leerling') {
              huidig.opvolgingLeerlingOp = bevestigd.opvolgingLeerlingOp;
              if (wissen) {
                huidig.opvolgingOudersOp  = bevestigd.opvolgingOudersOp;
                huidig.opvolgingNablijfOp = bevestigd.opvolgingNablijfOp;
              }
            } else if (stap === 'ouders') {
              huidig.opvolgingOudersOp = bevestigd.opvolgingOudersOp;
              if (wissen) huidig.opvolgingNablijfOp = bevestigd.opvolgingNablijfOp;
            } else if (stap === 'nablijf') {
              huidig.opvolgingNablijfOp = bevestigd.opvolgingNablijfOp;
            } else if (stap === 'pauzeer') {
              huidig.opvolgingGepauzeerd    = bevestigd.opvolgingGepauzeerd;
              huidig.opvolgingBlokkeerTaken = bevestigd.opvolgingBlokkeerTaken;
            } else if (stap === 'pauze-wissen') {
              huidig.opvolgingGepauzeerd    = bevestigd.opvolgingGepauzeerd;
              huidig.opvolgingBlokkeerTaken = bevestigd.opvolgingBlokkeerTaken;
            } else if (stap === 'afronden') {
              huidig.opvolgingLeerlingOp    = bevestigd.opvolgingLeerlingOp;
              huidig.opvolgingOudersOp      = bevestigd.opvolgingOudersOp;
              huidig.opvolgingNablijfOp     = bevestigd.opvolgingNablijfOp;
              huidig.opvolgingGepauzeerd    = bevestigd.opvolgingGepauzeerd;
              huidig.opvolgingBlokkeerTaken = bevestigd.opvolgingBlokkeerTaken;
            } else {
              huidig.opvolgingLeerlingOp    = bevestigd.opvolgingLeerlingOp;
              huidig.opvolgingOudersOp      = bevestigd.opvolgingOudersOp;
              huidig.opvolgingNablijfOp     = bevestigd.opvolgingNablijfOp;
              huidig.opvolgingResetOp       = vroegsteResetOp(huidig.opvolgingResetOp, bevestigd.opvolgingResetOp);
              huidig.opvolgingGepauzeerd    = bevestigd.opvolgingGepauzeerd;
              huidig.opvolgingBlokkeerTaken = bevestigd.opvolgingBlokkeerTaken;
            }
          }
          if (stap === 'reset' || stap === 'pauze-opheffen') {
            const vers = leerlingOpId(id);
            if (vers) verversOpvolgingUI(vers);
          }
        }, function (fout) {
          if (!isHuidigeOpvolgingVersie(id, versie)) return;
          toonMelding('Opvolging bijwerken mislukt: ' + (fout.message || fout), 'fout');
          const huidig = leerlingOpId(id);
          if (huidig) {
            huidig.opvolgingLeerlingOp    = oud.opvolgingLeerlingOp;
            huidig.opvolgingOudersOp      = oud.opvolgingOudersOp;
            huidig.opvolgingNablijfOp     = oud.opvolgingNablijfOp;
            huidig.opvolgingResetOp       = oud.opvolgingResetOp;
            huidig.opvolgingGepauzeerd    = oud.opvolgingGepauzeerd;
            huidig.opvolgingBlokkeerTaken = oud.opvolgingBlokkeerTaken;
            verversOpvolgingUI(huidig);
          }
        });
    }
</script>
