<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opvolging leerkansen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"DM Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    .sort-knop.actief,
    .filter-groep.actief,
    #knop-filter[aria-expanded="true"] {
      background: #e2e8f0;
      color: #0f172a;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">
  <!--
    GAS-scriplet: bij deploy wordt dit echte JSON.
    Lokaal (Live Server) blijft de placeholder staan en valt JS terug op mockdata.
  -->
  <script id="gas-leerling-payload" type="application/json"><?!= typeof leerlingJson !== 'undefined' ? leerlingJson : '' ?></script>

  <div class="max-w-lg mx-auto p-3 sm:p-4 space-y-3">
    <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-3 py-2.5 border-b border-slate-100">
        <h1 class="text-sm font-semibold">Opvolging leerkansen</h1>
        <div class="mt-2 space-y-1 text-[12px] text-slate-600 leading-relaxed">
          <p>Het onderstaande overzicht geeft weer welke leerkansen er werden aangeboden en in welke mate erop werd ingegaan.
          Toevoegingen en aanpassingen gebeuren te allen tijde in dit overzicht. Gelieve dit goed mee op te volgen.</p>
        </div>
        <div class="mt-2 flex items-center justify-between gap-2">
          <p id="samenvatting" class="text-[11px] text-slate-500"></p>
          <button type="button" id="knop-filter"
            class="relative shrink-0 inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800"
            title="Filteren en sorteren" aria-label="Filteren en sorteren" aria-expanded="false" aria-controls="paneel-filter">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18" />
              <path d="M7 12h10" />
              <path d="M10 18h4" />
            </svg>
            <span id="filter-indicatie" class="hidden absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-indigo-600"></span>
          </button>
        </div>
        <div id="paneel-filter" class="hidden mt-2 pt-2 border-t border-slate-100">
          <div class="flex flex-wrap items-center gap-2">
            <div class="inline-flex rounded-lg border border-slate-200 p-0.5" role="group" aria-label="Sorteren">
              <button type="button" id="sort-datum" class="sort-knop actief px-2.5 py-1 rounded-md text-[11px] font-semibold text-slate-600" data-sort="datum">Datum</button>
              <button type="button" id="sort-soort" class="sort-knop px-2.5 py-1 rounded-md text-[11px] font-semibold text-slate-600" data-sort="soort">Soort</button>
            </div>
            <p class="flex flex-wrap gap-x-1 gap-y-1 text-[11px] font-medium text-slate-600" aria-label="Filter op soort">
              <button type="button" class="filter-groep inline-flex items-center gap-1 rounded-md px-2 py-1 hover:bg-slate-50" data-groep="huiswerk">
                <span class="w-3 h-0.5 rounded bg-sky-400"></span> Les / huiswerk
              </button>
              <button type="button" class="filter-groep inline-flex items-center gap-1 rounded-md px-2 py-1 hover:bg-slate-50" data-groep="leerkans">
                <span class="w-3 h-0.5 rounded bg-orange-400"></span> Remediëring
              </button>
              <button type="button" class="filter-groep inline-flex items-center gap-1 rounded-md px-2 py-1 hover:bg-slate-50" data-groep="optioneel">
                <span class="w-3 h-0.5 rounded bg-slate-400"></span> Optioneel
              </button>
            </p>
            <button type="button" id="knop-filter-wissen" class="knop-filter-wissen shrink-0 inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-slate-500 disabled:cursor-not-allowed" title="Filters wissen" aria-label="Filters wissen" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div id="lijst" class="divide-y divide-slate-100">
        <p class="p-4 text-sm text-slate-500">Gegevens laden…</p>
      </div>
    </section>
  </div>

  <script>
    /**
     * Leerlingenscherm (iframe) — toont géén namen.
     * GAS: payload via scriplet of google.script.run.getLeerlingData(code).
     * Lokaal: mockdata, filterbaar via ?id=Geheime_Code.
     */

    const MOCK_TAKEN = [
      { id: 'T001', naam: 'Wiskunde', type: 'Huistaak', deadline: '2026-08-20' },
      { id: 'T002', naam: 'Agenda', type: 'Lesopdracht', deadline: '2026-08-22' },
      { id: 'T005', naam: 'Boekbespreking Nederlands', type: 'Huistaak', deadline: '2026-08-28' },
      { id: 'T006', naam: 'Toets geschiedenis', type: 'Schriftelijke voorbereiding', deadline: '2026-08-29' },
      { id: 'T013', naam: 'Burgerschap', type: 'Niet-verplichte taak', deadline: '2026-09-15' }
    ];

    const MOCK_LEERLINGEN = [
      { id: 'L001', klas: '3A', code: 'A7X9A7X9' },
      { id: 'L002', klas: '3A', code: 'B2K4B2K4' },
      { id: 'L003', klas: '3B', code: 'C9M3C9M3' },
      { id: 'L004', klas: '3A', code: 'D5P8D5P8' },
      { id: 'L005', klas: '3B', code: 'E3W6E3W6' },
      { id: 'L006', klas: '3A', code: 'F8T2F8T2' }
    ];

    const MOCK_REGISTRATIES = [
      { datumTijd: '2026-08-17 08:12', llnId: 'L001', taakId: 'T001', status: 'In orde', opmerking: '' },
      { datumTijd: '2026-08-17 08:13', llnId: 'L001', taakId: 'T002', status: 'Niet in orde', opmerking: 'Agenda niet ingevuld.' },
      { datumTijd: '2026-08-22 08:10', llnId: 'L001', taakId: 'T005', status: 'Te laat', opmerking: 'Na de deadline ingediend.' },
      { datumTijd: '2026-08-22 08:11', llnId: 'L001', taakId: 'T006', status: 'Niet in orde', opmerking: 'Voorbereiding ontbreekt.' },
      { datumTijd: '2026-09-15 08:20', llnId: 'L001', taakId: 'T013', status: 'In orde', opmerking: '' },
      { datumTijd: '2026-08-17 08:15', llnId: 'L002', taakId: 'T001', status: 'Niet in orde', opmerking: 'Niet afgegeven.' },
      { datumTijd: '2026-08-17 08:17', llnId: 'L003', taakId: 'T001', status: 'In orde', opmerking: '' },
      { datumTijd: '2026-08-17 08:18', llnId: 'L003', taakId: 'T005', status: 'In orde', opmerking: 'Mooi werk.' },
      { datumTijd: '2026-08-17 08:19', llnId: 'L004', taakId: 'T002', status: 'In orde', opmerking: '' },
      { datumTijd: '2026-08-17 08:21', llnId: 'L005', taakId: 'T001', status: 'In orde', opmerking: '' },
      { datumTijd: '2026-08-17 08:22', llnId: 'L005', taakId: 'T002', status: 'In orde', opmerking: '' }
    ];

    function isGasOmgeving() {
      return typeof google !== 'undefined' && google.script && typeof google.script.run === 'function';
    }

    function leesUrlCode() {
      const params = new URLSearchParams(window.location.search);
      return (params.get('id') || 'A7X9A7X9').trim();
    }

    /** Probeert de GAS-scriplet-JSON te parsen. Lokaal is dit geen geldige JSON. */
    function leesGasPayload() {
      const el = document.getElementById('gas-leerling-payload');
      if (!el) return null;
      const tekst = (el.textContent || '').trim();
      if (!tekst || tekst.indexOf('<' + '?') !== -1) return null;
      try {
        return JSON.parse(tekst);
      } catch (fout) {
        console.log('[LOKAAL] GAS-payload niet leesbaar, val terug op mockdata', fout);
        return null;
      }
    }

    function mockLeerlingData(code) {
      const leerling = MOCK_LEERLINGEN.filter(function (l) {
        return l.code.toUpperCase() === code.toUpperCase();
      })[0] || MOCK_LEERLINGEN[0];

      const taakById = {};
      MOCK_TAKEN.forEach(function (t) { taakById[t.id] = t; });

      const registraties = MOCK_REGISTRATIES
        .filter(function (r) { return r.llnId === leerling.id; })
        .map(function (r) {
          const taak = taakById[r.taakId];
          return {
            datumTijd: r.datumTijd,
            taakId: r.taakId,
            taakNaam: (taak && taak.naam) ? taak.naam : r.taakId,
            type: (taak && taak.type) ? taak.type : '',
            deadline: (taak && taak.deadline) ? taak.deadline : '',
            status: r.status,
            opmerking: r.opmerking
          };
        });

      return {
        code: leerling.code,
        llnId: leerling.id,
        klas: leerling.klas,
        registraties: registraties
      };
    }

    function haalLeerlingData() {
      const payload = leesGasPayload();
      if (payload && payload.registraties) {
        toonRegistraties(payload);
        return;
      }

      const code = leesUrlCode();

      if (isGasOmgeving()) {
        google.script.run
          .withSuccessHandler(toonRegistraties)
          .withFailureHandler(function (fout) {
            document.getElementById('lijst').innerHTML =
              '<p class="p-4 text-sm text-rose-700">Kon gegevens niet laden.</p>';
            console.log('getLeerlingData mislukt', fout);
          })
          .getLeerlingData(code);
        return;
      }

      console.log('[LOKAAL] getLeerlingData — mockdata voor code', code);
      toonRegistraties(mockLeerlingData(code));
    }

    const GROEP_KLEUR = {
      huiswerk: 'bg-sky-400',
      leerkans: 'bg-orange-400',
      optioneel: 'bg-slate-400'
    };
    const TYPE_GROEP = {
      'Lesopdracht': 'huiswerk',
      'Huiswerk': 'huiswerk',
      'Huistaak': 'huiswerk',
      'Bookwidgetsopdracht': 'huiswerk',
      'Schriftelijke voorbereiding': 'leerkans',
      'Remediëringstaak': 'leerkans',
      'Remediëringsopdracht': 'leerkans',
      'Bijles': 'leerkans',
      'Toets verbeteren': 'leerkans',
      'Examen inkijken': 'leerkans',
      'Niet-verplichte taak': 'optioneel'
    };
    const staat = {
      registraties: [],
      sortering: 'datum',
      groepFilters: [],
      lijstMinHoogte: 0
    };

    function taakGroep(reg) {
      return TYPE_GROEP[reg && reg.type] || 'optioneel';
    }

    function zichtbareRegistraties() {
      let lijst = staat.registraties.filter(function (reg) {
        if (String(reg && reg.type ? reg.type : '').trim() === 'Materiaal niet in orde') return false;
        return groepZitInFilter(taakGroep(reg));
      });
      if (staat.sortering === 'soort') {
        const volgorde = ['huiswerk', 'les', 'leerkans', 'optioneel'];
        lijst.sort(function (a, b) {
          const ga = volgorde.indexOf(taakGroep(a));
          const gb = volgorde.indexOf(taakGroep(b));
          if (ga !== gb) return ga - gb;
          const typeCmp = String(a.type || '').localeCompare(String(b.type || ''), 'nl');
          if (typeCmp !== 0) return typeCmp;
          return String(b.datumTijd).localeCompare(String(a.datumTijd));
        });
      } else {
        lijst.sort(function (a, b) {
          return String(b.datumTijd).localeCompare(String(a.datumTijd));
        });
      }
      return lijst;
    }

    function groepZitInFilter(groep) {
      const filters = staat.groepFilters || [];
      if (!filters.length) return true;
      return filters.indexOf(groep) !== -1;
    }

    function tekenSorteerFilterKnoppen() {
      document.querySelectorAll('.sort-knop').forEach(function (knop) {
        knop.classList.toggle('actief', knop.getAttribute('data-sort') === staat.sortering);
      });
      document.querySelectorAll('.filter-groep').forEach(function (knop) {
        const groep = knop.getAttribute('data-groep');
        knop.classList.toggle('actief', staat.groepFilters.indexOf(groep) !== -1);
      });
      const filterActief = staat.sortering !== 'datum' || !!(staat.groepFilters && staat.groepFilters.length);
      document.getElementById('filter-indicatie').classList.toggle('hidden', !filterActief);
      document.getElementById('knop-filter-wissen').disabled = !filterActief;
    }

    function wisselFilterPaneel() {
      const paneel = document.getElementById('paneel-filter');
      const knop = document.getElementById('knop-filter');
      const open = paneel.classList.contains('hidden');
      paneel.classList.toggle('hidden', !open);
      knop.setAttribute('aria-expanded', String(open));
    }

    function formaatDatum(waarde) {
      const m = String(waarde || '').match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return String(waarde || '');
      return m[3] + '-' + m[2] + '-' + m[1];
    }

    function zetSortering(naam) {
      staat.sortering = naam === 'soort' ? 'soort' : 'datum';
      tekenLijst();
    }

    function wisselGroepFilter(groep) {
      const lijst = staat.groepFilters.slice();
      const index = lijst.indexOf(groep);
      if (index === -1) lijst.push(groep);
      else lijst.splice(index, 1);
      staat.groepFilters = lijst;
      tekenLijst();
    }

    function wisFilters() {
      staat.sortering = 'datum';
      staat.groepFilters = [];
      tekenLijst();
    }

    function toonRegistraties(data) {
      staat.registraties = (data && data.registraties) ? data.registraties : [];
      tekenLijst();
    }

    function borgLijstHoogte(el, voorTekenen) {
      if (!el) return;
      if (voorTekenen) {
        if (staat.lijstMinHoogte) el.style.minHeight = staat.lijstMinHoogte + 'px';
        return;
      }
      const hoogte = el.offsetHeight;
      if (hoogte > (staat.lijstMinHoogte || 0)) {
        staat.lijstMinHoogte = hoogte;
        el.style.minHeight = hoogte + 'px';
      }
    }

    function tekenLijst() {
      const lijst = document.getElementById('lijst');
      const regs = zichtbareRegistraties();
      tekenSorteerFilterKnoppen();
      borgLijstHoogte(lijst, true);

      const inOrde = regs.filter(function (r) { return r.status === 'In orde'; }).length;
      const nietOk = regs.filter(function (r) { return r.status === 'Niet in orde'; }).length;
      const afwezig = regs.filter(function (r) { return r.status === 'Afwezig'; }).length;
      const teLaat = regs.filter(function (r) { return r.status === 'Te laat'; }).length;
      const teMaken = regs.filter(function (r) { return r.status === 'Te maken'; }).length;
      document.getElementById('samenvatting').textContent =
        inOrde + ' in orde · ' + nietOk + ' niet OK · ' + teLaat + ' te laat · ' + teMaken + ' te maken · ' + afwezig + ' afwezig';

      if (!staat.registraties.length) {
        lijst.innerHTML = '<p class="p-4 text-sm text-slate-500">Nog geen registraties.</p>';
        borgLijstHoogte(lijst, false);
        return;
      }
      if (!regs.length) {
        lijst.innerHTML = '<p class="p-4 text-sm text-slate-500">Geen registraties voor deze filter.</p>';
        borgLijstHoogte(lijst, false);
        return;
      }

      lijst.innerHTML = regs.map(function (reg) {
        const badge = statusBadge(reg.status);
        const groep = taakGroep(reg);
        const kleur = GROEP_KLEUR[groep] || GROEP_KLEUR.optioneel;
        const meta = [formaatDatum(reg.datumTijd), reg.type].filter(Boolean).join(' · ');
        const opmerking = reg.opmerking
          ? '<p class="text-sm text-slate-600 leading-snug">' + escapeHtml(reg.opmerking) + '</p>'
          : '';

        return (
          '<article class="px-3 py-2.5">' +
            '<div class="flex items-start gap-2">' +
              '<span class="mt-1 w-0.5 self-stretch min-h-[2.5rem] rounded ' + kleur + '" aria-hidden="true"></span>' +
              '<div class="min-w-0 flex-1 space-y-0.5">' +
                '<p class="text-xs text-slate-500">' + escapeHtml(meta) + '</p>' +
                '<p class="text-sm font-semibold text-slate-900 leading-snug">' + escapeHtml(reg.taakNaam) + '</p>' +
                opmerking +
              '</div>' +
              badge +
            '</div>' +
          '</article>'
        );
      }).join('');
      borgLijstHoogte(lijst, false);
    }

    function statusBadge(status) {
      const stijlen = {
        'In orde': 'bg-emerald-100 text-emerald-800',
        'Niet in orde': 'bg-rose-100 text-rose-800',
        'Afwezig': 'bg-slate-200 text-slate-700',
        'Te laat': 'bg-yellow-200 text-yellow-900',
        'Te maken': 'bg-yellow-50 text-yellow-800'
      };
      const klasse = stijlen[status] || 'bg-slate-100 text-slate-600';
      return '<span class="shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded-full ' + klasse + '">' +
        escapeHtml(status || 'Onbekend') + '</span>';
    }

    function escapeHtml(waarde) {
      return String(waarde == null ? '' : waarde)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.getElementById('knop-filter').addEventListener('click', wisselFilterPaneel);
    document.getElementById('sort-datum').addEventListener('click', function () { zetSortering('datum'); });
    document.getElementById('sort-soort').addEventListener('click', function () { zetSortering('soort'); });
    document.querySelectorAll('.filter-groep').forEach(function (knop) {
      knop.addEventListener('click', function () {
        wisselGroepFilter(knop.getAttribute('data-groep'));
      });
    });
    document.getElementById('knop-filter-wissen').addEventListener('click', wisFilters);

    haalLeerlingData();
  </script>
</body>
</html>
