    /**
     * True als de pagina geserveerd wordt door Google Apps Script.
     * Detectie via URL — betrouwbaarder dan de google.script.run check,
     * die asynchroon beschikbaar komt en dus te vroeg false kan teruggeven.
     */
    function isGasOmgeving() {
      var url = window.location.href;
      return url.indexOf('script.google.com') !== -1 ||
             url.indexOf('googleusercontent.com') !== -1 ||
             url.indexOf('/macros/') !== -1;
    }

    /**
     * Geeft google.script.run terug als het beschikbaar is, anders null.
     * Let op: google.script.run is een object, geen function —
     * typeof check op 'function' was fout en blokkeerde de GAS-koppeling.
     */
    function gasRun() {
      try {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return google.script.run;
        }
      } catch (e) { /* defensief */ }
      return null;
    }

    (function debugGasStatus() {
      console.log('[GAS-check] isGasOmgeving=' + isGasOmgeving() + ' | gasRun=' + (gasRun() ? 'beschikbaar' : 'nog niet klaar') + ' | url=' + window.location.href);
    }());

    let meldingTimer = null;

    function toonMelding(tekst, type) {
      const el = document.getElementById('melding');
      el.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200', 'bg-amber-50', 'text-amber-900', 'border-amber-200');
      if (type === 'ok') el.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
      else if (type === 'fout') el.classList.add('bg-rose-50', 'text-rose-800', 'border-rose-200');
      else el.classList.add('bg-amber-50', 'text-amber-900', 'border-amber-200');
      el.textContent = tekst;
      if (meldingTimer) clearTimeout(meldingTimer);
      meldingTimer = setTimeout(function () {
        el.classList.add('hidden');
        meldingTimer = null;
      }, type === 'fout' ? 5000 : 3200);
    }

    /**
     * Sla meerdere registraties in één GAS-call op (batch).
     * items = [{llnId, taakId, status, opmerking, klas?, alOpgevolgd?}]
     * naSucces(savedItems[]) wordt aangeroepen na bevestiging (optioneel).
     * Optimistische updates worden al door de aanroeper gedaan via slaRegistratieOp().
     */
    function isTijdelijkId(id) {
      return String(id || '').indexOf('__temp_') === 0;
    }

    function registratieHeeftTijdelijkeIds(payload) {
      return isTijdelijkId(payload.llnId) || isTijdelijkId(payload.taakId);
    }

    function vervangIdInSelectie(type, oudId, nieuwId) {
      function mapCel(cel) {
        if (!cel) return cel;
        if (type === 'lln' && cel.llnId === oudId) return { llnId: nieuwId, taakId: cel.taakId };
        if (type === 'taak' && cel.taakId === oudId) return { llnId: cel.llnId, taakId: nieuwId };
        return cel;
      }
      staat.geselecteerd = mapCel(staat.geselecteerd);
      staat.selectieAnker = mapCel(staat.selectieAnker);
      staat.selectie = (staat.selectie || []).map(mapCel);
      if (staat.naLeerling && type === 'lln' && staat.naLeerling.llnId === oudId) {
        staat.naLeerling.llnId = nieuwId;
      }
      if (type === 'lln' && staat.lijstLeerlingId === oudId) staat.lijstLeerlingId = nieuwId;
      if (type === 'taak' && staat.lijstTaakId === oudId) staat.lijstTaakId = nieuwId;
      if (type === 'taak' && staat.taakBewerkenId === oudId) staat.taakBewerkenId = nieuwId;
    }

    function vervangLeerlingIdInDom(oudId, nieuwId) {
      if (!oudId || !nieuwId || oudId === nieuwId) return;
      document.querySelectorAll('[data-lln]').forEach(function (el) {
        if (el.getAttribute('data-lln') === oudId) el.setAttribute('data-lln', nieuwId);
      });
      document.querySelectorAll('[data-id]').forEach(function (el) {
        if (el.getAttribute('data-id') === oudId) el.setAttribute('data-id', nieuwId);
      });
    }

    function vervangTijdelijkLeerlingId(oudId, nieuwId) {
      if (!oudId || !nieuwId || oudId === nieuwId) return;
      staat.registraties.forEach(function (r) {
        if (r.llnId === oudId) r.llnId = nieuwId;
      });
      staat.registratieWachtrij.forEach(function (item) {
        if (item.payload.llnId === oudId) item.payload.llnId = nieuwId;
      });
      vervangIdInSelectie('lln', oudId, nieuwId);
      verwerkRegistratieWachtrij();
    }

    function vervangTijdelijkTaakId(oudId, nieuwId) {
      if (!oudId || !nieuwId || oudId === nieuwId) return;
      staat.registraties.forEach(function (r) {
        if (r.taakId === oudId) r.taakId = nieuwId;

        if (item.payload.taakId === oudId) item.payload.taakId = nieuwId;

        if (item.id === oudId) item.id = nieuwId;
      });
      vervangIdInSelectie('taak', oudId, nieuwId);
      document.querySelectorAll('[data-taak]').forEach(function (el) {
        if (el.getAttribute('data-taak') === oudId) el.setAttribute('data-taak', nieuwId);
      });
      document.querySelectorAll('[data-id]').forEach(function (el) {
        if (el.getAttribute('data-id') === oudId) el.setAttribute('data-id', nieuwId);
      });
      verwerkRegistratieWachtrij();
      verwerkTaakWijzigingWachtrij();
    }

    function verwerkTaakWijzigingWachtrij() {
      if (!staat.taakWijzigingWachtrij.length) return;
      const klaar = [];
      const rest = [];
      staat.taakWijzigingWachtrij.forEach(function (item) {
        if (isTijdelijkId(item.id)) rest.push(item);
        else klaar.push(item);
      });
      staat.taakWijzigingWachtrij = rest;
      klaar.forEach(function (item) {
        verstuurTaakWijziging(item.id, item.data);
      });
    }

    function verstuurTaakWijziging(id, data) {
      if (!isGasOmgeving()) return;
      const taak = taakOpId(id);
      const oudNaam = taak ? taak.naam : '';
      const oudType = taak ? taak.type : '';
      const oudDeadline = taak ? taak.deadline : '';
      const run = gasRun();
      if (!run) return;
      run
        .withSuccessHandler(function (antwoord) { if (antwoord && antwoord.taak) werkTaakBij(antwoord.taak); })
        .withFailureHandler(function (fout) {
          if (taak) {
            taak.naam = oudNaam;
            taak.type = oudType;
            taak.deadline = oudDeadline;
            tekenActieveWeergave();
          }
          toonMelding('Taak opslaan mislukt: ' + (fout.message || fout), 'fout');
        })
        .updateTaak({ id: id, naam: data.naam, type: data.type, deadline: data.deadline });
    }

    function verwerkRegistratieWachtrij() {
      if (!staat.registratieWachtrij.length) return;
      const klaar = [];
      const rest = [];
      staat.registratieWachtrij.forEach(function (item) {
        if (registratieHeeftTijdelijkeIds(item.payload)) rest.push(item);
        else klaar.push(item);
      });
      staat.registratieWachtrij = rest;
      if (!klaar.length) return;
      slaRegistratiesOpDirect(
        klaar.map(function (item) { return item.payload; }),
        klaar.map(function (item) { return item.tempRij; })
      );
    }

    function registratieCelSleutel(payload) {
      return String(payload.llnId || '') + '\t' + String(payload.taakId || '') + '\t' + String(payload.klas || '');
    }

    function voegAanDirecteWachtrij(items, tempRijen, naSucces) {
      items.forEach(function (item, i) {
        const sleutel = registratieCelSleutel(item);
        const wacht = staat.registratieWachtDirect;
        let gevonden = false;
        for (let w = 0; w < wacht.length; w++) {
          if (registratieCelSleutel(wacht[w].payload) !== sleutel) continue;
          wacht[w].payload = item;
          wacht[w].tempRij = tempRijen[i];
          if (naSucces && i === items.length - 1) {
            const vorige = wacht[w].naSucces;
            wacht[w].naSucces = function (saved) {
              if (vorige) vorige(saved);
              naSucces(saved);
            };
          }
          gevonden = true;
          break;
        }
        if (!gevonden) {
          wacht.push({
            payload: item,
            tempRij: tempRijen[i],
            naSucces: (naSucces && i === items.length - 1) ? naSucces : null
          });
        }
      });
    }

    function startRegistratieVerzending() {
      if (staat.registratieBezig || !staat.registratieWachtDirect.length) return;
      const batch = staat.registratieWachtDirect.splice(0);
      const items = batch.map(function (b) { return b.payload; });
      const tempRijen = batch.map(function (b) { return b.tempRij; });
      const callbacks = batch.map(function (b) { return b.naSucces; }).filter(Boolean);

      if (!isGasOmgeving()) {
        console.log('[LOKAAL] saveRegistraties batch', items);
        callbacks.forEach(function (cb) { cb(tempRijen); });
        startRegistratieVerzending();
        return;
      }

      const run = gasRun();
      if (!run) {
        staat.registratieWachtDirect = batch.concat(staat.registratieWachtDirect);
        setTimeout(startRegistratieVerzending, 80);
        return;
      }

      staat.registratieBezig = true;
      run
        .withSuccessHandler(function (antwoord) {
          (antwoord.registraties || []).forEach(function (opgeslagen, i) {
            const idx = staat.registraties.indexOf(tempRijen[i]);
            if (idx !== -1) staat.registraties.splice(idx, 1, opgeslagen);
          });
          callbacks.forEach(function (cb) { cb(antwoord.registraties || []); });
          staat.registratieBezig = false;
          startRegistratieVerzending();
        })
        .withFailureHandler(function (fout) {
          toonMelding('Opslaan mislukt: ' + (fout.message || fout), 'fout');
          tempRijen.forEach(function (tmpRij) {
            const idx = staat.registraties.indexOf(tmpRij);
            if (idx !== -1) staat.registraties.splice(idx, 1);
          });
          staat.registratieBezig = false;
          staat.registratieWachtDirect = [];
          haalDocentData();
        })
        .saveRegistraties(items);
    }

    function slaRegistratiesOpDirect(items, tempRijen, naSucces) {
      if (!items.length) return;
      voegAanDirecteWachtrij(items, tempRijen, naSucces);
      startRegistratieVerzending();
    }

    function slaRegistratiesOp(items, tempRijen, naSucces) {
      if (!items.length) return;
      const directItems = [];
      const directRijen = [];
      items.forEach(function (item, i) {
        if (registratieHeeftTijdelijkeIds(item)) {
          staat.registratieWachtrij.push({ payload: item, tempRij: tempRijen[i] });
        } else {
          directItems.push(item);
          directRijen.push(tempRijen[i]);
        }
      });
      if (directItems.length) slaRegistratiesOpDirect(directItems, directRijen, naSucces);
    }

    function slaRegistratieOp(data, naSucces) {
      const payload = {
        llnId: data.llnId,
        taakId: data.taakId,
        status: data.status,
        opmerking: data.opmerking || '',
        klas: String(data.klas || staat.gekozenKlas || '').trim(),
        alOpgevolgd: !!data.alOpgevolgd
      };

      let datumTijd = nieuweTijdstempel();
      if (payload.alOpgevolgd) {
        const lln = leerlingOpId(payload.llnId);
        const reset = String(lln && lln.opvolgingResetOp || '').trim();
        if (!reset) return false;
        datumTijd = reset;
      }

      // Optimistisch: registratie meteen lokaal toevoegen en UI hertekenen.
      const tempRij = {
        datumTijd: datumTijd,
        llnId: payload.llnId,
        taakId: payload.taakId,
        status: payload.status,
        opmerking: payload.opmerking,
        klas: payload.klas
      };
      staat.registraties.push(tempRij);
      if (naSucces) naSucces(tempRij);

      if (!isGasOmgeving()) {
        console.log('[LOKAAL] saveRegistratie', tempRij);
        return true;
      }

      if (registratieHeeftTijdelijkeIds(payload)) {
        staat.registratieWachtrij.push({ payload: payload, tempRij: tempRij });
        return true;
      }

      slaRegistratiesOpDirect([payload], [tempRij]);
      return true;
    }

    function nieuwTijdelijkId(prefix) {
      staat.tempIdTeller += 1;
      return '__temp_' + (prefix || 'x') + '_' + Date.now() + '_' + staat.tempIdTeller;
    }

    let laatsteTijdstempelMs = 0;
    function nieuweTijdstempel() {
      const d = new Date();
      let ms = d.getTime();
      if (ms <= laatsteTijdstempelMs) ms = laatsteTijdstempelMs + 1;
      laatsteTijdstempelMs = ms;
      d.setTime(ms);
      const pad = function (n) { return String(n).padStart(2, '0'); };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
        pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '.' +
        String(d.getMilliseconds()).padStart(3, '0');
    }

    function isoVandaag() {
      const d = new Date();
      const pad = function (n) { return String(n).padStart(2, '0'); };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function volgendeId(lijst, prefix) {
      let max = 0;
      lijst.forEach(function (item) {
        const m = String(item.id || '').match(new RegExp('^' + prefix + '(\\d+)$', 'i'));
        if (m) max = Math.max(max, parseInt(m[1], 10));
      });
      return prefix + String(max + 1).padStart(3, '0');
    }

    function uniekeLeerlingCode(leerlingen) {
      const bestaande = {};
      leerlingen.forEach(function (lln) {
        const code = String(lln.code || '').trim().toUpperCase();
        if (code) bestaande[code] = true;
      });
      const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      const cijfers = '23456789';
      let poging = 0;
      while (poging < 10000) {
        let code = '';
        let i = 0;
        for (i = 0; i < 4; i++) {
          code += letters.charAt(Math.floor(Math.random() * letters.length));
          code += cijfers.charAt(Math.floor(Math.random() * cijfers.length));
        }
        if (!bestaande[code]) return code;
        poging += 1;
      }
      throw new Error('Kon geen unieke leerlingcode genereren.');
    }

    function slaLeerlingOp(data, naSucces) {
      // Optimistisch: meteen toevoegen met tijdelijk ID, GAS bevestigt op de achtergrond.
      const code = String(data.code || '').trim().toUpperCase() || uniekeLeerlingCode(staat.leerlingen);
      const tempLeerling = {
        id: nieuwTijdelijkId('L'),
        naam: String(data.naam || '').trim(),
        klas: String(data.klas || '').trim(),
        code: code,
        geschraptIn: [],
        verwijderdOp: '',
        opvolgingLeerlingOp:    '',
        opvolgingOudersOp:      '',
        opvolgingNablijfOp:     '',
        opvolgingResetOp:       '',
        opvolgingGepauzeerd:    '',
        opvolgingBlokkeerTaken: [],
        volgorde: volgendeLeerlingVolgorde(String(data.klas || '').trim())
      };
      voegKlasAanStaat(tempLeerling.klas);
      staat.leerlingen.push(tempLeerling);
      if (naSucces) naSucces(tempLeerling);

      if (!isGasOmgeving()) {
        console.log('[LOKAAL] saveLeerling', tempLeerling);
        return;
      }

      gasRun()
        .withSuccessHandler(function (antwoord) {
          const tempId = tempLeerling.id;
          vervangTijdelijkLeerlingId(tempId, antwoord.leerling.id);
          const idx = staat.leerlingen.indexOf(tempLeerling);
          if (idx !== -1) staat.leerlingen.splice(idx, 1, antwoord.leerling);
          else staat.leerlingen.push(antwoord.leerling);
          voegKlasAanStaat(antwoord.leerling && antwoord.leerling.klas);
          vervangLeerlingIdInDom(tempId, antwoord.leerling.id);
          tekenSelectie();
        })
        .withFailureHandler(function (fout) {
          staat.bezigLeerling = false;
          toonMelding('Leerling toevoegen mislukt: ' + (fout.message || fout), 'fout');
          const tempId = tempLeerling.id;
          const idx = staat.leerlingen.indexOf(tempLeerling);
          if (idx !== -1) staat.leerlingen.splice(idx, 1);
          staat.registratieWachtrij = staat.registratieWachtrij.filter(function (item) {
            return item.payload.llnId !== tempId;
          });
          staat.registraties = staat.registraties.filter(function (r) {
            return r.llnId !== tempId;
          });
          tekenActieveWeergave();
        })
        .saveLeerling({
          naam: data.naam,
          klas: data.klas,
          code: code
        });
    }

    function slaTaakOp(data, naSucces) {
      // Optimistisch: taak(en) meteen lokaal toevoegen.
      const klassen = (data.klassen && data.klassen.length)
        ? data.klassen
        : [data.klas || staat.gekozenKlas];
      const tempTaken = [];
      klassen.forEach(function (klas) {
        tempTaken.push({
          id: nieuwTijdelijkId('T' + tempTaken.length),
          naam: String(data.naam || '').trim(),
          type: String(data.type || '').trim(),
          deadline: String(data.deadline || isoVandaag()),
          klas: String(klas || '').trim()
        });
      });
      tempTaken.forEach(function (taak) { staat.taken.push(taak); });
      if (naSucces) naSucces(tempTaken);

      if (!isGasOmgeving()) {
        console.log('[LOKAAL] saveTaak', tempTaken);
        return;
      }

      gasRun()
        .withSuccessHandler(function (antwoord) {
          const lijst = antwoord.taken || (antwoord.taak ? [antwoord.taak] : []);
          tempTaken.forEach(function (temp, i) {
            const nieuw = lijst[i];
            if (!nieuw) return;
            vervangTijdelijkTaakId(temp.id, nieuw.id);
            const idx = staat.taken.indexOf(temp);
            if (idx !== -1) staat.taken.splice(idx, 1, nieuw);
            else staat.taken.push(nieuw);
          });
          tekenActieveWeergave();
          tekenSelectie();
        })
        .withFailureHandler(function (fout) {
          toonMelding('Taak toevoegen mislukt: ' + (fout.message || fout), 'fout');
          tempTaken.forEach(function (temp) {
            const tempId = temp.id;
            staat.registratieWachtrij = staat.registratieWachtrij.filter(function (item) {
              return item.payload.taakId !== tempId;
            });
            staat.taakWijzigingWachtrij = staat.taakWijzigingWachtrij.filter(function (item) {
              return item.id !== tempId;
            });
            staat.registraties = staat.registraties.filter(function (r) {
              return r.taakId !== tempId;
            });
            const idx = staat.taken.indexOf(temp);
            if (idx !== -1) staat.taken.splice(idx, 1);
          });
          tekenActieveWeergave();
        })
        .saveTaak(data);
    }

    function slaTaakWijzigingOp(id, data, naSucces) {
      const taak = taakOpId(id);
      if (!taak) { toonMelding('Taak niet gevonden.', 'fout'); return; }
      taak.naam = String(data.naam || '').trim();
      taak.type = String(data.type || '').trim();
      taak.deadline = String(data.deadline || '').trim();
      const payload = { naam: taak.naam, type: taak.type, deadline: taak.deadline };
      if (naSucces) naSucces(taak);
      if (!isGasOmgeving()) { console.log('[LOKAAL] updateTaak', taak); return; }
      if (isTijdelijkId(id)) {
        let gevonden = false;
        staat.taakWijzigingWachtrij.forEach(function (item) {
          if (item.id !== id) return;
          item.data = payload;
          gevonden = true;
        });
        if (!gevonden) staat.taakWijzigingWachtrij.push({ id: id, data: payload });
        return;
      }
      verstuurTaakWijziging(id, payload);
    }

    function verwijderLeerlingOp(id, naSucces) {
      const leerling = leerlingOpId(id);
      if (!leerling) return;
      const oudVerwijderd = leerling.verwijderdOp;
      leerling.verwijderdOp = nieuweTijdstempel();
      if (naSucces) naSucces(leerling);
      if (!isGasOmgeving()) { console.log('[LOKAAL] deleteLeerling', leerling); return; }
      gasRun()
        .withSuccessHandler(function (antwoord) { werkLeerlingBij(antwoord.leerling); })
        .withFailureHandler(function (fout) {
          leerling.verwijderdOp = oudVerwijderd;
          tekenActieveWeergave();
          toonMelding('Leerling verwijderen mislukt: ' + (fout.message || fout), 'fout');
        })
        .deleteLeerling(id);
    }

    function herstelLeerlingOp(id, naSucces) {
      const leerling = leerlingOpId(id);
      if (!leerling) return;
      const oudVerwijderd = leerling.verwijderdOp;
      leerling.verwijderdOp = '';
      if (naSucces) naSucces(leerling);
      if (!isGasOmgeving()) { console.log('[LOKAAL] herstelLeerling', leerling); return; }
      gasRun()
        .withSuccessHandler(function (antwoord) { werkLeerlingBij(antwoord.leerling); })
        .withFailureHandler(function (fout) {
          leerling.verwijderdOp = oudVerwijderd;
          tekenPrullenbakLijst();
          toonMelding('Leerling terugzetten mislukt: ' + (fout.message || fout), 'fout');
        })
        .herstelLeerling(id);
    }

    function leegPrullenbakOp(naSucces) {
      const ids = {};
      verwijderdeLeerlingen().forEach(function (lln) { ids[lln.id] = true; });
      const aantal = Object.keys(ids).length;
      if (!aantal) { if (naSucces) naSucces(0); return; }
      // Bewaar voor eventuele rollback.
      const wegLln = staat.leerlingen.filter(function (lln) { return ids[lln.id]; });
      const wegRegs = staat.registraties.filter(function (r) { return ids[r.llnId]; });
      haalPrullenbakWeg(ids);
      if (naSucces) naSucces(aantal);
      if (!isGasOmgeving()) { console.log('[LOKAAL] leegPrullenbak', Object.keys(ids)); return; }
      gasRun()
        .withSuccessHandler(function () { /* server bevestigt */ })
        .withFailureHandler(function (fout) {
          wegLln.forEach(function (lln) { staat.leerlingen.push(lln); });
          wegRegs.forEach(function (r) { staat.registraties.push(r); });
          tekenScherm(); tekenPrullenbakLijst();
          toonMelding('Prullenbak legen mislukt: ' + (fout.message || fout), 'fout');
        })
        .leegPrullenbak();
    }

    function haalPrullenbakWeg(ids) {
      staat.leerlingen = staat.leerlingen.filter(function (lln) { return !ids[lln.id]; });
      staat.registraties = staat.registraties.filter(function (r) { return !ids[r.llnId]; });
    }

    function verwijderTaakOp(id, naSucces) {
      const wegTaken = staat.taken.filter(function (t) { return t.id === id; });
      const wegRegs = staat.registraties.filter(function (r) { return r.taakId === id; });
      haalTaakWeg(id);
      if (naSucces) naSucces();
      if (!isGasOmgeving()) { console.log('[LOKAAL] deleteTaak', id); return; }
      gasRun()
        .withSuccessHandler(function () { /* server bevestigt */ })
        .withFailureHandler(function (fout) {
          wegTaken.forEach(function (t) { staat.taken.push(t); });
          wegRegs.forEach(function (r) { staat.registraties.push(r); });
          tekenActieveWeergave();
          toonMelding('Taak verwijderen mislukt: ' + (fout.message || fout), 'fout');
        })
        .deleteTaak(id);
    }

    function haalTaakWeg(id) {
      staat.taken = staat.taken.filter(function (taak) { return taak.id !== id; });
      staat.registraties = staat.registraties.filter(function (r) { return r.taakId !== id; });
    }

    function werkLeerlingBij(leerling) {
      for (let i = 0; i < staat.leerlingen.length; i++) {
        if (staat.leerlingen[i].id === leerling.id) {
          staat.leerlingen[i] = leerling;
          return;
        }
      }
    }

    function werkTaakBij(taak) {
      for (let i = 0; i < staat.taken.length; i++) {
        if (staat.taken[i].id === taak.id) {
          staat.taken[i] = taak;
          return;
        }
      }
    }

    function wijsOpenRegistratiesToeAanKlas(llnId, klas) {
      const doel = String(klas || '').trim();
      if (!doel) return;
      staat.registraties.forEach(function (r) {
        if (r.llnId !== llnId) return;
        if (String(r.klas || '').trim()) return;
        r.klas = doel;
      });
    }

    function slaLeerlingKlasOp(id, klas, naSucces) {
      const leerling = staat.leerlingen.filter(function (lln) { return lln.id === id; })[0];
      if (!leerling) { toonMelding('Leerling niet gevonden.', 'fout'); return; }
      const vorigeKlas = String(leerling.klas || '').trim();
      const geschraptIn = volgendeGeschraptIn(leerling, klas);
      const data = { id: id, klas: klas, geschraptIn: geschraptIn, klasSinds: nieuweTijdstempel() };
      const oudKlas = leerling.klas, oudGeschraptIn = leerling.geschraptIn, oudKlasSinds = leerling.klasSinds;
      const oudVolgorde = leerling.volgorde;
      leerling.klas = String(klas || '').trim();
      leerling.geschraptIn = geschraptIn;
      leerling.klasSinds = data.klasSinds;
      leerling.volgorde = volgendeLeerlingVolgorde(leerling.klas);
      const plek = staat.leerlingen.indexOf(leerling);
      if (plek !== -1) {
        staat.leerlingen.splice(plek, 1);
        staat.leerlingen.push(leerling);
      }
      wijsOpenRegistratiesToeAanKlas(id, vorigeKlas);
      if (naSucces) naSucces(leerling);
      if (!isGasOmgeving()) { console.log('[LOKAAL] updateLeerling', leerling); return; }
      gasRun()
        .withSuccessHandler(function (antwoord) { if (antwoord && antwoord.leerling) werkLeerlingBij(antwoord.leerling); })
        .withFailureHandler(function (fout) {
          leerling.klas = oudKlas; leerling.geschraptIn = oudGeschraptIn; leerling.klasSinds = oudKlasSinds;
          leerling.volgorde = oudVolgorde;
          tekenActieveWeergave();
          toonMelding('Klas wijzigen mislukt: ' + (fout.message || fout), 'fout');
        })
        .updateLeerling(data);
    }

    function volgendeGeschraptIn(leerling, nieuweKlas) {
      const vorige = String(leerling.klas || '').trim();
      const doel = String(nieuweKlas || '').trim();
      let lijst = geschraptInVan(leerling).slice();
      if (vorige && vorige !== doel && lijst.indexOf(vorige) === -1) lijst.push(vorige);
      return lijst.filter(function (klas) {
        return klas && klas !== doel && heeftRegistratiesInKlas(leerling, klas);
      });
    }

    function geschraptInVan(lln) {
      return (lln && lln.geschraptIn) ? lln.geschraptIn : [];
    }

    function leerlingVerwijderd(lln) {
      return !!(lln && String(lln.verwijderdOp || '').trim());
    }

    function actieveLeerlingen() {
      return staat.leerlingen.filter(function (lln) { return !leerlingVerwijderd(lln); });
    }

    function verwijderdeLeerlingen() {
      return staat.leerlingen.filter(leerlingVerwijderd).sort(function (a, b) {
        return String(b.verwijderdOp || '').localeCompare(String(a.verwijderdOp || ''));
      });
    }

    function uniekeKlassen() {
      const set = {};
      (staat.klassen || []).forEach(function (item) {
        const naam = klasNaamVan(item);
        if (naam) set[naam] = true;
      });
      actieveLeerlingen().forEach(function (lln) {
        if (lln.klas) set[lln.klas] = true;
        geschraptInVan(lln).forEach(function (klas) {
          if (klas) set[klas] = true;
        });
      });
      return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'nl'); });
    }

    function klasNaamVan(item) {
      if (!item) return '';
      if (typeof item === 'string') return String(item).trim();
      return String(item.naam || '').trim();
    }

    function klasVak(naam) {
      const doel = String(naam || '').trim().toUpperCase();
      if (!doel) return '';
      for (let i = 0; i < (staat.klassen || []).length; i++) {
        const item = staat.klassen[i];
        if (klasNaamVan(item).toUpperCase() === doel) {
          return typeof item === 'string' ? '' : String(item.vak || '').trim();
        }
      }
      return '';
    }

    function klasLabel(naam) {
      const klas = String(naam || '').trim();
      if (!klas) return '';
      const vak = klasVak(klas);
      return vak ? klas + ' - ' + vak : klas;
    }

    function normaliseerVaknaam(vak) {
      return String(vak || '').trim().replace(/\s+/g, ' ').slice(0, 32);
    }

    function leerlingVolgordeGetal(lln) {
      const n = parseInt(lln && lln.volgorde, 10);
      return n > 0 ? n : 0;
    }

    function volgendeLeerlingVolgorde(klas) {
      const doel = String(klas || '').trim();
      let max = 0;
      let heeft = false;
      staat.leerlingen.forEach(function (lln) {
        if (String(lln.klas || '').trim() !== doel) return;
        if (leerlingVerwijderd(lln)) return;
        const n = leerlingVolgordeGetal(lln);
        if (n) {
          heeft = true;
          if (n > max) max = n;
        }
      });
      return heeft ? max + 1 : 0;
    }

    function vergelijkLeerlingVolgorde(a, b) {
      const va = leerlingVolgordeGetal(a);
      const vb = leerlingVolgordeGetal(b);
      if (va && vb && va !== vb) return va - vb;
      if (va && !vb) return -1;
      if (!va && vb) return 1;
      return 0;
    }

    function leerlingenVanKlas() {
      return actieveLeerlingen().filter(function (lln) {
        return lln.klas === staat.gekozenKlas;
      }).sort(vergelijkLeerlingVolgorde);
    }

    function geschrapteLeerlingenVanKlas() {
      return actieveLeerlingen().filter(function (lln) {
        return lln.klas !== staat.gekozenKlas
          && geschraptInVan(lln).indexOf(staat.gekozenKlas) !== -1
          && heeftRegistratiesInKlas(lln, staat.gekozenKlas);
      });
    }

    function leerlingenInKruistabel() {
      return leerlingenVanKlas().concat(geschrapteLeerlingenVanKlas());
    }

    function taakGeldtVoorKlas(taak, klas) {
      const taakKlas = String(taak && taak.klas ? taak.klas : '').trim();
      return !taakKlas || taakKlas === klas;
    }

    function takenVanKlas() {
      return staat.taken.filter(function (taak) {
        return taakGeldtVoorKlas(taak, staat.gekozenKlas) && !isMateriaalTaak(taak);
      });
    }

    /** Chronologisch (kruistabel): deadline oplopend, bij gelijke deadline oudste taak eerst. */
    function vergelijkChronologisch(deadlineA, deadlineB, idA, idB) {
      const cmp = String(deadlineA || '').localeCompare(String(deadlineB || ''));
      if (cmp !== 0) return cmp;
      return String(idA || '').localeCompare(String(idB || ''));
    }

    /** Recentste eerst (leerlingenview): deadline aflopend, bij gelijke deadline nieuwste taak eerst. */
    function vergelijkRecentEerst(deadlineA, deadlineB, idA, idB) {
      const cmp = String(deadlineB || '').localeCompare(String(deadlineA || ''));
      if (cmp !== 0) return cmp;
      return String(idB || '').localeCompare(String(idA || ''));
    }

    /** Taken voor de kruistabel: filter + sortering (datum = chronologisch, oudste eerst). */
    function zichtbareTaken() {
      let lijst = takenVanKlas().filter(function (taak) {
        return groepZitInFilter(taakGroep(taak));
      });
      if (staat.sortering === 'soort') {
        const volgorde = ['huiswerk', 'les', 'leerkans', 'optioneel'];
        lijst.sort(function (a, b) {
          const ga = volgorde.indexOf(taakGroep(a));
          const gb = volgorde.indexOf(taakGroep(b));
          if (ga !== gb) return ga - gb;
          const typeCmp = String(a.type || '').localeCompare(String(b.type || ''), 'nl');
          if (typeCmp !== 0) return typeCmp;
          return vergelijkChronologisch(a.deadline, b.deadline, a.id, b.id);
        });
      } else {
        lijst.sort(function (a, b) {
          return vergelijkChronologisch(a.deadline, b.deadline, a.id, b.id);
        });
      }
      return lijst;
    }

    function groepZitInFilter(groep) {
      const filters = staat.groepFilters || [];
      if (!filters.length) return true;
      return filters.indexOf(groep) !== -1;
    }

    function voegGroepToeAanFilter(groep) {
      if (!groep || !staat.groepFilters.length) return;
      if (staat.groepFilters.indexOf(groep) !== -1) return;
      staat.groepFilters = staat.groepFilters.concat([groep]);
    }

    function gesorteerdeTaken() {
      return kruisTaken();
    }

    function korteDatum(iso) {
      const m = String(iso || '').match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return String(iso || '');
      return m[3] + '/' + m[2];
    }

    function formaatDatum(waarde) {
      const m = String(waarde || '').match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return String(waarde || '');
      return m[3] + '-' + m[2] + '-' + m[1];
    }

    /** Kolomtitel: "Huiswerk: Wiskunde" */
    function taakTitel(taak) {
      const type = String(taak && taak.type ? taak.type : '').trim();
      const naam = String(taak && taak.naam ? taak.naam : '').trim();
      if (type && naam) return type + ': ' + naam;
      return type || naam;
    }

    /** Groeperen op soort, niet op locatie: leerkans vs gewone plicht. */
    const TYPE_GROEP = {
      'Lesopdracht': 'huiswerk',
      'Huiswerk': 'huiswerk',
      'Huistaak': 'huiswerk',
      'Bookwidgetsopdracht': 'huiswerk',
      'Schriftelijke voorbereiding': 'leerkans',
      'Remediëringstaak': 'leerkans',
      'Remediëringsopdracht': 'leerkans',
      'Bijles': 'leerkans',
      'Toets verbeteren': 'leerkans',
      'Examen inkijken': 'leerkans',
      'Niet-verplichte taak': 'optioneel'
    };
    /** Geen inhaalbare opdracht: wel kruisje, geen opvolging/mail. */
    const TYPES_GEEN_OPVOLGING = {
      'Schriftelijke voorbereiding': true,
      'Bijles': true,
      'Examen inkijken': true,
      'Niet-verplichte taak': true
    };

    function taakGroep(taak) {
      return TYPE_GROEP[taak && taak.type] || 'optioneel';
    }

    function isMateriaalTaak(taak) {
      return String(taak && taak.type ? taak.type : '').trim() === 'Materiaal niet in orde';
    }

    function taakTeltMeeVoorOpvolging(taak) {
      const type = String(taak && taak.type ? taak.type : '').trim();
      return !TYPES_GEEN_OPVOLGING[type];
    }

    function leerlingOpId(id) {
      return staat.leerlingen.filter(function (lln) { return lln.id === id; })[0] || null;
    }

    /** Rood kruisje van vóór de laatste reset: blijft zichtbaar, telt niet mee. */
    function registratieTeltNietMee(lln, reg) {
      if (!lln || !reg || reg.status !== 'Niet in orde') return false;
      const naReset = String(lln.opvolgingResetOp || '').trim();
      return !!(naReset && String(reg.datumTijd || '') <= naReset);
    }

    function opvolgingAan() {
      return !!(staat.instellingen && staat.instellingen.opvolgingAan !== false);
    }

    function drempelNietInOrde() {
      const n = parseInt(staat.instellingen && staat.instellingen.opvolgingDrempel, 10);
      return (n >= DREMPEL_MIN && n <= DREMPEL_MAX) ? n : DEFAULT_OPVOLGING.opvolgingDrempel;
    }

    function normaliseerInstellingen(data) {
      const bron = data && typeof data === 'object' ? data : {};
      const drempel = parseInt(bron.opvolgingDrempel, 10);
      const aan = bron.opvolgingAan;
      let opvolgingAan = DEFAULT_OPVOLGING.opvolgingAan;
      if (aan === false || aan === 0 || aan === 'nee' || aan === 'false') opvolgingAan = false;
      else if (aan === true || aan === 1 || aan === 'ja' || aan === 'true') opvolgingAan = true;
      return {
        opvolgingAan: opvolgingAan,
        opvolgingDrempel: (drempel >= DREMPEL_MIN && drempel <= DREMPEL_MAX)
          ? drempel
          : DEFAULT_OPVOLGING.opvolgingDrempel,
        berichtLeerling: normaliseerBericht(bron.berichtLeerling, DEFAULT_OPVOLGING.berichtLeerling, OUD_BERICHT_LEERLING),
        berichtOuders: normaliseerBericht(bron.berichtOuders, DEFAULT_OPVOLGING.berichtOuders, OUD_BERICHT_OUDERS),
        berichtNablijf: normaliseerBericht(bron.berichtNablijf, DEFAULT_OPVOLGING.berichtNablijf, OUD_BERICHT_NABLIJF),
        periodes: normaliseerPeriodes(bron.periodes)
      };
    }

    function normaliseerIsoDatum(waarde) {
      const s = String(waarde == null ? '' : waarde).trim();
      return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
    }

    function normaliseerPeriodes(waarde) {
      let lijst = waarde;
      if (typeof waarde === 'string') {
        const ruw = waarde.trim();
        if (!ruw) return [];
        try { lijst = JSON.parse(ruw); } catch (e) { return []; }
      }
      if (!lijst || Object.prototype.toString.call(lijst) !== '[object Array]') return [];
      const result = [];
      const gezien = {};
      lijst.forEach(function (item, i) {
        if (!item || typeof item !== 'object') return;
        const naam = String(item.naam || '').trim().substring(0, PERIODE_NAAM_MAX);
        const van = normaliseerIsoDatum(item.van);
        const tot = normaliseerIsoDatum(item.tot);
        if (!naam || !van || !tot || van > tot) return;
        let id = String(item.id || '').trim();
        if (!/^[a-zA-Z0-9_-]{1,24}$/.test(id) || gezien[id]) {
          id = 'p' + String(i + 1);
          while (gezien[id]) id += 'x';
        }
        gezien[id] = true;
        result.push({ id: id, naam: naam, van: van, tot: tot });
      });
      result.sort(function (a, b) {
        const cmp = a.van.localeCompare(b.van);
        return cmp !== 0 ? cmp : a.tot.localeCompare(b.tot);
      });
      return result.slice(0, PERIODES_MAX);
    }

    function schooljaarStartJaar() {
      const d = new Date();
      const jaar = d.getFullYear();
      return (d.getMonth() + 1) >= 7 ? jaar : jaar - 1;
    }

    function standaardPeriodes() {
      const jaar = schooljaarStartJaar();
      const volgend = jaar + 1;
      return [
        { id: 't1', naam: 'Trimester 1', van: jaar + '-09-01', tot: jaar + '-12-31' },
        { id: 't2', naam: 'Trimester 2', van: volgend + '-01-01', tot: volgend + '-04-10' },
        { id: 't3', naam: 'Trimester 3', van: volgend + '-04-11', tot: volgend + '-06-30' }
      ];
    }

    function periodesUitInstellingen() {
      const lijst = (staat.instellingen && staat.instellingen.periodes) || [];
      return lijst.length ? lijst : standaardPeriodes();
    }

    function periodeVoorDeadline(deadline) {
      const d = normaliseerIsoDatum(deadline);
      if (!d) return null;
      const periodes = periodesUitInstellingen();
      for (let i = 0; i < periodes.length; i++) {
        const p = periodes[i];
        if (p.van <= d && d <= p.tot) return p;
      }
      return null;
    }

    function periodeGroepenVan(taken) {
      const periodes = periodesUitInstellingen();
      if (!periodes.length) return null;
      const bakken = {};
      periodes.forEach(function (p) { bakken[p.id] = []; });
      const overige = [];
      (taken || []).forEach(function (taak) {
        const p = periodeVoorDeadline(taak && taak.deadline);
        if (p) bakken[p.id].push(taak);
        else overige.push(taak);
      });
      const groepen = [];
      periodes.forEach(function (p) {
        if (bakken[p.id].length) {
          groepen.push({ id: p.id, naam: p.naam, van: p.van, tot: p.tot, taken: bakken[p.id] });
        }
      });
      if (overige.length) {
        groepen.push({ id: PERIODE_OVERIGE, naam: 'Overige', van: '', tot: '', taken: overige });
      }
      return groepen;
    }

    function periodeKeuzeIds(taken) {
      const ids = periodesUitInstellingen().map(function (p) { return p.id; });
      const groepen = periodeGroepenVan(taken || zichtbareTaken());
      if (groepen) {
        groepen.forEach(function (groep) {
          if (groep.id === PERIODE_OVERIGE && ids.indexOf(PERIODE_OVERIGE) === -1) ids.push(PERIODE_OVERIGE);
        });
      }
      return ids;
    }

    function leesVerborgenPeriodes() {
      try {
        const ruw = sessionStorage.getItem(PERIODE_OPSLag);
        if (!ruw) return [];
        const lijst = JSON.parse(ruw);
        return Object.prototype.toString.call(lijst) === '[object Array]' ? lijst.map(String) : [];
      } catch (e) { return []; }
    }

    function schrijfVerborgenPeriodes(ids) {
      try {
        const lijst = (ids || []).filter(Boolean);
        if (lijst.length) sessionStorage.setItem(PERIODE_OPSLag, JSON.stringify(lijst));
        else sessionStorage.removeItem(PERIODE_OPSLag);
      } catch (e) { /* negeren */ }
    }

    function verborgenPeriodeIds() {
      const geldig = periodeKeuzeIds();
      return leesVerborgenPeriodes().filter(function (id) { return geldig.indexOf(id) !== -1; });
    }

    function periodeIsZichtbaar(id, verborgen) {
      const uit = verborgen || verborgenPeriodeIds();
      return uit.indexOf(id) === -1;
    }

    function ficheFilterActief() {
      return staat.modal === 'fiche' && !!staat.ficheFilter;
    }

    function leegFicheFilter() {
      return { sortering: 'datum', groepFilters: [], verborgenPeriodes: [] };
    }

    function periodesFilterActief() {
      return verborgenPeriodeIds().length > 0;
    }

    function wisselPeriodeZichtbaar(id) {
      if (!id) return;
      const geldig = periodeKeuzeIds();
      if (geldig.indexOf(id) === -1) return;
      if (ficheFilterActief()) {
        let uit = (staat.ficheFilter.verborgenPeriodes || []).slice();
        const index = uit.indexOf(id);
        if (index === -1) uit.push(id);
        else uit.splice(index, 1);
        staat.ficheFilter.verborgenPeriodes = uit;
        staat.periodeMenuOpen = true;
        tekenFicheOpnieuw();
        return;
      }
      let uit = verborgenPeriodeIds();
      const index = uit.indexOf(id);
      if (index === -1) uit.push(id);
      else uit.splice(index, 1);
      schrijfVerborgenPeriodes(uit);
      staat.periodeMenuOpen = true;
      const wrapper = document.getElementById('kruistabel-wrapper');
      const scroll = wrapper ? wrapper.scrollLeft : 0;
      tekenScherm();
      const opnieuw = document.getElementById('kruistabel-wrapper');
      if (opnieuw) opnieuw.scrollLeft = scroll;
    }

    function kruisTaken() {
      const alle = zichtbareTaken();
      const groepen = periodeGroepenVan(alle);
      if (!groepen) return alle;
      const lijst = [];
      groepen.forEach(function (groep) {
        if (!periodeIsZichtbaar(groep.id)) return;
        groep.taken.forEach(function (taak) { lijst.push(taak); });
      });
      return lijst;
    }

    function isOudStandaardBericht(waarde, oud) {
      const tekst = String(waarde == null ? '' : waarde).replace(/\r\n/g, '\n').trim();
      if (!tekst || oud == null || oud === '') return false;
      const lijst = Object.prototype.toString.call(oud) === '[object Array]' ? oud : [oud];
      for (let i = 0; i < lijst.length; i++) {
        if (tekst === String(lijst[i] || '').replace(/\r\n/g, '\n').trim()) return true;
      }
      return false;
    }

    function normaliseerBericht(waarde, fallback, oud) {
      const tekst = String(waarde == null ? '' : waarde).replace(/\r\n/g, '\n');
      if (!tekst.trim() || isOudStandaardBericht(tekst, oud)) return fallback;
      return tekst.length > BERICHT_MAX ? tekst.substring(0, BERICHT_MAX) : tekst;
    }

    function leesLokaleInstellingen() {
      try {
        const ruw = localStorage.getItem('opvolgtool-instellingen');
        if (ruw) return normaliseerInstellingen(JSON.parse(ruw));
      } catch (e) { /* lokaal */ }
      return {
        opvolgingAan: DEFAULT_OPVOLGING.opvolgingAan,
        opvolgingDrempel: DEFAULT_OPVOLGING.opvolgingDrempel,
        berichtLeerling: DEFAULT_OPVOLGING.berichtLeerling,
        berichtOuders: DEFAULT_OPVOLGING.berichtOuders,
        berichtNablijf: DEFAULT_OPVOLGING.berichtNablijf,
        periodes: []
      };
    }

    function schrijfLokaleInstellingen(inst) {
      try {
        localStorage.setItem('opvolgtool-instellingen', JSON.stringify(inst));
      } catch (e) { /* lokaal */ }
    }

    function herstelLokaleDubbeleTaakIds(taken) {
      const gezien = {};
      let max = 0;
      (taken || []).forEach(function (taak) {
        const match = String(taak && taak.id ? taak.id : '').match(/^T(\d+)$/i);
        if (match) max = Math.max(max, parseInt(match[1], 10));
      });
      return (taken || []).map(function (taak) {
        const id = String(taak && taak.id ? taak.id : '');
        if (!id || !gezien[id]) {
          if (id) gezien[id] = true;
          return taak;
        }
        max += 1;
        const nieuw = 'T' + String(max).padStart(3, '0');
        gezien[nieuw] = true;
        return Object.assign({}, taak, { id: nieuw });
      });
    }

    function taakOpId(id) {
      return staat.taken.filter(function (taak) { return taak.id === id; })[0] || null;
    }

    /** Klas waarin deze registratie telt. Oude rijen zonder klas blijven bij de klas waar ze gehaald zijn. */
    function registratieKlas(reg, lln) {
      const klas = String(reg && reg.klas ? reg.klas : '').trim();
      if (klas) return klas;
      const sinds = String(lln && lln.klasSinds ? lln.klasSinds : '').trim();
      if (sinds && String(reg && reg.datumTijd ? reg.datumTijd : '') < sinds) {
        const vorige = geschraptInVan(lln);
        return vorige.length ? vorige[vorige.length - 1] : '';
      }
      return String(lln && lln.klas ? lln.klas : '').trim();
    }

    /** Registratie die in deze klas telt: oude voortgang blijft bij de vorige klas. */
    function laatsteRegistratieVoorKlas(lln, taak, klas) {
      if (!lln || !taak || !taakGeldtVoorKlas(taak, klas)) return null;
      let laatste = null;
      staat.registraties.forEach(function (r) {
        if (r.llnId !== lln.id || r.taakId !== taak.id) return;
        if (registratieKlas(r, lln) !== klas) return;
        laatste = r;
      });
      return laatste;
    }

    function heeftRegistratiesInKlas(lln, klas) {
      if (!lln || !klas) return false;
      for (let i = 0; i < staat.registraties.length; i++) {
        const r = staat.registraties[i];
        if (r.llnId !== lln.id || !r.status) continue;
        if (registratieKlas(r, lln) === klas) return true;
      }
      return false;
    }

    function verwerkData(data) {
      staat.leerlingen = data.leerlingen || [];
      staat.taken = herstelLokaleDubbeleTaakIds(data.taken || []);
      staat.registraties = data.registraties || [];
      staat.registratieBezig = false;
      staat.registratieWachtDirect = [];
      staat.registratieWachtrij = [];
      staat.taakWijzigingWachtrij = [];
      staat.klassen = (data.klassen || []).map(function (item) {
        if (item && typeof item === 'object') {
          return { naam: String(item.naam || '').trim(), vak: String(item.vak || '').trim() };
        }
        return { naam: String(item || '').trim(), vak: '' };
      }).filter(function (item) { return item.naam; });
      staat.webAppUrl = String(data.webAppUrl || '').trim();
      staat.leerlingUrl = String(data.leerlingUrl || '').trim();
      staat.instellingen = normaliseerInstellingen(data.instellingen);
      vulKlasKeuze();
      herstelKlas();
      tekenScherm();
      // Verberg de laadoverlay zodra de eerste data binnenkomt.
      const overlay = document.getElementById('laad-overlay');
      if (overlay) overlay.remove();
    }

    function normaliseerKlasnaam(naam) {
      return String(naam || '').trim().replace(/\s+/g, ' ').slice(0, 12);
    }

    function bestaandeKlasnaam(naam) {
      const gezocht = normaliseerKlasnaam(naam).toUpperCase();
      if (!gezocht) return '';
      const klassen = uniekeKlassen();
      for (let i = 0; i < klassen.length; i++) {
        if (klassen[i].toUpperCase() === gezocht) return klassen[i];
      }
      return '';
    }

    function voegKlasAanStaat(naam, vak) {
      const klas = bestaandeKlasnaam(naam) || normaliseerKlasnaam(naam);
      if (!klas) return '';
      const vakNaam = normaliseerVaknaam(vak);
      let gevonden = false;
      (staat.klassen || []).forEach(function (item, i) {
        if (klasNaamVan(item).toUpperCase() !== klas.toUpperCase()) return;
        gevonden = true;
        if (vakNaam && !(item && item.vak)) {
          staat.klassen[i] = { naam: klas, vak: vakNaam };
        }
      });
      if (!gevonden) staat.klassen.push({ naam: klas, vak: vakNaam });
      return klas;
    }

    function leerlingenVanKlasnaam(klas) {
      const doel = String(klas || '').trim();
      return staat.leerlingen.filter(function (lln) {
        return String(lln.klas || '').trim() === doel;
      });
    }

    function vulKlasKeuze() {
      const select = document.getElementById('veld-klas');
      const knoppen = document.getElementById('klas-knoppen');
      const leeg = document.getElementById('klas-leeg');
      const klassen = uniekeKlassen();
      if (staat.gekozenKlas && klassen.indexOf(staat.gekozenKlas) === -1) {
        klassen.push(staat.gekozenKlas);
        klassen.sort(function (a, b) { return a.localeCompare(b, 'nl'); });
      }
      select.innerHTML = '';
      knoppen.innerHTML = '';

      klassen.forEach(function (klas) {
        const opt = document.createElement('option');
        opt.value = klas;
        opt.textContent = klasLabel(klas);
        select.appendChild(opt);

        const groep = document.createElement('div');
        groep.className = 'inline-flex items-stretch rounded-xl border border-slate-200 bg-slate-50 overflow-hidden';

        const knop = document.createElement('button');
        knop.type = 'button';
        knop.className = 'px-5 py-3 hover:bg-indigo-50 text-base font-semibold';
        knop.textContent = klasLabel(klas);
        knop.addEventListener('click', function () { kiesKlas(klas); });

        const hernoem = document.createElement('button');
        hernoem.type = 'button';
        hernoem.className = 'hidden md:inline-flex items-center px-2 text-slate-400 hover:bg-indigo-50 hover:text-indigo-600';
        hernoem.setAttribute('data-actie', 'klas-hernoemen');
        hernoem.setAttribute('data-klas', klas);
        hernoem.setAttribute('title', 'Klasnaam wijzigen');
        hernoem.setAttribute('aria-label', 'Klasnaam van ' + klasLabel(klas) + ' wijzigen');
        hernoem.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>';

        const wis = document.createElement('button');
        wis.type = 'button';
        wis.className = 'hidden md:inline-flex items-center px-2.5 text-slate-400 hover:bg-rose-50 hover:text-rose-600 text-lg leading-none';
        wis.setAttribute('data-actie', 'klas-verwijderen');
        wis.setAttribute('data-klas', klas);
        wis.setAttribute('title', 'Klas ' + klasLabel(klas) + ' verwijderen');
        wis.setAttribute('aria-label', 'Klas ' + klasLabel(klas) + ' verwijderen');
        wis.textContent = '×';

        groep.appendChild(knop);
        groep.appendChild(hernoem);
        groep.appendChild(wis);
        knoppen.appendChild(groep);
      });

      const nieuw = document.createElement('button');
      nieuw.type = 'button';
      nieuw.className = 'px-5 py-3 rounded-xl border border-dashed border-slate-300 bg-white hover:bg-indigo-50 hover:border-indigo-300 text-base font-semibold text-slate-600';
      nieuw.setAttribute('data-actie', 'klas-nieuw');
      nieuw.textContent = 'Nieuwe klas';
      knoppen.appendChild(nieuw);

      if (leeg) leeg.classList.toggle('hidden', klassen.length > 0);
      if (staat.gekozenKlas) select.value = staat.gekozenKlas;
    }

    function herstelKlas() {
      var bewaard = '';
      try { bewaard = sessionStorage.getItem(KLAS_OPSLag) || ''; } catch (e) { bewaard = ''; }
      if (bewaard && uniekeKlassen().indexOf(bewaard) !== -1) {
        staat.gekozenKlas = bewaard;
        document.getElementById('veld-klas').value = bewaard;
      }
    }

    function kiesKlas(klas) {
      staat.gekozenKlas = klas;
      document.getElementById('veld-klas').value = klas;
      try {
        if (klas) sessionStorage.setItem(KLAS_OPSLag, klas);
        else sessionStorage.removeItem(KLAS_OPSLag);
      } catch (e) { /* negeren */ }
      console.log('[KLAS] actieve klas:', klas);
      staat.lijstLeerlingId = null;
      staat.lijstTaakId = null;
      staat.bulkModus = '';
      staat.geselecteerd = null;
      staat.selectie = [];
      staat.selectieAnker = null;
      staat.slepen = false;
      staat.sleepStart = null;
      tekenScherm();
    }

    function openNieuweKlasModal() {
      staat.modal = 'klas';
      document.getElementById('modal-toevoegen').setAttribute('aria-labelledby', 'modal-titel-klas');
      document.getElementById('veld-nieuwe-klas').value = '';
      document.getElementById('veld-nieuwe-klas-vak').value = '';
      verbergModalInhoud();
      document.getElementById('form-klas').classList.remove('hidden');
      zetModalKaartBreed(false);
      document.getElementById('modal-toevoegen').classList.remove('hidden');
      document.getElementById('veld-nieuwe-klas').focus();
    }

    function voegKlasToe(event) {
      event.preventDefault();
      const naam = normaliseerKlasnaam(document.getElementById('veld-nieuwe-klas').value);
      const vak = normaliseerVaknaam(document.getElementById('veld-nieuwe-klas-vak').value);
      if (!naam) {
        toonMelding('Vul een klasnaam in.', 'fout');
        return;
      }
      if (!vak) {
        toonMelding('Vul een vak in.', 'fout');
        return;
      }
      const bestaand = bestaandeKlasnaam(naam);
      if (bestaand && klasVak(bestaand)) {
        sluitModal();
        kiesKlas(bestaand);
        toonMelding('Klas ' + klasLabel(bestaand) + ' bestaat al.', 'ok');
        return;
      }
      voegKlasAanStaat(naam, vak);
      sluitModal();
      vulKlasKeuze();
      kiesKlas(naam);
      toonMelding('Klas ' + klasLabel(naam) + ' toegevoegd.', 'ok');
      if (!isGasOmgeving()) { console.log('[LOKAAL] saveKlas', { naam: naam, vak: vak }); return; }
      gasRun()
        .withSuccessHandler(function (antwoord) {
          const serverKlas = antwoord && antwoord.klas;
          if (serverKlas && serverKlas !== naam) {
            voegKlasAanStaat(serverKlas, antwoord.vak || vak);
            vulKlasKeuze(); kiesKlas(serverKlas);
          }
        })
        .withFailureHandler(function (fout) {
          staat.klassen = staat.klassen.filter(function (k) {
            return klasNaamVan(k).toUpperCase() !== naam.toUpperCase();
          });
          vulKlasKeuze(); tekenScherm();
          toonMelding('Klas toevoegen mislukt: ' + (fout.message || fout), 'fout');
        })
        .saveKlas({ naam: naam, vak: vak });
    }

    function openKlasHernoemen(klas) {
      const naam = bestaandeKlasnaam(klas) || normaliseerKlasnaam(klas) || staat.gekozenKlas;
      if (!naam) return;
      staat.klasTeHernoemen = naam;
      staat.modal = 'klas-hernoemen';
      document.getElementById('modal-toevoegen').setAttribute('aria-labelledby', 'modal-titel-klas-hernoemen');
      const veld = document.getElementById('veld-klas-hernoemen');
      veld.value = naam;
      verbergModalInhoud();
      document.getElementById('form-klas-hernoemen').classList.remove('hidden');
      zetModalKaartBreed(false);
      document.getElementById('modal-toevoegen').classList.remove('hidden');
      veld.focus();
      veld.select();
    }

    function vervangKlasnaamInStaat(oud, nieuw) {
      (staat.klassen || []).forEach(function (item) {
        if (klasNaamVan(item).toUpperCase() !== oud.toUpperCase()) return;
        if (typeof item === 'string') return;
        item.naam = nieuw;
      });
      staat.leerlingen.forEach(function (lln) {
        if (String(lln.klas || '').trim() === oud) lln.klas = nieuw;
        lln.geschraptIn = geschraptInVan(lln).map(function (item) {
          return item === oud ? nieuw : item;
        });
      });
      staat.taken.forEach(function (taak) {
        if (String(taak.klas || '').trim() === oud) taak.klas = nieuw;
      });
      staat.registraties.forEach(function (reg) {
        if (String(reg.klas || '').trim() === oud) reg.klas = nieuw;
      });
      if (staat.gekozenKlas === oud) staat.gekozenKlas = nieuw;
      try {
        if (sessionStorage.getItem(KLAS_OPSLag) === oud) sessionStorage.setItem(KLAS_OPSLag, nieuw);
      } catch (e) { /* negeren */ }
    }

    function slaKlasHernoemen(event) {
      event.preventDefault();
      const oud = staat.klasTeHernoemen;
      const nieuw = normaliseerKlasnaam(document.getElementById('veld-klas-hernoemen').value);
      if (!oud) return;
      if (!nieuw) {
        toonMelding('Vul een klasnaam in.', 'fout');
        return;
      }
      const botsing = bestaandeKlasnaam(nieuw);
      if (botsing && botsing.toUpperCase() !== oud.toUpperCase()) {
        toonMelding('Klas ' + klasLabel(botsing) + ' bestaat al.', 'fout');
        return;
      }
      if (nieuw === oud) {
        sluitModal();
        return;
      }
      vervangKlasnaamInStaat(oud, nieuw);
      sluitModal();
      vulKlasKeuze();
      tekenScherm();
      toonMelding('Klas hernoemd naar ' + klasLabel(nieuw) + '.', 'ok');
      if (!isGasOmgeving()) {
        console.log('[LOKAAL] updateKlas', { oud: oud, nieuw: nieuw });
        return;
      }
      gasRun()
        .withSuccessHandler(function (antwoord) {
          const serverNieuw = antwoord && antwoord.nieuw;
          if (serverNieuw && serverNieuw !== nieuw) {
            vervangKlasnaamInStaat(nieuw, serverNieuw);
            vulKlasKeuze();
            tekenScherm();
          }
        })
        .withFailureHandler(function (fout) {
          vervangKlasnaamInStaat(nieuw, oud);
          vulKlasKeuze();
          tekenScherm();
          toonMelding('Klas hernoemen mislukt: ' + (fout.message || fout), 'fout');
        })
        .updateKlas({ oud: oud, nieuw: nieuw });
    }

    function vraagKlasVerwijderen(klas) {
      const naam = bestaandeKlasnaam(klas) || normaliseerKlasnaam(klas) || staat.gekozenKlas;
      if (!naam) return;
      const bezet = leerlingenVanKlasnaam(naam);
      if (bezet.length) {
        toonMelding('Verplaats of verwijder eerst alle leerlingen van ' + naam + ' (ook in de prullenbak).', 'fout');
        return;
      }
      staat.klasTeVerwijderen = naam;
      staat.modal = 'klas-verwijderen';
      document.getElementById('modal-toevoegen').setAttribute('aria-labelledby', 'modal-titel-klas-verwijderen');
      document.getElementById('klas-verwijderen-tekst').innerHTML =
        'Dit verwijdert klas <span class="font-semibold">' + escapeHtml(klasLabel(naam)) +
        '</span> en de taken en registraties van die klas. Leerlingen blijven bewaard. Typ <span class="font-semibold">' +
        escapeHtml(naam) + '</span> om te bevestigen.';
      const veld = document.getElementById('veld-klas-verwijderen');
      veld.value = '';
      veld.setAttribute('placeholder', naam);
      zetKlasVerwijderKnop();
      verbergModalInhoud();
      document.getElementById('form-klas-verwijderen').classList.remove('hidden');
      zetModalKaartBreed(false);
      document.getElementById('modal-toevoegen').classList.remove('hidden');
      veld.focus();
    }

    function zetKlasVerwijderKnop() {
      const naam = staat.klasTeVerwijderen || '';
      const veld = document.getElementById('veld-klas-verwijderen');
      const knop = document.getElementById('knop-klas-verwijderen');
      knop.disabled = !naam || veld.value.trim() !== naam;
    }

    function bevestigKlasVerwijderen() {
      const naam = staat.klasTeVerwijderen || '';
      const veld = document.getElementById('veld-klas-verwijderen');
      if (!naam || veld.value.trim() !== naam) {
        toonMelding('Typ ' + naam + ' om te bevestigen.', 'fout');
        return;
      }
      const label = klasLabel(naam);
      const oudKlassen = staat.klassen.slice();
      const oudTaken = staat.taken.slice();
      const oudRegistraties = staat.registraties.slice();
      verwijderKlasLokaal(naam);
      sluitModal();
      vulKlasKeuze();
      tekenScherm();
      toonMelding('Klas ' + label + ' verwijderd.', 'ok');
      if (!isGasOmgeving()) { console.log('[LOKAAL] deleteKlas', naam); return; }
      gasRun()
        .withSuccessHandler(function () { /* server bevestigt */ })
        .withFailureHandler(function (fout) {
          staat.klassen = oudKlassen; staat.taken = oudTaken; staat.registraties = oudRegistraties;
          vulKlasKeuze(); tekenScherm();
          toonMelding('Klas verwijderen mislukt: ' + (fout.message || fout), 'fout');
        })
        .deleteKlas(naam);
    }

    function verwijderKlasLokaal(klas) {
      const naam = String(klas || '').trim();
      staat.klassen = (staat.klassen || []).filter(function (item) {
        return klasNaamVan(item).toUpperCase() !== naam.toUpperCase();
      });
      const wegTaken = {};
      staat.taken = staat.taken.filter(function (taak) {
        if (String(taak.klas || '').trim() === naam) {
          wegTaken[taak.id] = true;
          return false;
        }
        return true;
      });
      staat.registraties = staat.registraties.filter(function (reg) {
        if (wegTaken[reg.taakId]) return false;
        if (String(reg.klas || '').trim() === naam) return false;
        return true;
      });
      staat.leerlingen.forEach(function (lln) {
        lln.geschraptIn = geschraptInVan(lln).filter(function (item) { return item !== naam; });
      });
      if (staat.gekozenKlas === naam) {
        staat.gekozenKlas = '';
        try { sessionStorage.removeItem(KLAS_OPSLag); } catch (e) { /* negeren */ }
        document.getElementById('veld-klas').value = '';
      }
    }

    function escapeHtml(waarde) {
      return String(waarde == null ? '' : waarde)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeAttr(waarde) {
      return escapeHtml(waarde).replace(/'/g, '&#39;');
    }
</script>
