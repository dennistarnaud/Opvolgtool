        if (r.llnId !== lln.id || !r.status) continue;
        if (registratieKlas(r, lln) === klas) return true;
      }
      return false;
    }

    function verwerkData(data) {
      staat.leerlingen = data.leerlingen || [];
      staat.taken = herstelLokaleDubbeleTaakIds(data.taken || []);
      staat.registraties = data.registraties || [];
      staat.klassen = (data.klassen || []).map(function (item) {
        if (item && typeof item === 'object') {
          return { naam: String(item.naam || '').trim(), vak: String(item.vak || '').trim() };
        }
        return { naam: String(item || '').trim(), vak: '' };
      }).filter(function (item) { return item.naam; });
      staat.webAppUrl = String(data.webAppUrl || '').trim();
      staat.leerlingUrl = String(data.leerlingUrl || '').trim();
      staat.instellingen = normaliseerInstellingen(data.instellingen);
      vulKlasKeuze();
      herstelKlas();
      tekenScherm();
      // Verberg de laadoverlay zodra de eerste data binnenkomt.
      const overlay = document.getElementById('laad-overlay');
      if (overlay) overlay.remove();
    }

    function normaliseerKlasnaam(naam) {
      return String(naam || '').trim().replace(/\s+/g, ' ').slice(0, 12);
    }

    function bestaandeKlasnaam(naam) {
      const gezocht = normaliseerKlasnaam(naam).toUpperCase();
      if (!gezocht) return '';
      const klassen = uniekeKlassen();
      for (let i = 0; i < klassen.length; i++) {
        if (klassen[i].toUpperCase() === gezocht) return klassen[i];
      }
      return '';
    }

    function voegKlasAanStaat(naam, vak) {
      const klas = bestaandeKlasnaam(naam) || normaliseerKlasnaam(naam);
      if (!klas) return '';
      const vakNaam = normaliseerVaknaam(vak);
      let gevonden = false;
      (staat.klassen || []).forEach(function (item, i) {
        if (klasNaamVan(item).toUpperCase() !== klas.toUpperCase()) return;
        gevonden = true;
        if (vakNaam && !(item && item.vak)) {
          staat.klassen[i] = { naam: klas, vak: vakNaam };
        }
      });
      if (!gevonden) staat.klassen.push({ naam: klas, vak: vakNaam });
      return klas;
    }

    function leerlingenVanKlasnaam(klas) {
      const doel = String(klas || '').trim();
      return staat.leerlingen.filter(function (lln) {
        return String(lln.klas || '').trim() === doel;
      });
    }

    function vulKlasKeuze() {
      const select = document.getElementById('veld-klas');
      const knoppen = document.getElementById('klas-knoppen');
      const leeg = document.getElementById('klas-leeg');
      const klassen = uniekeKlassen();
      if (staat.gekozenKlas && klassen.indexOf(staat.gekozenKlas) === -1) {
        klassen.push(staat.gekozenKlas);
        klassen.sort(function (a, b) { return a.localeCompare(b, 'nl'); });
      }
      select.innerHTML = '<option value="">Kies een klas</option>';
      knoppen.innerHTML = '';

      klassen.forEach(function (klas) {
        const opt = document.createElement('option');
        opt.value = klas;
        opt.textContent = klasLabel(klas);
        select.appendChild(opt);

        const groep = document.createElement('div');
        groep.className = 'inline-flex items-stretch rounded-xl border border-slate-200 bg-slate-50 overflow-hidden';

        const knop = document.createElement('button');
        knop.type = 'button';
        knop.className = 'px-5 py-3 hover:bg-indigo-50 text-base font-semibold';
        knop.textContent = klasLabel(klas);
        knop.addEventListener('click', function () { kiesKlas(klas); });

        const hernoem = document.createElement('button');
        hernoem.type = 'button';
        hernoem.className = 'px-2 text-slate-400 hover:bg-indigo-50 hover:text-indigo-600';
        hernoem.setAttribute('data-actie', 'klas-hernoemen');
        hernoem.setAttribute('data-klas', klas);
        hernoem.setAttribute('title', 'Klasnaam wijzigen');
        hernoem.setAttribute('aria-label', 'Klasnaam van ' + klasLabel(klas) + ' wijzigen');
        hernoem.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>';

        const wis = document.createElement('button');
        wis.type = 'button';
        wis.className = 'px-2.5 text-slate-400 hover:bg-rose-50 hover:text-rose-600 text-lg leading-none';
        wis.setAttribute('data-actie', 'klas-verwijderen');
        wis.setAttribute('data-klas', klas);
        wis.setAttribute('title', 'Klas ' + klasLabel(klas) + ' verwijderen');
        wis.setAttribute('aria-label', 'Klas ' + klasLabel(klas) + ' verwijderen');
        wis.textContent = '×';

        groep.appendChild(knop);
        groep.appendChild(hernoem);
        groep.appendChild(wis);
        knoppen.appendChild(groep);
      });

      const nieuw = document.createElement('button');
      nieuw.type = 'button';
      nieuw.className = 'px-5 py-3 rounded-xl border border-dashed border-slate-300 bg-white hover:bg-indigo-50 hover:border-indigo-300 text-base font-semibold text-slate-600';
      nieuw.setAttribute('data-actie', 'klas-nieuw');
      nieuw.textContent = 'Nieuwe klas';
      knoppen.appendChild(nieuw);

      const optNieuw = document.createElement('option');
      optNieuw.value = '__nieuw__';
      optNieuw.textContent = 'Nieuwe klas…';
      select.appendChild(optNieuw);

      if (leeg) leeg.classList.toggle('hidden', klassen.length > 0);
      if (staat.gekozenKlas) select.value = staat.gekozenKlas;
    }

    function herstelKlas() {
      var bewaard = '';
      try { bewaard = sessionStorage.getItem(KLAS_OPSLag) || ''; } catch (e) { bewaard = ''; }
      if (bewaard && uniekeKlassen().indexOf(bewaard) !== -1) {
        staat.gekozenKlas = bewaard;
        document.getElementById('veld-klas').value = bewaard;
      }
    }

    function kiesKlas(klas) {
      staat.gekozenKlas = klas;
      document.getElementById('veld-klas').value = klas;
      try {
        if (klas) sessionStorage.setItem(KLAS_OPSLag, klas);
        else sessionStorage.removeItem(KLAS_OPSLag);
      } catch (e) { /* negeren */ }
      console.log('[KLAS] actieve klas:', klas);
      staat.lijstLeerlingId = null;
      staat.lijstTaakId = null;
      staat.bulkModus = '';
      staat.geselecteerd = null;
      staat.selectie = [];
      staat.selectieAnker = null;
      staat.slepen = false;
      staat.sleepStart = null;
      tekenScherm();
    }

    function openNieuweKlasModal() {
      staat.modal = 'klas';
      document.getElementById('modal-toevoegen').setAttribute('aria-labelledby', 'modal-titel-klas');
      document.getElementById('veld-nieuwe-klas').value = '';
      document.getElementById('veld-nieuwe-klas-vak').value = '';
      verbergModalInhoud();
      document.getElementById('form-klas').classList.remove('hidden');
      zetModalKaartBreed(false);
      document.getElementById('modal-toevoegen').classList.remove('hidden');
      document.getElementById('veld-nieuwe-klas').focus();
    }

    function voegKlasToe(event) {
      event.preventDefault();
      const naam = normaliseerKlasnaam(document.getElementById('veld-nieuwe-klas').value);
      const vak = normaliseerVaknaam(document.getElementById('veld-nieuwe-klas-vak').value);
      if (!naam) {
        toonMelding('Vul een klasnaam in.', 'fout');
        return;
      }
      if (!vak) {
        toonMelding('Vul een vak in.', 'fout');
        return;
      }
      const bestaand = bestaandeKlasnaam(naam);
      if (bestaand && klasVak(bestaand)) {
        sluitModal();
        kiesKlas(bestaand);
        toonMelding('Klas ' + klasLabel(bestaand) + ' bestaat al.', 'ok');
        return;
      }
      voegKlasAanStaat(naam, vak);
      sluitModal();
      vulKlasKeuze();
      kiesKlas(naam);
      toonMelding('Klas ' + klasLabel(naam) + ' toegevoegd.', 'ok');
      if (!isGasOmgeving()) { console.log('[LOKAAL] saveKlas', { naam: naam, vak: vak }); return; }
      gasRun()
        .withSuccessHandler(function (antwoord) {
          const serverKlas = antwoord && antwoord.klas;
          if (serverKlas && serverKlas !== naam) {
            voegKlasAanStaat(serverKlas, antwoord.vak || vak);
            vulKlasKeuze(); kiesKlas(serverKlas);
          }
        })
        .withFailureHandler(function (fout) {
          staat.klassen = staat.klassen.filter(function (k) {
            return klasNaamVan(k).toUpperCase() !== naam.toUpperCase();
          });
          vulKlasKeuze(); tekenScherm();
          toonMelding('Klas toevoegen mislukt: ' + (fout.message || fout), 'fout');
        })
        .saveKlas({ naam: naam, vak: vak });
    }

    function openKlasHernoemen(klas) {
      const naam = bestaandeKlasnaam(klas) || normaliseerKlasnaam(klas) || staat.gekozenKlas;
      if (!naam) return;
      staat.klasTeHernoemen = naam;
      staat.modal = 'klas-hernoemen';
      document.getElementById('modal-toevoegen').setAttribute('aria-labelledby', 'modal-titel-klas-hernoemen');
      const veld = document.getElementById('veld-klas-hernoemen');
      veld.value = naam;
      verbergModalInhoud();
      document.getElementById('form-klas-hernoemen').classList.remove('hidden');
      zetModalKaartBreed(false);
      document.getElementById('modal-toevoegen').classList.remove('hidden');
      veld.focus();
      veld.select();
    }

    function vervangKlasnaamInStaat(oud, nieuw) {
      (staat.klassen || []).forEach(function (item) {
        if (klasNaamVan(item).toUpperCase() !== oud.toUpperCase()) return;
        if (typeof item === 'string') return;
        item.naam = nieuw;
      });
      staat.leerlingen.forEach(function (lln) {
        if (String(lln.klas || '').trim() === oud) lln.klas = nieuw;
        lln.geschraptIn = geschraptInVan(lln).map(function (item) {
          return item === oud ? nieuw : item;
        });
      });
      staat.taken.forEach(function (taak) {
        if (String(taak.klas || '').trim() === oud) taak.klas = nieuw;
      });
      staat.registraties.forEach(function (reg) {
        if (String(reg.klas || '').trim() === oud) reg.klas = nieuw;
      });
      if (staat.gekozenKlas === oud) staat.gekozenKlas = nieuw;
      try {
        if (sessionStorage.getItem(KLAS_OPSLag) === oud) sessionStorage.setItem(KLAS_OPSLag, nieuw);
      } catch (e) { /* negeren */ }
    }

    function slaKlasHernoemen(event) {
      event.preventDefault();
      const oud = staat.klasTeHernoemen;
      const nieuw = normaliseerKlasnaam(document.getElementById('veld-klas-hernoemen').value);
      if (!oud) return;
      if (!nieuw) {
        toonMelding('Vul een klasnaam in.', 'fout');
        return;
      }
      const botsing = bestaandeKlasnaam(nieuw);
      if (botsing && botsing.toUpperCase() !== oud.toUpperCase()) {
        toonMelding('Klas ' + klasLabel(botsing) + ' bestaat al.', 'fout');
        return;
      }
      if (nieuw === oud) {
        sluitModal();
        return;
      }
      vervangKlasnaamInStaat(oud, nieuw);
      sluitModal();
      vulKlasKeuze();
      tekenScherm();
      toonMelding('Klas hernoemd naar ' + klasLabel(nieuw) + '.', 'ok');
      if (!isGasOmgeving()) {
        console.log('[LOKAAL] updateKlas', { oud: oud, nieuw: nieuw });
        return;
      }
      gasRun()
        .withSuccessHandler(function (antwoord) {
          const serverNieuw = antwoord && antwoord.nieuw;
          if (serverNieuw && serverNieuw !== nieuw) {
            vervangKlasnaamInStaat(nieuw, serverNieuw);
            vulKlasKeuze();
            tekenScherm();
          }
        })
        .withFailureHandler(function (fout) {
          vervangKlasnaamInStaat(nieuw, oud);
          vulKlasKeuze();
          tekenScherm();
          toonMelding('Klas hernoemen mislukt: ' + (fout.message || fout), 'fout');
        })
        .updateKlas({ oud: oud, nieuw: nieuw });
    }

    function vraagKlasVerwijderen(klas) {
      const naam = bestaandeKlasnaam(klas) || normaliseerKlasnaam(klas) || staat.gekozenKlas;
      if (!naam) return;
      const bezet = leerlingenVanKlasnaam(naam);
      if (bezet.length) {
        toonMelding('Verplaats of verwijder eerst alle leerlingen van ' + naam + ' (ook in de prullenbak).', 'fout');
        return;
      }
      staat.klasTeVerwijderen = naam;
      staat.modal = 'klas-verwijderen';
      document.getElementById('modal-toevoegen').setAttribute('aria-labelledby', 'modal-titel-klas-verwijderen');
      document.getElementById('klas-verwijderen-tekst').innerHTML =
        'Dit verwijdert klas <span class="font-semibold">' + escapeHtml(klasLabel(naam)) +
        '</span> en de taken en registraties van die klas. Leerlingen blijven bewaard. Typ <span class="font-semibold">' +
        escapeHtml(naam) + '</span> om te bevestigen.';
      const veld = document.getElementById('veld-klas-verwijderen');
      veld.value = '';
      veld.setAttribute('placeholder', naam);
      zetKlasVerwijderKnop();
      verbergModalInhoud();
      document.getElementById('form-klas-verwijderen').classList.remove('hidden');
      zetModalKaartBreed(false);
      document.getElementById('modal-toevoegen').classList.remove('hidden');
      veld.focus();
    }

    function zetKlasVerwijderKnop() {
      const naam = staat.klasTeVerwijderen || '';
      const veld = document.getElementById('veld-klas-verwijderen');
      const knop = document.getElementById('knop-klas-verwijderen');
      knop.disabled = !naam || veld.value.trim() !== naam;
    }

    function bevestigKlasVerwijderen() {
      const naam = staat.klasTeVerwijderen || '';
      const veld = document.getElementById('veld-klas-verwijderen');
      if (!naam || veld.value.trim() !== naam) {
        toonMelding('Typ ' + naam + ' om te bevestigen.', 'fout');
        return;
      }
      const label = klasLabel(naam);
      const oudKlassen = staat.klassen.slice();
      const oudTaken = staat.taken.slice();
      const oudRegistraties = staat.registraties.slice();
      verwijderKlasLokaal(naam);
      sluitModal();
      vulKlasKeuze();
      tekenScherm();
      toonMelding('Klas ' + label + ' verwijderd.', 'ok');
      if (!isGasOmgeving()) { console.log('[LOKAAL] deleteKlas', naam); return; }
      gasRun()
        .withSuccessHandler(function () { /* server bevestigt */ })
        .withFailureHandler(function (fout) {
          staat.klassen = oudKlassen; staat.taken = oudTaken; staat.registraties = oudRegistraties;
          vulKlasKeuze(); tekenScherm();
          toonMelding('Klas verwijderen mislukt: ' + (fout.message || fout), 'fout');
        })
        .deleteKlas(naam);
    }

    function verwijderKlasLokaal(klas) {
      const naam = String(klas || '').trim();
      staat.klassen = (staat.klassen || []).filter(function (item) {
        return klasNaamVan(item).toUpperCase() !== naam.toUpperCase();
      });
      const wegTaken = {};
      staat.taken = staat.taken.filter(function (taak) {
        if (String(taak.klas || '').trim() === naam) {
          wegTaken[taak.id] = true;
          return false;
        }
        return true;
      });
      staat.registraties = staat.registraties.filter(function (reg) {
        if (wegTaken[reg.taakId]) return false;
        if (String(reg.klas || '').trim() === naam) return false;
        return true;
      });
      staat.leerlingen.forEach(function (lln) {
        lln.geschraptIn = geschraptInVan(lln).filter(function (item) { return item !== naam; });
      });
      if (staat.gekozenKlas === naam) {
        staat.gekozenKlas = '';
        try { sessionStorage.removeItem(KLAS_OPSLag); } catch (e) { /* negeren */ }
        document.getElementById('veld-klas').value = '';
      }
    }

    function tekenScherm() {
      tekenPrullenbakKnop();
      tekenTabs();
      const heeftKlas = !!staat.gekozenKlas;
      document.getElementById('scherm-klaskeuze').classList.toggle('hidden', heeftKlas);
      document.getElementById('paneel-kruistabel').classList.toggle('hidden', !heeftKlas || staat.actieveTab !== 'kruistabel');
      document.getElementById('paneel-leerling').classList.toggle('hidden', !heeftKlas || staat.actieveTab !== 'leerling');
      document.getElementById('paneel-taak').classList.toggle('hidden', !heeftKlas || staat.actieveTab !== 'taak');
      if (!heeftKlas) {
        zetLijstDetailChrome();
        return;
      }
      document.getElementById('kruis-klaslabel').textContent = klasLabel(staat.gekozenKlas);
      const hernoem = document.getElementById('knop-kruis-klas-hernoemen');
      if (hernoem) hernoem.setAttribute('data-klas', staat.gekozenKlas);
      const wis = document.getElementById('knop-kruis-klas-verwijderen');
      if (wis) wis.setAttribute('data-klas', staat.gekozenKlas);
      tekenActieveWeergave();
      zetLijstDetailChrome();
    }

    function zetNavHoogte() {
      const nav = document.querySelector('nav');
      if (!nav) return;
      const hoogte = nav.offsetParent ? Math.round(nav.getBoundingClientRect().height) : 0;
      document.documentElement.style.setProperty('--nav-h', hoogte + 'px');
    }

    function lijstDetailOpen() {
      if (!schermIsSmal()) return false;
      if (staat.actieveTab === 'leerling') return !!staat.lijstLeerlingId;
      if (staat.actieveTab === 'taak') return !!staat.lijstTaakId;
      return false;
    }

    function zetLijstDetailChrome() {
      document.body.classList.toggle('lijst-detail', lijstDetailOpen());
      zetNavHoogte();
    }

    function tekenActieveWeergave() {
      if (staat.actieveTab === 'kruistabel') tekenKruistabel();
      else if (staat.actieveTab === 'leerling') tekenLeerlingWeergave();
      else tekenTaakWeergave();
      if (staat.modal === 'fiche') {
        const knop = document.getElementById('knop-leerling-verwijderen');
        const lln = knop ? leerlingOpId(knop.getAttribute('data-id')) : null;
        if (lln && !leerlingVerwijderd(lln)) tekenLeerlingFiche(lln);
      }
    }

    function schermIsSmal() {
      return window.matchMedia('(max-width: 767px)').matches;
    }

    function gewensteTab() {
      if (!schermIsSmal()) return 'kruistabel';
      return staat.mobieleTab === 'taak' ? 'taak' : 'leerling';
    }

    function pasTabAanScherm() {
      const doel = gewensteTab();
      if (staat.actieveTab === doel) {
        tekenTabs();
        return;
      }
      staat.actieveTab = doel;
      tekenScherm();
    }

    function tekenTabs() {
      ['leerling', 'taak'].forEach(function (naam) {
        const knop = document.getElementById('tab-' + naam);
        const actief = staat.actieveTab === naam;
        knop.className = 'tab-knop flex-1 inline-flex justify-center px-4 py-2.5 rounded-lg text-sm font-semibold ' +
          (actief ? TAB_ACTIEF : TAB_INACTIEF);
        knop.setAttribute('aria-selected', String(actief));
      });
    }

    function tekenSorteerFilterKnoppen() {
      document.querySelectorAll('.sort-knop').forEach(function (knop) {
        knop.classList.toggle('actief', knop.getAttribute('data-sort') === staat.sortering);
      });
      document.querySelectorAll('.filter-groep').forEach(function (knop) {
        const groep = knop.getAttribute('data-groep');
        knop.classList.toggle('actief', staat.groepFilters.indexOf(groep) !== -1);
      });
      const filterActief = staat.sortering !== 'datum' || !!(staat.groepFilters && staat.groepFilters.length);
      document.querySelectorAll('.filter-indicatie').forEach(function (punt) {
        punt.classList.toggle('hidden', !filterActief);
      });
      document.querySelectorAll('.knop-filter-wissen').forEach(function (knop) {
        knop.disabled = !filterActief;
      });
    }

    function wisselFilterPaneel(knop) {
      const wrap = knop && knop.closest ? knop.closest('.filter-wrap') : null;
      const paneel = wrap ? wrap.querySelector('.paneel-filter') : null;
      if (!paneel) return;
      const open = paneel.classList.contains('hidden');
      paneel.classList.toggle('hidden', !open);
      knop.setAttribute('aria-expanded', String(open));
      if (!wrap.closest || !wrap.closest('#form-fiche')) staat.filterPaneelOpen = open;
    }

    function herstelFilterPaneel() {
      if (!staat.filterPaneelOpen || !schermIsSmal()) return;
      document.querySelectorAll('.paneel-filter').forEach(function (paneel) {
        if (paneel.closest && paneel.closest('#form-fiche')) return;
        paneel.classList.remove('hidden');
      });
      document.querySelectorAll('.knop-filter').forEach(function (knop) {
        if (knop.closest && knop.closest('#form-fiche')) return;
        knop.setAttribute('aria-expanded', 'true');
      });
    }

    function zetSortering(naam) {
      staat.sortering = naam === 'soort' ? 'soort' : 'datum';
      tekenActieveWeergave();
    }

    function wisselGroepFilter(groep) {
      const lijst = staat.groepFilters.slice();
      const index = lijst.indexOf(groep);
      if (index === -1) lijst.push(groep);
      else lijst.splice(index, 1);
      staat.groepFilters = lijst;
      tekenActieveWeergave();
    }

    function wisFilters() {
      staat.sortering = 'datum';
      staat.groepFilters = [];
      tekenActieveWeergave();
    }

    function terugKnopHtml() {
      return '<button type="button" data-actie="lijst-terug" class="shrink-0 inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800" aria-label="Terug">' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M15 18l-6-6 6-6" /></svg></button>';

    function lijstStatusKlasse(status, actief, teltNietMee) {
      if (status === 'In orde') return actief ? 'bg-emerald-500 text-white' : 'bg-emerald-50 text-emerald-800';
      if (status === 'Niet in orde') {
        if (teltNietMee && actief) return 'bg-rose-200 text-rose-800 ring-1 ring-rose-300';
        return actief ? 'bg-rose-500 text-white' : 'bg-rose-50 text-rose-800';
      }
      if (status === 'Afwezig') return actief ? 'bg-slate-500 text-white' : 'bg-slate-100 text-slate-600';
      if (status === 'Te laat') return actief ? 'bg-yellow-400 text-yellow-950' : 'bg-yellow-100 text-yellow-900';
      if (status === 'Te maken') return actief ? 'bg-yellow-100 text-yellow-900 ring-1 ring-yellow-300' : 'bg-yellow-50 text-yellow-800';
      return 'bg-slate-100 text-slate-500';
    }

    function lijstStatusKnoppen(llnId, taakId, huidige, actie) {
      const knopActie = actie || 'lijst-status';
      const lln = llnId ? leerlingOpId(llnId) : null;
      const taak = taakId ? taakOpId(taakId) : null;
      const huidigeReg = lln && taak ? laatsteRegistratieVoorKlas(lln, taak, staat.gekozenKlas) : null;
      return '<div class="flex flex-wrap gap-1" role="group" aria-label="Status">' +
        STATUS_OPTIES.map(function (status) {
          const actief = status === huidige;
          const teltNietMee = actief && registratieTeltNietMee(lln, huidigeReg);
          const titel = teltNietMee ? celStatusLabel(status, true) : status;
          return '<button type="button" class="lijst-status inline-flex items-center justify-center w-9 h-9 rounded-lg text-sm font-bold ' +
            lijstStatusKlasse(status, actief, teltNietMee) + '" data-actie="' + knopActie + '" data-lln="' + escapeAttr(llnId || '') +
            '" data-taak="' + escapeAttr(taakId || '') + '" data-status="' + escapeAttr(status) +
            '" title="' + escapeAttr(titel) + '" aria-label="' + escapeAttr(titel) + '" aria-pressed="' + actief + '">' +
            celTekst(status) + '</button>';
        }).join('') + '</div>';
    }

    function tellingVoor(lln, taak) {
      const result = { inOrde: 0, nietOk: 0, afgehandeld: 0, afwezig: 0, teLaat: 0, teMaken: 0, leeg: 0, totaal: 0 };
      const leerlingen = lln ? [lln] : leerlingenVanKlas();
      const taken = taak ? [taak] : zichtbareTaken();
      leerlingen.forEach(function (leerling) {
        taken.forEach(function (item) {
          result.totaal += 1;
          const reg = laatsteRegistratieVoorKlas(leerling, item, staat.gekozenKlas);
          const status = reg && reg.status;
          if (status === 'In orde') result.inOrde += 1;
          else if (status === 'Niet in orde') {
            if (registratieTeltNietMee(leerling, reg)) result.afgehandeld += 1;
            else result.nietOk += 1;
          }
          else if (status === 'Afwezig') result.afwezig += 1;
          else if (status === 'Te laat') result.teLaat += 1;
          else if (status === 'Te maken') result.teMaken += 1;
          else result.leeg += 1;
        });
      });
      return result;
    }

    function tellingTekst(t) {
      if (!t.totaal) return '';
      const delen = [];
      if (t.inOrde) delen.push(t.inOrde + ' in orde');
      if (t.nietOk) delen.push(t.nietOk + ' niet OK');
      if (t.afgehandeld) delen.push(t.afgehandeld + ' al opgevolgd');
      if (t.teLaat) delen.push(t.teLaat + ' te laat');
      if (t.teMaken) delen.push(t.teMaken + ' te maken');
      if (t.afwezig) delen.push(t.afwezig + ' afwezig');
      if (t.leeg) delen.push(t.leeg + ' open');
      return delen.join(' · ');
    }

    function tekenMetScroll(teken) {
      const y = window.scrollY;
      teken();
      window.scrollTo(0, y);
    }

    function tekenLeerlingWeergave() {
      const doel = document.getElementById('leerling-weergave');
      const leerling = staat.lijstLeerlingId ? leerlingOpId(staat.lijstLeerlingId) : null;
      if (staat.lijstLeerlingId && (!leerling || leerlingVerwijderd(leerling) || leerling.klas !== staat.gekozenKlas)) {
        staat.lijstLeerlingId = null;
      }
      const vorigeLijst = doel.querySelector('[data-takenlijst]');
      if (vorigeLijst) {
        const hoogte = vorigeLijst.offsetHeight;
        if (hoogte > (staat.leerlingLijstMinHoogte || 0)) staat.leerlingLijstMinHoogte = hoogte;
      }
      if (!staat.lijstLeerlingId) staat.leerlingLijstMinHoogte = 0;
      doel.innerHTML = staat.lijstLeerlingId
        ? htmlLeerlingDetail(leerlingOpId(staat.lijstLeerlingId))
        : htmlLeerlingLijst();
      const nieuweLijst = doel.querySelector('[data-takenlijst]');
      if (nieuweLijst) {
        if (staat.leerlingLijstMinHoogte) {
          nieuweLijst.style.minHeight = staat.leerlingLijstMinHoogte + 'px';
        }
        if (nieuweLijst.offsetHeight > (staat.leerlingLijstMinHoogte || 0)) {
          staat.leerlingLijstMinHoogte = nieuweLijst.offsetHeight;
          nieuweLijst.style.minHeight = staat.leerlingLijstMinHoogte + 'px';
        }
      }
      tekenSorteerFilterKnoppen();
      herstelFilterPaneel();
      zetLijstDetailChrome();
      koppelLeerlingSleep(doel);
    }

    function htmlLeerlingLijst() {
      const leerlingen = leerlingenVanKlas();
      const rijen = leerlingen.map(function (lln) {
        const t = tellingVoor(lln, null);
        const extra = t.nietOk || t.afgehandeld || t.teLaat || t.teMaken || t.leeg
          ? tellingTekst({ inOrde: 0, nietOk: t.nietOk, afgehandeld: t.afgehandeld, teLaat: t.teLaat, teMaken: t.teMaken, afwezig: 0, leeg: t.leeg, totaal: t.totaal })
          : (t.totaal ? 'Alles in orde' : 'Nog geen taken');
        return '<div class="leerling-lijst-rij flex items-stretch hover:bg-slate-50" data-leerling-rij data-lln="' + escapeAttr(lln.id) + '">' +
          leerlingSleepKnopHtml(lln) +
          '<button type="button" data-actie="lijst-leerling" data-id="' + escapeAttr(lln.id) + '" class="min-w-0 flex-1 text-left px-3 py-3 flex items-center justify-between gap-3 min-h-[3rem]">' +
            '<span class="min-w-0">' +
              '<span class="flex items-center gap-1.5 text-sm font-semibold text-slate-900">' +
                '<span class="truncate">' + escapeHtml(lln.naam) + '</span>' + opvolgSeinHtml(lln) +
              '</span>' +
              '<span class="block text-[11px] text-slate-500 mt-0.5">' + escapeHtml(extra) + '</span>' +
            '</span>' +
            '<span class="shrink-0 text-slate-300" aria-hidden="true">›</span>' +

    function bulkKandidaten(taakId, status) {
      const taak = taakOpId(taakId);
      if (!taak || !status) return [];
      const items = [];
      leerlingenVanKlas().forEach(function (lln) {
        const vorige = laatsteRegistratieVoorKlas(lln, taak, staat.gekozenKlas);
        if (vorige && vorige.status) return;
        items.push({
          llnId: lln.id,
          taakId: taakId,
          status: status,
          opmerking: ''
        });
      });
      return items;
    }

    function voerBulkUit(items, melding) {
      if (!items.length) return;
      // Optimistisch: alle rijen meteen lokaal toevoegen.
      const tempRijen = [];
      items.forEach(function (item) {
        const payload = {
          llnId: item.llnId,
          taakId: item.taakId,
          status: item.status,
          opmerking: item.opmerking || '',
          klas: String(item.klas || staat.gekozenKlas || '').trim()
        };
        const tempRij = Object.assign({ datumTijd: nieuweTijdstempel() }, payload);
        staat.registraties.push(tempRij);
        tempRijen.push(tempRij);
        item._payload = payload;
      });
      const llnIds = {};
      items.forEach(function (item) { llnIds[item.llnId] = true; });
      Object.keys(llnIds).forEach(function (llnId) {
        wisOpvolgingBijGeenTekorten(leerlingOpId(llnId));
      });
      tekenMetScroll(tekenTaakWeergave);

      // Één GAS-call voor alle registraties.
      slaRegistratiesOp(
        items.map(function (item) { return item._payload; }),
        tempRijen,
        function () { toonMelding(melding, 'ok'); }
      );
    }

    function zetBulkOpenstaand(taakId, status) {
      const items = bulkKandidaten(taakId, status);
      if (!items.length) {
        toonMelding('Iedereen heeft al een status.', 'ok');
        return;
      }
      voerBulkUit(
        items,
        items.length === 1 ? '1 leeg vakje ingevuld.' : items.length + ' lege vakjes ingevuld.'
      );
    }

    function zetLijstStatus(llnId, taakId, status) {
      const lln = leerlingOpId(llnId);
      const taak = taakOpId(taakId);
      if (!lln || !taak) return;
      const vorige = laatsteRegistratieVoorKlas(lln, taak, staat.gekozenKlas);
      const nieuw = (vorige && vorige.status === status) ? '' : status;
      slaRegistratieOp({
        llnId: llnId,
        taakId: taakId,
        status: nieuw,
        opmerking: nieuw ? (vorige ? vorige.opmerking : '') : ''
      }, function () {
        wisOpvolgingBijGeenTekorten(lln);
        tekenMetScroll(tekenActieveWeergave);
      });
    }

    function slaTaakForm(event) {
      event.preventDefault();
      const naam = document.getElementById('veld-nieuwe-taak-naam').value.trim();
      const type = document.getElementById('veld-nieuwe-taak-type').value;
      const deadline = document.getElementById('veld-nieuwe-taak-deadline').value;
      if (!naam || !deadline) {
        toonMelding('Vul naam en datum van de taak in.', 'fout');
        return;
      }
      if (staat.taakBewerkenId) {
        slaTaakWijzigingOp(staat.taakBewerkenId, { naam: naam, type: type, deadline: deadline }, function (taak) {
          sluitModal();
          if (taak) {
            if (taak) voegGroepToeAanFilter(taakGroep(taak));
          }
          tekenScherm();
          toonMelding('Taak opgeslagen.', 'ok');
        });
        return;
      }
      voegNieuweTaakToe(naam, type, deadline);
    }

    function voegNieuweTaakToe(naam, type, deadline) {
      const klassen = [staat.gekozenKlas].concat(gekozenExtraKlassen());
      slaTaakOp({ naam: naam, type: type, deadline: deadline, klassen: klassen }, function (taken) {
        const eerste = taken && taken[0];
        if (eerste) {
          voegGroepToeAanFilter(taakGroep(eerste));
        }
        sluitModal();
        if (eerste && staat.actieveTab === 'taak') {
          staat.lijstTaakId = eerste.id;
          tekenScherm();
          window.scrollTo(0, 0);
        } else {
          tekenScherm();
        }
        toonMelding('Taak toegevoegd aan ' + klassen.join(', ') + '.', 'ok');
      });
    }

    function vulTaakAndereKlassen() {
      document.getElementById('taak-klaslabel').textContent = klasLabel(staat.gekozenKlas);
      const wrap = document.getElementById('taak-andere-klassen-wrap');
      const box = document.getElementById('taak-andere-klassen');
      const andere = uniekeKlassen().filter(function (klas) {
        return klas !== staat.gekozenKlas;
      });
      if (!andere.length) {
        wrap.classList.add('hidden');
        box.innerHTML = '';
        return;

      wrap.classList.remove('hidden');
      box.innerHTML = andere.map(function (klas) {
        return '<label class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50 cursor-pointer">' +

          escapeHtml(klasLabel(klas)) + '</label>';
      }).join('');
    }

    function ficheStatusBadge(status, teltNietMee) {
      const stijlen = {
        'In orde': 'bg-emerald-100 text-emerald-800',
        'Niet in orde': teltNietMee ? 'bg-rose-50 text-rose-700 ring-1 ring-rose-200' : 'bg-rose-100 text-rose-800',
        'Afwezig': 'bg-slate-200 text-slate-700',
        'Te laat': 'bg-yellow-200 text-yellow-900',
        'Te maken': 'bg-yellow-50 text-yellow-800'
      };
      const klasse = stijlen[status] || 'bg-slate-100 text-slate-600';
      const tekst = teltNietMee ? 'Niet in orde · al opgevolgd' : (status || 'Nog geen registratie');
      return '<span class="shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded-full ' + klasse + '" title="' +
        escapeAttr(teltNietMee ? AL_OPGEVOLGD : tekst) + '">' +
        escapeHtml(tekst) + '</span>';

    function tekenLeerlingFiche(leerling) {
      document.getElementById('fiche-code').textContent = leerling.code || '—';
      document.getElementById('fiche-code-knop').setAttribute('data-code', leerling.code || '');
      document.getElementById('fiche-url-knop').setAttribute('data-code', leerling.code || '');
      document.getElementById('fiche-iframe-knop').setAttribute('data-code', leerling.code || '');
      document.getElementById('knop-leerling-verwijderen').setAttribute('data-id', leerling.id);
      zetFicheNaamWeergave(leerling);
      zetFicheKlasWeergave(leerling);

      const klassen = klassenVanLeerling(leerling);
      let alleItems = 0;
      let zichtbaarTotaal = 0;
      let inOrde = 0;
      let nietOk = 0;
      let afgehandeld = 0;
      let afwezig = 0;
      let teLaat = 0;
      let teMaken = 0;
      const delen = [];

      klassen.forEach(function (klas) {
        const items = [];
        takenVoorKlas(klas).forEach(function (taak) {
          const reg = laatsteRegistratieVoorKlas(leerling, taak, klas);
          if (!reg || !reg.status) return;
          items.push({ taak: taak, reg: reg });
        });
        alleItems += items.length;
        const zichtbaar = zichtbareFicheItems(items);
        zichtbaar.forEach(function (item) {
          const status = item.reg.status;
          if (status === 'In orde') inOrde += 1;
          else if (status === 'Niet in orde') {
            if (registratieTeltNietMee(leerling, item.reg)) afgehandeld += 1;
            else nietOk += 1;
          }
          else if (status === 'Afwezig') afwezig += 1;
          else if (status === 'Te laat') teLaat += 1;
          else if (status === 'Te maken') teMaken += 1;
        });
        zichtbaarTotaal += zichtbaar.length;

        const artikels = zichtbaar.map(function (item) {
          return ficheTaakArtikel(leerling, item.taak, item.reg);
        });

        const huidig = klas === leerling.klas;
        const kop = klassen.length > 1
          ? '<h4 class="px-3 py-2 text-[11px] font-semibold uppercase tracking-wide ' +
            (huidig ? 'bg-indigo-50 text-indigo-800' : 'bg-slate-50 text-slate-500') + '">' +
            escapeHtml(klasLabel(klas)) + (huidig ? ' · huidige klas' : '') + '</h4>'
          : '';
        let inhoud;
        if (artikels.length) inhoud = artikels.join('');
        else if (items.length) inhoud = '<p class="px-3 py-2.5 text-sm text-slate-500">Geen registraties voor deze filter.</p>';
        else inhoud = '<p class="px-3 py-2.5 text-sm text-slate-500">Nog geen registraties in deze klas.</p>';
        delen.push(kop + inhoud);
      });

      document.getElementById('fiche-samenvatting').textContent =
        inOrde + ' in orde · ' + nietOk + ' niet OK · ' +
        (afgehandeld ? afgehandeld + ' al opgevolgd · ' : '') +
        teLaat + ' te laat · ' + teMaken + ' te maken · ' + afwezig + ' afwezig';

      const lijst = document.getElementById('fiche-lijst');
      lijst.style.minHeight = '';
      if (!alleItems) {
        lijst.innerHTML = '<p class="p-4 text-sm text-slate-500">Nog geen registraties voor deze leerling.</p>';
      } else if (!zichtbaarTotaal) {
        lijst.innerHTML = '<p class="p-4 text-sm text-slate-500">Geen registraties voor deze filter.</p>';
      } else {
        lijst.innerHTML = delen.join('');
      }
      tekenSorteerFilterKnoppen();
      tekenFicheOpvolging(leerling);
    }

    function zichtbareFicheItems(items) {
      // Zelfde volgorde als leerling.html → recentste deadline bovenaan.
      let lijst = items.filter(function (item) {
        return groepZitInFilter(taakGroep(item.taak));
      });
      if (staat.sortering === 'soort') {
        const volgorde = ['huiswerk', 'les', 'leerkans', 'optioneel'];
        lijst.sort(function (a, b) {
          const ga = volgorde.indexOf(taakGroep(a.taak));
          const gb = volgorde.indexOf(taakGroep(b.taak));
          if (ga !== gb) return ga - gb;
          const typeCmp = String(a.taak.type || '').localeCompare(String(b.taak.type || ''), 'nl');
          if (typeCmp !== 0) return typeCmp;
          return vergelijkRecentEerst(a.taak.deadline, b.taak.deadline, a.taak.id, b.taak.id);
        });
      } else {
        lijst.sort(function (a, b) {
          return vergelijkRecentEerst(a.taak.deadline, b.taak.deadline, a.taak.id, b.taak.id);
        });
      }
      return lijst;
    }

    function ficheTaakArtikel(leerling, taak, reg) {
      const groep = taakGroep(taak);
      const kleur = GROEP_KLEUR[groep] || GROEP_KLEUR.optioneel;
      const teltNietMee = registratieTeltNietMee(leerling, reg);
      const meta = [formaatDatum(taak && taak.deadline), taak && taak.type]
        .filter(Boolean).join(' · ');
      const opmerking = reg && reg.opmerking
        ? '<p class="text-sm text-slate-600 leading-snug">' + escapeHtml(reg.opmerking) + '</p>'
        : '';
      return (
        '<article class="px-3 py-2.5">' +
          '<div class="flex items-start gap-2">' +
            '<span class="mt-1 w-0.5 self-stretch min-h-[2.5rem] rounded ' + kleur + '" aria-hidden="true"></span>' +
            '<div class="min-w-0 flex-1 space-y-0.5">' +
              '<p class="text-xs text-slate-500">' + escapeHtml(meta) + '</p>' +
              '<p class="text-sm font-semibold text-slate-900 leading-snug">' +
                escapeHtml((taak && taak.naam) || taakTitel(taak)) +
              '</p>' +
              opmerking +
            '</div>' +
            ficheStatusBadge(reg && reg.status, teltNietMee) +
          '</div>' +
        '</article>'
      );
    }

    function klassenVanLeerling(leerling) {
      const lijst = [];
      if (leerling.klas) lijst.push(leerling.klas);
      geschraptInVan(leerling).forEach(function (klas) {
        if (lijst.indexOf(klas) !== -1) return;
        if (heeftRegistratiesInKlas(leerling, klas)) lijst.push(klas);
      });
      return lijst;
    }

    function takenVoorKlas(klas) {
      return staat.taken.filter(function (taak) {
        return taakGeldtVoorKlas(taak, klas) && !isMateriaalTaak(taak);
      }).sort(function (a, b) {
        return String(a.deadline).localeCompare(String(b.deadline));
      });
    }

    function pasLeerlingNaamAan(id, naam) {
      const leerling = leerlingOpId(id);
      if (!leerling || !naam || naam === leerling.naam) return;
      slaLeerlingNaamOp(id, naam, function (bijgewerkt) {
        tekenScherm();
        tekenLeerlingFiche(bijgewerkt);
        toonMelding('Naam opgeslagen.', 'ok');
      });

    function slaLeerlingNaamOp(id, naam, naSucces) {
      const leerling = leerlingOpId(id);
      if (!leerling) return;
      const oud = leerling.naam;
      leerling.naam = naam;
      if (naSucces) naSucces(leerling);
      if (!isGasOmgeving()) {
        console.log('[LOKAAL] updateLeerling', leerling);
        return;
      }
      gasRun()
        .withSuccessHandler(function (antwoord) {
          if (antwoord && antwoord.leerling) werkLeerlingBij(antwoord.leerling);
        })
        .withFailureHandler(function (fout) {
          leerling.naam = oud;
          tekenScherm();
          if (staat.modal === 'fiche') tekenLeerlingFiche(leerling);
          toonMelding('Naam wijzigen mislukt: ' + (fout.message || fout), 'fout');
        })
        .updateLeerling({ id: id, naam: naam });
    }

    function pasLeerlingKlasAan(id, klas) {
      const leerling = staat.leerlingen.filter(function (lln) { return lln.id === id; })[0];
      if (!leerling || !klas || klas === leerling.klas) return;
      slaLeerlingKlasOp(id, klas, function (bijgewerkt) {
        voegKlasAanStaat(bijgewerkt.klas);
        vulKlasKeuze();

    function kopieerLeerlingCode(knop) {
      const code = (knop && knop.getAttribute('data-code')) || '';
      if (!code) return;
      kopieerTekst(code, function () {
        const span = document.getElementById('fiche-code');
        if (!span) return;
        span.textContent = 'gekopieerd';
        setTimeout(function () {
          const huidig = document.getElementById('fiche-code');
          if (huidig) huidig.textContent = code;
        }, 1200);
      });
    }

    function leerlingUrl(code) {
      const basis = webAppBasisUrl();
      if (!basis) return '';
      const scheiding = basis.indexOf('?') === -1 ? '?' : '&';
      return basis + scheiding + 'id=' + encodeURIComponent(code);
    }

    function kopieerLeerlingUrl(knop) {
      const code = (knop && knop.getAttribute('data-code')) || '';
      if (!code) return;
      const url = leerlingUrl(code);
      if (!url) {
        toonMelding('Vul de URL van implementatie B in bij LEERLING_IMPLEMENTATIE_URL in Code.gs.', 'fout');
        return;
      }
      const icoon = knop.innerHTML;
      kopieerTekst(url, function () {
        knop.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>';
        setTimeout(function () { knop.innerHTML = icoon; }, 1200);
      });
    }

    function kopieerLeerlingIframe(knop) {
      const code = (knop && knop.getAttribute('data-code')) || '';
      if (!code) return;
      const html = leerlingIframeHtml(code);
      if (!html) {
        toonMelding('Vul de URL van implementatie B in bij LEERLING_IMPLEMENTATIE_URL in Code.gs.', 'fout');
        return;
      }
      const icoon = knop.innerHTML;
      kopieerTekst(html, function () {
        knop.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>';
        setTimeout(function () {
          knop.innerHTML = icoon;
        }, 1200);
      });
    }

    function leerlingIframeHtml(code) {
      const src = leerlingUrl(code);
      if (!src) return '';
      const spinner = encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">' +
        '<circle cx="20" cy="20" r="14" fill="none" stroke="#e2e8f0" stroke-width="4"/>' +
        '<path d="M20 6a14 14 0 0 1 14 14" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round">' +
        '<animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="0.8s" repeatCount="indefinite"/>' +
        '</path></svg>'
      );
      return (
        '<p style="font-size:0.85em;color:#64748b;margin:0 0 0.5em 0;">' +
          'Het overzicht hieronder is aan het laden. Dit kan enkele seconden duren. Ververs de pagina als er niets verschijnt.' +
        '</p>\n' +
        '<iframe src="' + src + '" title="Opvolging leerkansen" loading="lazy" ' +
        'width="520" height="1100" frameborder="0" scrolling="no" ' +
        'style="display:block;width:100%;max-width:520px;height:1100px;border:0;' +
        'background:#fff url(\'data:image/svg+xml,' + spinner + '\') center 38% no-repeat;"></iframe>'
      );
    }

    function webAppBasisUrl() {
      // Gebruik uitsluitend de leerling-implementatie-URL (implementatie B — publiek toegankelijk).
      // De docent-URL mag hier nooit als fallback dienen: die vereist een Google-account en
      // geeft een 401 voor leerlingen/ouders.
      const leerlingUrl = String(staat.leerlingUrl || '').trim().replace(/\/+$/, '');
      if (leerlingUrl) return leerlingUrl;
      // Lokale ontwikkelomgeving: gebruik de leerling.html naast de docent.html.
      if (!isGasOmgeving()) {
        try {
          return window.location.origin + window.location.pathname.replace(/docent\.html$/i, 'leerling.html');
        } catch (e) { /* negeren */ }
      }
      return '';
    }

    function kopieerTekst(tekst, klaar) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(tekst).then(klaar).catch(function () { kopieerTekstOud(tekst, klaar); });
        return;
      }
      kopieerTekstOud(tekst, klaar);
    }

    function kopieerTekstOud(tekst, klaar) {
      const veld = document.createElement('textarea');
      veld.value = tekst;
      veld.setAttribute('readonly', '');
      veld.style.position = 'fixed';
      veld.style.left = '-9999px';
      document.body.appendChild(veld);
      veld.select();
      try { document.execCommand('copy'); } catch (e) { /* negeren */ }
      document.body.removeChild(veld);
      if (klaar) klaar();
    }

    function commitNieuweLeerling(naam, naAfloop) {
      if (!naam || staat.bezigLeerling) return;
      staat.bezigLeerling = true;
      staat.nieuweLeerlingTekst = '';
      slaLeerlingOp({ naam: naam, klas: staat.gekozenKlas }, function (leerling) {
        const taken = zichtbareTaken();
        if (naAfloop === 'omlaag') {
          staat.naLeerling = { focus: 'input' };
        } else if (naAfloop === 'omhoog') {
          const leerlingen = leerlingenVanKlas();
          const vorige = leerlingen.length > 1 ? leerlingen[leerlingen.length - 2] : null;
          if (vorige && taken[0]) {
            staat.naLeerling = { focus: 'cel', llnId: vorige.id, taakId: taken[0].id };
          } else if (taken[0]) {
            staat.naLeerling = { focus: 'cel', llnId: leerling.id, taakId: taken[0].id };
          }
        } else if (naAfloop === 'rechts' && taken[0]) {
          staat.naLeerling = { focus: 'cel', llnId: leerling.id, taakId: taken[0].id };
        }
        tekenScherm();
        staat.bezigLeerling = false;
        staat.nieuweLeerlingTekst = '';
      });
    }

    function onNieuweLeerlingToets(event) {
      const toets = String(event.key || '').toLowerCase();
      const veld = event.target;
      const naam = String(veld.value || '').trim();

      if (toets === 'escape') {
        event.preventDefault();
        veld.value = '';
        staat.nieuweLeerlingTekst = '';
        veld.blur();
        return;
      }

      if (toets !== 'enter' && toets !== 'tab' && toets.indexOf('arrow') !== 0) return;

      if (!naam) {
        if (toets === 'arrowup') {
          event.preventDefault();
          const leerlingen = leerlingenVanKlas();
          const taken = zichtbareTaken();
          if (leerlingen.length && taken.length) {
            selecteerCel(zoekCelKnop(leerlingen[leerlingen.length - 1].id, taken[0].id));
          }
        } else if (toets === 'enter' || toets === 'tab' || toets === 'arrowright' || toets === 'arrowdown') {
          event.preventDefault();
        }
        return;
      }

      event.preventDefault();
      let naAfloop = 'rechts';
      if (toets === 'enter' || toets === 'arrowdown') naAfloop = 'omlaag';
      if (toets === 'arrowup') naAfloop = 'omhoog';
      commitNieuweLeerling(naam, naAfloop);
    }

    function onNieuweLeerlingBlur(event) {
      if (staat.bezigLeerling) return;
      staat.nieuweLeerlingTekst = String(event.target.value || '');
    }

    function herstelNaLeerling() {
      const na = staat.naLeerling;
      staat.naLeerling = null;
      if (!na) return false;
      if (na.focus === 'input') {
        const veld = document.querySelector('.veld-nieuwe-leerling');
        if (veld) {
          veld.value = '';
          staat.nieuweLeerlingTekst = '';
          veld.focus();
        }
        return true;
      }
      if (na.focus === 'cel') {
        const knop = zoekCelKnop(na.llnId, na.taakId);
        if (knop) selecteerCel(knop);
        return true;
      }
      return false;
    }

          'title="' + escapeAttr(titelDelen.join(' — ')) + '" aria-label="' + escapeAttr(lln.naam + ': ' + taakTitel(taak) + ', ' + statusLabel) + '">' +
          celTekst(status) + '</button></td>';

      html += '</tr>';
      return html;

          const pos = caret == null ? veldNieuw.value.length : Math.min(caret, veldNieuw.value.length);

    function koppelLeerlingSleep(root) {
      if (!root) return;
      root.querySelectorAll('.leerling-sleep').forEach(function (knop) {
        knop.addEventListener('pointerdown', onLeerlingSleepStart);
        knop.addEventListener('keydown', onLeerlingSleepToets);
      });
    }

    function leerlingSleepRijen(startEl) {
      const tabelRij = startEl && startEl.closest ? startEl.closest('tr[data-leerling-rij]') : null;
      if (tabelRij && tabelRij.parentNode) {
        return Array.prototype.slice.call(tabelRij.parentNode.querySelectorAll('tr[data-leerling-rij]'));
      }
      const lijstRij = startEl && startEl.closest ? startEl.closest('.leerling-lijst-rij') : null;
      if (lijstRij && lijstRij.parentNode) {
        return Array.prototype.slice.call(lijstRij.parentNode.querySelectorAll('.leerling-lijst-rij'));
      }
      return [];
    }

    function onLeerlingSleepStart(event) {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      const knop = event.currentTarget;
      const rij = knop.closest('[data-leerling-rij]');
      if (!rij) return;
      event.stopPropagation();
      knop.setPointerCapture(event.pointerId);
      const rijen = leerlingSleepRijen(rij);
      const startIndex = rijen.indexOf(rij);
      const kader = rij.getBoundingClientRect();
      staat.leerlingSleep = {
        id: rij.getAttribute('data-lln'),
        rij: rij,
        knop: knop,
        startY: event.clientY,
        startIndex: startIndex,
        naar: startIndex,
        hoogte: Math.max(kader.height, 1),
        startIds: rijen.map(function (item) { return item.getAttribute('data-lln'); })
      };
      rij.classList.add('leerling-sleepend');
      document.body.classList.add('leerling-aan-het-slepen');
      knop.addEventListener('pointermove', onLeerlingSleepBeweeg);
      knop.addEventListener('pointerup', onLeerlingSleepEinde);
      knop.addEventListener('pointercancel', onLeerlingSleepEinde);
    }

    function tekenLeerlingSleepDoel(sleep) {
      const rijen = leerlingSleepRijen(sleep.rij);
      rijen.forEach(function (rij, i) {
        rij.classList.toggle('leerling-drop-doel', i === sleep.naar && i !== sleep.startIndex);
      });
    }

    function onLeerlingSleepBeweeg(event) {
      const sleep = staat.leerlingSleep;
      if (!sleep) return;
      const n = sleep.startIds.length;
      if (n < 2) return;
      const delta = event.clientY - sleep.startY;
      sleep.rij.style.transform = 'translateY(' + delta + 'px)';
      const naar = Math.max(0, Math.min(n - 1, sleep.startIndex + Math.round(delta / sleep.hoogte)));
      if (naar === sleep.naar) return;
      sleep.naar = naar;
      tekenLeerlingSleepDoel(sleep);
    }

    function wisLeerlingSleepStijl(sleep) {
      if (!sleep || !sleep.rij) return;
      sleep.rij.classList.remove('leerling-sleepend', 'leerling-drop-doel');
      sleep.rij.style.transform = '';
      const rijen = leerlingSleepRijen(sleep.rij);
      rijen.forEach(function (rij) { rij.classList.remove('leerling-drop-doel'); });
    }

    function onLeerlingSleepEinde(event) {
      const knop = event.currentTarget;
      knop.removeEventListener('pointermove', onLeerlingSleepBeweeg);
      knop.removeEventListener('pointerup', onLeerlingSleepEinde);
      knop.removeEventListener('pointercancel', onLeerlingSleepEinde);
      try { knop.releasePointerCapture(event.pointerId); } catch (e) { /* negeren */ }
      const sleep = staat.leerlingSleep;
      staat.leerlingSleep = null;
      document.body.classList.remove('leerling-aan-het-slepen');
      if (!sleep) return;
      wisLeerlingSleepStijl(sleep);
      if (sleep.naar === sleep.startIndex || sleep.startIds.length < 2) return;
      const ids = sleep.startIds.slice();
      ids.splice(sleep.startIndex, 1);
      ids.splice(sleep.naar, 0, sleep.id);
      pasLeerlingVolgordeToe(ids, true);
    }

    function onLeerlingSleepToets(event) {
      const toets = String(event.key || '').toLowerCase();
      if (toets !== 'arrowup' && toets !== 'arrowdown') return;
      event.preventDefault();
      event.stopPropagation();
      const id = event.currentTarget.getAttribute('data-lln');
      const ids = leerlingenVanKlas().map(function (lln) { return lln.id; });
      const van = ids.indexOf(id);
      const naar = toets === 'arrowup' ? van - 1 : van + 1;
      if (van < 0 || naar < 0 || naar >= ids.length) return;
      ids.splice(van, 1);
      ids.splice(naar, 0, id);
      pasLeerlingVolgordeToe(ids, true);
      requestAnimationFrame(function () {
        const knoppen = document.querySelectorAll('.leerling-sleep');
        for (let i = 0; i < knoppen.length; i++) {
          if (knoppen[i].getAttribute('data-lln') === id) {
            knoppen[i].focus();
            break;
          }
        }
      });
    }

    function pasLeerlingVolgordeToe(ids, herteken) {
      if (!ids || ids.length < 2) return;
      const klas = staat.gekozenKlas;
      const plaats = {};
      ids.forEach(function (id, i) { plaats[id] = i + 1; });
      let gewijzigd = false;
      staat.leerlingen.forEach(function (lln) {
        if (lln.klas !== klas || leerlingVerwijderd(lln)) return;
        const n = plaats[lln.id];
        if (!n) return;
        if (leerlingVolgordeGetal(lln) !== n) {
          lln.volgorde = n;
          gewijzigd = true;
        }
      });
      if (!gewijzigd) return;
      slaLeerlingVolgordeOp(klas, ids);
      if (herteken) tekenActieveWeergave();
      else tekenOpvolgActies();
    }

    function slaLeerlingVolgordeOp(klas, ids) {
      if (!isGasOmgeving()) {
        console.log('[LOKAAL] saveLeerlingVolgorde', klas, ids);
        return;
      }
      gasRun()
        .withFailureHandler(function (fout) {
          toonMelding('Volgorde opslaan mislukt: ' + (fout.message || fout), 'fout');
        })
        .saveLeerlingVolgorde({ klas: klas, ids: ids });
    }

    /** Naamkolom volgt de langste naam; vakkolommen blijven vast op --vak. */
    function lijnKoppenOpTabel(wrapper) {
      const binnen = wrapper.querySelector('.kruis-binnen');
      const naamCellen = wrapper.querySelectorAll('.kruistabel tbody th');
      if (!binnen || !naamCellen.length) return;
      let naamW = 0;
      naamCellen.forEach(function (th) {
        naamW = Math.max(naamW, th.scrollWidth);
      });
      if (!naamW) return;
      binnen.style.setProperty('--naam', naamW + 'px');
    }

    function celStatusLabel(status, teltNietMee) {
      if (teltNietMee) return 'Niet in orde — al opgevolgd';
      return status || 'Nog geen registratie';
    }

    function celKlassen(status, teltNietMee) {
      if (status === 'In orde') return 'bg-emerald-500 text-white hover:bg-emerald-600';
      if (status === 'Niet in orde') {
        return teltNietMee
          ? 'bg-rose-200 text-rose-800 hover:bg-rose-300'
          : 'bg-rose-500 text-white hover:bg-rose-600';
      }
      if (status === 'Afwezig') return 'bg-slate-400 text-white hover:bg-slate-500';
      if (status === 'Te laat') return 'bg-yellow-400 text-yellow-950 hover:bg-yellow-500';
      if (status === 'Te maken') return 'bg-yellow-100 text-yellow-900 hover:bg-yellow-200';
      return 'bg-slate-200 text-slate-400 hover:bg-slate-300';
    }

    function celTekst(status) {
      if (status === 'In orde') return '✓';
      if (status === 'Niet in orde') return '✕';
      if (status === 'Afwezig') return 'A';
      if (status === 'Te laat') return 'L';
      if (status === 'Te maken') return '•';
      return '';
    }

    function zoekCelKnop(llnId, taakId) {
      const knoppen = document.querySelectorAll('.cel-status');
      for (let i = 0; i < knoppen.length; i++) {
        if (knoppen[i].getAttribute('data-lln') === llnId && knoppen[i].getAttribute('data-taak') === taakId) {
          return knoppen[i];
        }
      }
      return null;
    }

    function celVanKnop(knop) {
      return {
        llnId: knop.getAttribute('data-lln'),
        taakId: knop.getAttribute('data-taak')
      };
    }

    function celInSelectie(llnId, taakId) {
      return staat.selectie.some(function (cel) {
        return cel.llnId === llnId && cel.taakId === taakId;
      });
    }

    function rechthoekSelectie(start, einde) {
      const leerlingen = leerlingenInKruistabel();
      const taken = zichtbareTaken();
      let r1 = leerlingen.findIndex(function (l) { return l.id === start.llnId; });
      let r2 = leerlingen.findIndex(function (l) { return l.id === einde.llnId; });
      let c1 = taken.findIndex(function (t) { return t.id === start.taakId; });
      let c2 = taken.findIndex(function (t) { return t.id === einde.taakId; });
      if (r1 < 0 || r2 < 0 || c1 < 0 || c2 < 0) return [einde];
      const rMin = Math.min(r1, r2);
      const rMax = Math.max(r1, r2);
      const cMin = Math.min(c1, c2);
      const cMax = Math.max(c1, c2);
      const result = [];
      for (let r = rMin; r <= rMax; r++) {
        for (let c = cMin; c <= cMax; c++) {
          result.push({ llnId: leerlingen[r].id, taakId: taken[c].id });
        }
      }
      return result;
    }

    function tekenSelectie() {
      document.querySelectorAll('.cel-status').forEach(function (knop) {
        knop.classList.toggle('cel-actief', celInSelectie(knop.getAttribute('data-lln'), knop.getAttribute('data-taak')));
      });
    }

    function voegSelectiesSamen(a, b) {
      const gezien = {};
      const result = [];
      function voeg(cel) {
        const sleutel = cel.llnId + '\t' + cel.taakId;
        if (gezien[sleutel]) return;
        gezien[sleutel] = true;
        result.push({ llnId: cel.llnId, taakId: cel.taakId });
      }
      (a || []).forEach(voeg);
      (b || []).forEach(voeg);
      return result;
    }

    function wisselCelInSelectie(cel) {
      if (celInSelectie(cel.llnId, cel.taakId)) {
        staat.selectie = staat.selectie.filter(function (item) {
          return !(item.llnId === cel.llnId && item.taakId === cel.taakId);
        });
      } else {
        staat.selectie = staat.selectie.concat([cel]);
      }
    }

    function selecteerCel(knop) {
      if (!knop) {
        staat.geselecteerd = null;
        staat.selectie = [];
        staat.selectieAnker = null;
        tekenSelectie();
        return;
      }
      const cel = celVanKnop(knop);
      staat.geselecteerd = cel;
      staat.selectieAnker = cel;
      staat.selectie = [cel];
      tekenSelectie();
      knop.focus();
    }

    function herstelSelectie() {
      staat.selectie = (staat.selectie || []).filter(function (cel) {
        return !!zoekCelKnop(cel.llnId, cel.taakId);
      });
      if (staat.geselecteerd && !zoekCelKnop(staat.geselecteerd.llnId, staat.geselecteerd.taakId)) {
        staat.geselecteerd = staat.selectie[0] || null;
      }
      if (staat.selectieAnker && !zoekCelKnop(staat.selectieAnker.llnId, staat.selectieAnker.taakId)) {
        staat.selectieAnker = staat.geselecteerd;
      }
      tekenSelectie();
      if (!staat.geselecteerd) return;
      const knop = zoekCelKnop(staat.geselecteerd.llnId, staat.geselecteerd.taakId);
      if (knop) knop.focus();
    }

    function knopOnderPunt(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el || !el.closest) return null;
      const knop = el.closest('.cel-status');
      if (knop) return knop;
      const td = el.closest('td.td-cel');
      return td ? td.querySelector('.cel-status') : null;
    }

    function knopVanPointerEvent(event) {
      if (event.currentTarget && event.currentTarget.classList && event.currentTarget.classList.contains('cel-status')) {
        return event.currentTarget;
      }
      if (event.currentTarget && event.currentTarget.querySelector) {
        return event.currentTarget.querySelector('.cel-status');
      }
      return knopOnderPunt(event.clientX, event.clientY);
    }

    function onCelPointerDown(event) {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      const knop = knopVanPointerEvent(event);
      if (!knop) return;
      if (event.pointerType === 'touch') {
        selecteerCel(knop);
        return;
      }
      event.preventDefault();
      const cel = celVanKnop(knop);
      const toevoegen = !!(event.ctrlKey || event.metaKey);
      const bereik = !!event.shiftKey;

      if (toevoegen && !bereik) {
        staat.slepen = true;
        staat.sleepModus = 'toevoegen';
        staat.sleepStart = cel;
        staat.sleepPunt = { x: event.clientX, y: event.clientY };
        staat.sleepBasis = (staat.selectie || []).slice();
        staat.sleepVerplaatst = false;
        staat.geselecteerd = cel;
        if (!staat.selectieAnker) staat.selectieAnker = cel;
        staat.selectie = voegSelectiesSamen(staat.sleepBasis, [cel]);
        tekenSelectie();
        document.body.classList.add('kruis-slepen');
        knop.focus();
        return;
      }

      if (bereik && (staat.selectieAnker || staat.geselecteerd)) {
        const anker = staat.selectieAnker || staat.geselecteerd;
        staat.sleepModus = '';
        staat.sleepBasis = [];
        staat.sleepVerplaatst = false;
        staat.geselecteerd = cel;
        staat.selectie = rechthoekSelectie(anker, cel);
        staat.slepen = true;
        staat.sleepPunt = { x: event.clientX, y: event.clientY };
        staat.sleepStart = anker;
        tekenSelectie();
        document.body.classList.add('kruis-slepen');
        knop.focus();
        return;
      }

      staat.selectieAnker = cel;
      staat.slepen = true;
      staat.sleepModus = '';
      staat.sleepBasis = [];
      staat.sleepVerplaatst = false;
      staat.sleepPunt = { x: event.clientX, y: event.clientY };
      staat.sleepStart = cel;
      staat.geselecteerd = cel;
      staat.selectie = [cel];
      tekenSelectie();
      document.body.classList.add('kruis-slepen');
      // Geef de cel expliciet focus zodat toetsenbordshortcuts meteen werken,
      // ook als een inputveld (bijv. leerlingnaam) nog de focus had.
      knop.focus({ preventScroll: true });
    }

    function onDocumentPointerMove(event) {
      if (!staat.slepen || !staat.sleepStart) return;
      event.preventDefault();
      if (!staat.sleepVerplaatst && staat.sleepPunt) {
        const dx = event.clientX - staat.sleepPunt.x;
        const dy = event.clientY - staat.sleepPunt.y;
        if ((dx * dx) + (dy * dy) < 64) return;
      }
      const knop = knopOnderPunt(event.clientX, event.clientY);
      if (!knop) return;
      const einde = celVanKnop(knop);
      if (einde.llnId !== staat.sleepStart.llnId || einde.taakId !== staat.sleepStart.taakId) {
        staat.sleepVerplaatst = true;
      }
      staat.geselecteerd = einde;
      const blok = rechthoekSelectie(staat.sleepStart, einde);
      staat.selectie = staat.sleepModus === 'toevoegen'
        ? voegSelectiesSamen(staat.sleepBasis, blok)
        : blok;
      tekenSelectie();
    }

    function onDocumentPointerUp() {
      if (!staat.slepen) return;
      if (staat.sleepModus === 'toevoegen' && !staat.sleepVerplaatst && staat.sleepStart) {
        staat.selectie = (staat.sleepBasis || []).slice();
        wisselCelInSelectie(staat.sleepStart);
        staat.geselecteerd = celInSelectie(staat.sleepStart.llnId, staat.sleepStart.taakId)
          ? staat.sleepStart
          : (staat.selectie[staat.selectie.length - 1] || null);
        tekenSelectie();
      }
      staat.slepen = false;
      staat.sleepStart = null;
      staat.sleepModus = '';
      staat.sleepBasis = [];
      staat.sleepVerplaatst = false;
      staat.sleepPunt = null;
      document.body.classList.remove('kruis-slepen');
    }

    function klikInKruisGrid(event) {
      const wrapper = document.getElementById('kruistabel-wrapper');
      const tabel = wrapper && wrapper.querySelector('table.kruistabel');
      if (!tabel) return false;
      const x = event.clientX;
      const y = event.clientY;
      const tabelRect = tabel.getBoundingClientRect();
      if (x >= tabelRect.left && x <= tabelRect.right && y >= tabelRect.top && y <= tabelRect.bottom) {
        return true;
      }
      const koppen = wrapper.querySelectorAll('.kruis-titels, .kruis-datums');
      for (let i = 0; i < koppen.length; i++) {
        const r = koppen[i].getBoundingClientRect();
        if (x >= tabelRect.left && x <= tabelRect.right && y >= r.top && y <= r.bottom) {
          return true;
        }
      }
      return false;
    }

    function onDocumentPointerDown(event) {
      if (staat.slepen) return;
      if (modalOpen()) return;
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      if (!staat.geselecteerd && !(staat.selectie && staat.selectie.length)) return;
      const doel = event.target;
      if (doel && doel.closest && (doel.closest('.legende-status') || doel.closest('[data-actie="al-opgevolgd"]'))) return;
      if (klikInKruisGrid(event)) return;
      selecteerCel(null);
    }

    function werkCelNaRegistratie(cel, reg, status) {
      const knop = zoekCelKnop(cel.llnId, cel.taakId);
      if (!knop) return;
      const lln = leerlingOpId(cel.llnId);
      const taak = taakOpId(cel.taakId);
      const teltNietMee = registratieTeltNietMee(lln, reg);
      const statusLabel = celStatusLabel(status, teltNietMee);
      const actief = celInSelectie(cel.llnId, cel.taakId) ? ' cel-actief' : '';
      knop.className = 'cel-status' + actief + ' ' + celKlassen(status, teltNietMee);
      knop.textContent = celTekst(status);
      knop.setAttribute('title', taak
        ? [taakTitel(taak), statusLabel].concat(reg && reg.opmerking ? [reg.opmerking] : []).join(' — ')
        : statusLabel);
      knop.setAttribute('aria-label', (lln && taak)
        ? lln.naam + ': ' + taakTitel(taak) + ', ' + statusLabel
        : statusLabel);
      if (lln) {
        wisOpvolgingBijGeenTekorten(lln);
        verversOpvolgingUI(lln);
        if (staat.modal === 'fiche') {
          const ficheKnop = document.getElementById('knop-leerling-verwijderen');
          if (ficheKnop && ficheKnop.getAttribute('data-id') === lln.id) {
            tekenLeerlingFiche(lln);
          }
        }
      }
    }

    function pasGeselecteerdeStatus(status) {
      const cellen = staat.selectie && staat.selectie.length
        ? staat.selectie
        : (staat.geselecteerd ? [staat.geselecteerd] : []);
      if (!cellen.length) return;
      const leeg = !status;
      const klas = staat.gekozenKlas || '';

      // Optimistisch: alle cellen meteen lokaal bijwerken en tegelijk payload opbouwen.
      const payloads = [];
      const tempRijen = [];
      cellen.forEach(function (cel) {
        const vorige = laatsteRegistratieVoorKlas(leerlingOpId(cel.llnId), taakOpId(cel.taakId), klas);
        const payload = {
          llnId: cel.llnId,
          taakId: cel.taakId,
          status: status || '',
          opmerking: leeg ? '' : (vorige ? vorige.opmerking : ''),
          klas: klas
        };
        const tempRij = Object.assign({ datumTijd: nieuweTijdstempel() }, payload);
        staat.registraties.push(tempRij);
        tempRijen.push(tempRij);
        payloads.push(payload);
        werkCelNaRegistratie(cel, tempRij, status);
      });
      tekenSelectie();

      // Één GAS-call voor alle wijzigingen.
      slaRegistratiesOp(payloads, tempRijen);
    }

    function pasGeselecteerdeAlOpgevolgd() {
      const cellen = staat.selectie && staat.selectie.length
        ? staat.selectie
        : (staat.geselecteerd ? [staat.geselecteerd] : []);
      if (!cellen.length) return;
      const klas = staat.gekozenKlas || '';

      const geenReset = [];
      const payloads = [];
      const tempRijen = [];

      cellen.forEach(function (cel) {
        const lln = leerlingOpId(cel.llnId);
        if (!String(lln && lln.opvolgingResetOp || '').trim()) {
          if (lln) geenReset.push(lln.naam);
          return;
        }
        const vorige = laatsteRegistratieVoorKlas(lln, taakOpId(cel.taakId), klas);
        const payload = {
          llnId: cel.llnId,
          taakId: cel.taakId,
          status: 'Niet in orde',
          opmerking: vorige ? vorige.opmerking : '',
          klas: klas,
          alOpgevolgd: true
        };
        const tempRij = Object.assign({ datumTijd: nieuweTijdstempel() }, payload);
        staat.registraties.push(tempRij);
        tempRijen.push(tempRij);
        payloads.push(payload);
        werkCelNaRegistratie(cel, tempRij, 'Niet in orde');
      });
      tekenSelectie();

      if (payloads.length) slaRegistratiesOp(payloads, tempRijen);

      if (geenReset.length) {
        const uniek = geenReset.filter(function (naam, i, arr) { return arr.indexOf(naam) === i; });
        toonMelding(
          'Al opgevolgd kan pas nadat je de opvolging hebt afgerond voor: ' + uniek.join(', ') + '.',
          'fout'
        );
      }
    }

    function verplaatsSelectie(richting) {
      const knoppen = Array.prototype.slice.call(document.querySelectorAll('.cel-status'));
      if (!knoppen.length) return;
      const kolommen = gesorteerdeTaken().length || 1;
      let index = knoppen.findIndex(function (k) {
        return staat.geselecteerd &&
          k.getAttribute('data-lln') === staat.geselecteerd.llnId &&
          k.getAttribute('data-taak') === staat.geselecteerd.taakId;
      });
      if (index < 0) index = 0;
      else if (richting === 'arrowleft') index -= 1;
      else if (richting === 'arrowright') index += 1;
      else if (richting === 'arrowup') index -= kolommen;
      else if (richting === 'arrowdown') {
        const actieveCellen = leerlingenVanKlas().length * kolommen;
        if (index < actieveCellen && index + kolommen >= actieveCellen) {
          const veld = document.querySelector('.veld-nieuwe-leerling');
          if (veld) {
            selecteerCel(null);
            veld.focus();
          }
          return;
        }
        index += kolommen;
      }
      if (index >= knoppen.length && richting === 'arrowdown') {
        const veld = document.querySelector('.veld-nieuwe-leerling');
        if (veld) {
          selecteerCel(null);
          veld.focus();
        }
        return;
      }
      if (index < 0 || index >= knoppen.length) return;
      selecteerCel(knoppen[index]);
    }

    function onKruisToets(event) {
      if (staat.actieveTab !== 'kruistabel' || !staat.gekozenKlas) return;
      // Gebruik activeElement (niet event.target): na een re-render kan event.target <body> zijn
      // terwijl de gebruiker gewoon aan het typen is in het leerlinginputveld.
      const actief = document.activeElement;
      const tag = ((actief && actief.tagName) || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
      if (actief && actief.closest && actief.closest('.leerling-sleep')) return;
      if (modalOpen()) {
        if (String(event.key || '').toLowerCase() === 'escape') sluitModal();
        return;
      }

      const toets = String(event.key || '').toLowerCase();
      if (toets === 'backspace' || toets === 'delete') {
        event.preventDefault();
        pasGeselecteerdeStatus('');
        return;
      }
      if (toets === '6') {
        event.preventDefault();
        pasGeselecteerdeAlOpgevolgd();
        return;
      }
      if (STATUS_TOETSEN[toets]) {
        event.preventDefault();
        pasGeselecteerdeStatus(STATUS_TOETSEN[toets]);
        return;
      }
      if (toets === 'arrowleft' || toets === 'arrowright' || toets === 'arrowup' || toets === 'arrowdown') {
        event.preventDefault();
        verplaatsSelectie(toets);
      }
    }

    function wisselTab(naam) {
      if (schermIsSmal()) {
        naam = naam === 'taak' ? 'taak' : 'leerling';
        staat.mobieleTab = naam;
      } else {
        naam = 'kruistabel';
      }
      staat.actieveTab = naam;
      tekenScherm();
    }

    function escapeHtml(waarde) {
      return String(waarde == null ? '' : waarde)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeAttr(waarde) {
      return escapeHtml(waarde).replace(/'/g, '&#39;');
    }

      else if (actie === 'leerling-fiche') openLeerlingFiche(doel.getAttribute('data-id'));
      else if (actie === 'code-kopieren') kopieerLeerlingCode(doel);
      else if (actie === 'url-kopieren') kopieerLeerlingUrl(doel);
      else if (actie === 'iframe-kopieren') kopieerLeerlingIframe(doel);
      else if (actie === 'leerling-verwijderen') vraagLeerlingVerwijderen(doel.getAttribute('data-id'));

      else if (actie === 'prullenbak-openen') openPrullenbak();
      else if (actie === 'instellingen-openen') openInstellingen();
      else if (actie === 'prullenbak-legen') bevestigPrullenbakLegen();
      else if (actie === 'reset-schooljaar') bevestigResetSchooljaar();
      else if (actie === 'leerling-herstellen') zetLeerlingTerug(doel.getAttribute('data-id'));

      else if (actie === 'klas-verwijderen-bevestigen') bevestigKlasVerwijderen();
      else if (actie === 'modal-sluiten') sluitModal();

      // Geef focus terug na een knopklik buiten een modal, zodat de kruistabel
      // direct bruikbaar blijft en knoppen geen focus-ring blijven tonen.
      if (doel.tagName === 'BUTTON' && !doel.closest('[role="dialog"]')) {
        doel.blur();
      }
    });
    document.addEventListener('keydown', function (event) {
      if (!modalOpen() || String(event.key || '').toLowerCase() !== 'escape') return;
      if (!document.getElementById('fiche-naam-edit').classList.contains('hidden')) {
        event.preventDefault();
        event.stopImmediatePropagation();
        sluitFicheNaamBewerken();
        return;
      }
      if (!document.getElementById('fiche-klas-edit').classList.contains('hidden')) {
        event.preventDefault();
        event.stopImmediatePropagation();
        sluitFicheKlasBewerken();
        return;
      }
      sluitModal();
    });

    document.getElementById('veld-klas').addEventListener('change', function (event) {
      const waarde = event.target.value;
      if (waarde === '__nieuw__') {
        event.target.value = staat.gekozenKlas || '';
        openNieuweKlasModal();
        return;
      }
      event.target.blur();
      kiesKlas(waarde);
    });
    document.getElementById('tab-leerling').addEventListener('click', function () { wisselTab('leerling'); });
    document.getElementById('tab-taak').addEventListener('click', function () { wisselTab('taak'); });
    document.addEventListener('keydown', onKruisToets);
    document.addEventListener('pointerdown', onDocumentPointerDown);
    document.addEventListener('pointermove', onDocumentPointerMove, { passive: false });
    document.addEventListener('pointerup', onDocumentPointerUp);
    document.addEventListener('pointercancel', onDocumentPointerUp);

    document.querySelectorAll('.legende-status').forEach(function (knop) {
      knop.addEventListener('click', function () {
        pasGeselecteerdeStatus(knop.getAttribute('data-status'));
      });
    });

    window.addEventListener('resize', function () {
      zetLijstDetailChrome();
      pasTabAanScherm();
    });

    pasTabAanScherm();
    haalDocentData();
  </script>
